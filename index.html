", "kind": "feature", "title": "Materials: wood now, concrete later", "status": "verify", "priority": "", "section": ["Weapons and pickups"], "progress": "", "file": "", "needs": "In Tower Sandbox: do the wood chips and chunks feel satisfying for shots, swings and blasts? Too many, too few?", "related": "F-019, F-073", "added": "2026-10-24", "edited": "2026-10-26 12:29", "body": [{"p": "**(Claude)** Asked for in chat. Things you can break are made of a material, and each kind of weapon is weaker or stronger against it. Wood (the sniper towers): the chainsaw cuts a leg through in about half a second, the sledge does twice its damage (more than the spear or nightstick), blasts 3 times (a rocket snaps a leg in one), guns and blades as normal. Concrete is set up for later: weak to the sledge, strong against blasts, saws and bullets. The numbers sit in each material's file (`materials/*.tres`, F-090; `Materials.WEAKNESS` only holds concrete for now); each weapon says what kind of hit it is (`hit_kind`)."}]}, {"id": "F-085", "kind": "feature", "title": "Wood breaks the way each weapon would break it", "status": "verify", "priority": "", "section": ["Weapons and pickups"], "progress": "", "file": "", "needs": "In Tower Sandbox: do bullets, the sledge, the chainsaw and a rocket each leave wood that looks and breaks differently?", "related": "F-084, F-090, F-019", "added": "2026-10-24", "edited": "2026-10-26 12:34", "body": [{"p": "**(Claude)** Asked for in chat, redone on cells (F-090) after the first version looked too basic. Wood in the Tower Sandbox is now made of small cells, and each weapon carves them its own way:"}, {"ul": ["Bullets chip 1-3 cells and leave small pits. A long burst on one spot opens a ragged hole.", "Blades gouge short grooves; the nightstick crushes a wide dent.", "The sledge knocks a random rough lump out of the side it hit, sometimes with a crack along the grain. Every break is different and the ends are ragged.", "The chainsaw cuts one flat slice, deeper each hit, and the log parts there with only sawdust.", "A rocket tears a rough ball out, so the leg splinters through."]}, {"p": "A log breaks wherever what's left can't hold together. Hits to sever one leg on one spot: sledge 3-7, chainsaw 3 (under a second), Longsight 6-13, Kestrel 40-200 (it varies, that is the point), one rocket at the foot."}]}, {"id": "F-086", "kind": "feature", "title": "Test map with \"Reset environment\"", "status": "verify", "priority": "", "section": ["Maps", "New maps"], "progress": "", "file": "", "needs": "Pause in Tower Sandbox and pick Reset environment: do all four towers stand again and the chips go?", "related": "F-019", "added": "2026-10-24", "edited": "2026-10-26 12:29", "body": [{"p": "**(Claude)** Asked for in chat. The Tower Sandbox is a testing map, for towers and anything else that needs trying out: 100 m across, four breakable sniper towers, the weapons in the middle. A map marked as a test map (`test_map` on the map) gets a \"Reset environment\" row in the pause menu: every breakable tower is rebuilt, wood chips are cleared and every pickup comes back. Players stay where they are (standing where a tower rebuilds could leave you inside it). Also: maps now give bots a walkable floor from plain box floors as well as CSG ones (the sandbox had none)."}]}, {"id": "F-090", "kind": "feature", "title": "Destruction foundation: materials made of cells", "status": "verify", "priority": "", "section": ["Weapons and pickups"], "progress": "", "file": "", "needs": "In Tower Sandbox: does chopping a leg feel smooth, also in 4-player splitscreen? Does the wood look right up close?", "related": "F-084, F-085, F-019, F-073", "added": "2026-10-26", "edited": "2026-10-26 15:02", "body": [{"p": "**(Claude)** Asked for in chat. The base for everything breakable from now on (concrete, metal and plastic come later). A breakable thing is a grid of small cells of one material (`scripts/destruction/`). A hit carves cells out in a shape its material and the weapon decide (`materials/wood.tres` holds the shapes, sizes and weaknesses, so a new material is one new file). Thin parts tear, a log that falls in two becomes two pieces that keep their speed, and joints get floppy as the wood at them is eaten away. Only the Tower Sandbox uses it; normal maps keep the solid tower. Numbers are in VALUES/materials.md."}]}, {"id": "F-091", "kind": "feature", "title": "Materials: brick, concrete, metal, glass, drywall, plastic, planks, steel", "status": "verify", "priority": "", "section": ["Weapons and pickups"], "progress": "", "file": "", "needs": "Does each material feel different to break? Glass shatter, drywall wallbangs, concrete holes?", "related": "F-090, F-073", "added": "2026-10-26", "edited": "2026-10-26 15:02", "body": [{"p": "**(Claude)** Asked for in chat, as the kit for the city (F-073). Each is one file in `materials/` with its own look, debris and six hit shapes. Brick crumbles in lumps, concrete is tough and takes holes from rockets, sheet metal gets small holes and sparks, glass shatters whole, drywall is weak (bullets go through), plastic cracks, planks snap, steel only has joints. Numbers are in VALUES/materials.md."}]}, {"id": "F-092", "kind": "feature", "title": "Materials Yard (test map)", "status": "verify", "priority": "", "section": ["Maps", "New maps"], "progress": "", "file": "", "needs": "Walk each building with each weapon. Smooth in 4-player splitscreen while wrecking things?", "related": "F-091, F-090, F-073", "added": "2026-10-26", "edited": "2026-10-29 17:22", "body": [{"p": "**(Claude)** Asked for in chat. A test map (Reset environment in the pause menu) with a breakable tower, a wooden shed (falls in a heap), a brick cottage (walls crumble, glass shatters, stands), a concrete bunker (holes in the walls, frame stays), a metal container with a plank footbridge to the bunker roof, and an office corner (glass front, drywall partitions). Pickups as in the Tower Sandbox. Bots and the mini-map ignore breakable pieces for now (city plan, phase C1)."}, {"p": "**(Claude, 2026-10-26 15:55)** Holes in walls can be shot and walked through. Buildings now collapse when the support under them is destroyed. The yard is 160 x 160 m with bigger, multi-storey buildings with ramps. Picking up an owned weapon refills it to full reserve."}, {"p": "**(Claude, 2026-10-26 16:15)** Townhouse stairs are carvable planks now and no longer hold floors up, so the house falls when its walls go. Falling floors drop in waves (lowest first) and break into smaller pieces where they hit the ground. `BreakableStructure` has `collapsed` and `piece_broke` signals for Will's sound effects."}, {"p": "**(Claude, 2026-10-26 16:58)** Buildings now have a stress graph: joints between touching pieces carry load (area x material strength x what is left of the cells). When a joint is overloaded it snaps with a torn crack, and what is cut off falls as one FallingSection (a single body, not dozens of tiles). Landing sections crack along weak joints, carve what they hit and can overload the floor below. Settled rubble freezes in place and wakes when hit; only about 40 sections move at once. All stairs are carvable. Pause menu on test maps has Show stress. Strength values in materials/*.tres need playtest tuning; bots and the navmesh still ignore breakables."}, {"p": "**(Claude, 2026-10-26 18:10)** Playtest fix: nothing fell until ~90% was gone, parts hung in the air, big stutter. Now `hold_margin` (2.0) sets how much every joint and wall carries: twice its load as built, so a building runs at 50% and gives way at about half. A wall breaks at its thinnest slice (`BreakablePiece.weakest_slice`); bits that come off join the building (`_enroll`). `MaterialDef.strength` is gone. Sections freeze only after resting on something (`is_resting`), start slightly smaller and ghost through what they overlap. The check runs a few passes a frame and cracks go through a 3 ms job queue. Show stress draws a ring at each wall's weakest slice and a % label. Needs: Weapon Range on the Materials Yard, Show stress on; cut about half of the townhouse ground walls and the upper storey should drop in a few sections."}, {"p": "**(Claude, 2026-10-26 18:46)** Less stutter in a collapse. Landings no longer crack and carve in the same frame: that work goes through the job queue, and cracks on the same piece are batched (`BreakablePiece.crack_many`, one rebuild). Splinters are capped at 30 new bodies a frame (`Splinters.PER_FRAME`), with a light spray for collapse cracks (`Splinters.LIGHT`). Sections only use continuous collision when a box is under 0.15 m thick (`FallingSection.CCD_THICK`). Faster `CellGrid.chunk_arrays` and exact boxes. The perf probe's new mass-disconnect test cuts every ground-floor wall at once. Worst headless frame went from 115-314 ms to about 20-30 ms."}, {"p": "**(Claude, 2026-10-26 19:31)** Rubble fixes from the step 121 playtest. A falling section's pieces are frozen static, not kinematic. Jolt sometimes wrote a kinematic piece's old place back, which left it hanging in the air. Section bodies are on their own `Layers.RUBBLE` layer and meet other sections body to body, never through their pieces. Pushing against those pieces sent sections flying up, which is where the barn's pieces went. A settled section checks for support every `FallingSection.HOLD_CHECK` (0.5 s) and wakes if nothing is within `HOLD_GAP` under it. Carving wakes rubble nearby (`BreakableStructure.wake_in`, `WAKE_CELLS`). `BreakablePiece.MIN_ISLAND_VOLUME` dropped from 0.05 to 0.006 m³. A split floor or ramp counts as grounded only if some wood still reaches the ground. New `tests/rubble_probe.gd` is in check.ps1."}, {"p": "**(Claude, 2026-10-26 20:24)** To do later: the step 122 playtest went well, but some bigger chunks seem to vanish too quickly when they come loose and hit the ground. They probably break into crumbs on landing, through the landing carve and the debris for islands under `MIN_ISLAND_VOLUME`. Ideas: break up less on landing, or keep larger lumps as pieces. Watch performance."}, {"p": "**(Claude, 2026-10-26 20:28)** A skyscraper (`scripts/world/structures/skyscraper.gd`, `maps/props/skyscraper.tscn`) sits in the middle of the Materials Yard. It has 9 storeys over a 10 x 10 m footprint, 29 m tall, and 279 pieces. The open ground storey has only 4 corner stilts (0.8 m), and the 8 closed storeys above have ribbon windows, 3 x 3 floor tiles and a roof plant room. The yard probe guts the stilts and checks that the floors and roof come down. The collapse perf probe's disconnect test includes it (worst frame about 13 ms headless)."}, {"p": "**(Claude, 2026-10-26 20:56)** Step 124: buildings no longer lose big pieces as they fall (step 123 playtest). The main cause: a joint crack on a tilted piece went from the piece's space to world space and back (`crack_many`), and the box grew round the tilt each time. So a 20 cm crack took out a slab up to 0.8 m³. `crack_many` now takes boxes in the piece's own space. A hard landing (`BREAK_SPEED` 4 m/s) breaks the piece it hits in two across its length (`BreakablePiece.break_across`, pieces over `BREAK_LENGTH` 1.2 m) instead of carving a crater. Softer landings bite at most `IMPACT_BITE` 20 damage. Pieces with no cells left are now gone. In a headless skyscraper collapse, landings and cracks lose about 8k cells, down from 45-60k. This also covers the earlier note that bigger chunks vanish too quickly."}, {"p": "**(Claude, 2026-10-26 21:04)** To do later: the user finds step 124 good enough for now, but the game lags while the skyscraper falls. The GPU runs at 20-30% and CPU use looks low. That suggests one busy main thread: GDScript cell work (`crack_many`/`_finish`: tear, `islands()` flood fill, `chunk_arrays` mesh and box rebuild, `_split_off`) and the section bookkeeping all run on one core. Ideas:"}, {"ul": ["profile a real (rendered, 4-view) fall with `BreakableStructure.perf` and the Godot profiler", "move mesh arrays and islands onto `WorkerThreadPool`", "port `CellGrid` hot loops to GDExtension (C++) or C#", "cap or merge small falling sections (the tipping tower reached about 140)", "check Jolt's thread settings"]}, {"p": "An engine change is not expected to help."}, {"p": "**(Claude, 2026-10-27 13:16)** Steps 125-139, collapse speed. Profiling (`tests/run_fall_profile.gd`) showed our GDScript cell work and draw calls were the limit, not the GPU. Rendering runs on its own thread; a standing building is one merged mesh per material (`BreakableStructure._merge`); jobs run once per drawn frame; big pieces flood only near the hole (`CellGrid.islands_near`). New City Block map (map 4) and an F1 fps label. A C++ GDExtension (`native/`, plan in `PLANS/NATIVE_PLAN.md`) now does the flood fills, chunk meshes and the support solve, checked against the old GDScript by `tests/run_native_probe.gd`. Next: worker threads (N5), then the City gate (N6: 60+ fps in a 4-view fall, no frame over 50 ms)."}, {"p": "**(Claude, 2026-10-27 20:34)** Step 140 (N5a): N5 planned in `PLANS/NATIVE_PLAN.md` (the spikes are single big hits, so the cell work they do moves to C++ first, then threads). `CellGrid.chunk_boxes` is now `CellCore.chunk_boxes` (C++), bit-exact against the old GDScript (kept in `tests/cell_grid_reference.gd`), 37x faster. City fall worst frame about 60 ms down to 36-43. LONG JOB lines now list the job's own timers: next is `CellGrid.carve` (up to 12 ms on PlantRoom)."}, {"p": "**(Claude, 2026-10-27 20:47)** Step 141 (N5a2): `CellGrid.carve` (with the sphere bite, first_solid and the crack) is now `CellCore.carve` (C++). It calls the piece's own RandomNumberGenerator and sorts with Godot's own SortArray, so it takes the same cells in the same order as the old GDScript (kept in `tests/cell_grid_reference.gd`): the native probe checks 400 random hits of every shape, with the cells, counts, sum and rng state all equal. 8-10x faster; carve is gone from the LONG JOB lines. The City fall now shows a 110-130 ms first frame after the cut, all render-side (\"rest\"), with the old carve as well, so not from this step: next to look at."}, {"p": "**(Claude, 2026-10-27 20:58)** Step 142: the 130 ms first frame was the profile, not the game. Run from Git Bash with output piped, every `print` took about 15 ms (to a file about 0.9 ms, to nowhere about 0), and the cut printed about 9 lines. LONG JOB lines now go to `BreakableStructure.perf_log`, and `tests/fall_profile.gd` keeps its cut lines in `_notes`. Both print after the run. Now the cut takes 13-18 ms and the worst frame is 33-57 ms over 3 runs. The 57 ms frame is a PlantRoom `_struck_queued` of 41.6 ms, where \"islands\" (`BreakablePiece._split`) took 19 ms: next to look at, with N5b."}, {"p": "**(Claude, 2026-10-27 21:11)** Step 143 (playtest report: 30s fps in a 1-player tower fall). `tests/fall_profile.gd` has new options: `--solo=1` (only the keyboard player, full-screen view), `--as-played=1` (vsync on, fullscreen) and `--watch=S`. As played, City (2 or 4 stilts): 135-145 fps every second. Yard solo, vsync off: 105-144 fps, falling to 64 at 287 sections falling (jolt 6.1 + ours 4.0 ms/frame). 4 views: 44-55 fps over the long fall (jolt up to 7, steps 1.2-1.4). Not reproduced yet; asked the user how they dropped it."}, {"p": "**(Claude, 2026-10-27 21:16)** Step 144. The user's game was City Block, Weapon Range, alone, rocketing the stilts from nearby. `fall_profile` now has `--rockets=N` (Hammerhead `Blast.explode` at each stilt, one every fire interval) and `--near=M`. As played (solo, fullscreen, vsync, 15 m, 3 rockets per stilt): slowest second 68-70 fps (281 falling, jolt 4.8 + ours 3.7 ms/frame). Still not the 30s, so there is a new `PerfLog` (`scripts/core/perf_log.gd`, flag `--perf-log`, added by main.gd). It writes a line a second to `user://perf_log.txt` (fps, mean/worst ms, physics steps, physics/process ms, our jobs ms, sections falling, draws, plus LONG JOB lines) during a real game."}, {"p": "**(Claude, 2026-10-27 21:27)** Step 145. The user's perf log: three waves. The second (54-71 s, up to 453 sections falling, the tower hitting its neighbours) ran at 28-37 fps, with ours 7-9.6 ms/frame and 1.6-2.2 physics steps/frame. Cause: `JOB_BUDGET_US` (3 ms) was per structure, so 3 breaking buildings each took 3 ms. Now `_run_jobs` runs once per drawn frame for every structure (static `_jobs_frame`), one job from each busy structure in turn (`_job_turn` rotates who goes first), until one shared 3 ms is spent. The profile with rockets from 15 m went from a slowest second of 70 fps to 75 fps (only 247 falling, so not the multi-building case). Jolt with 400+ falling sections is the next cost: about 4.4 ms at 244 falling."}, {"p": "**(Claude, 2026-10-27 21:37)** Step 146. Second perf log: an 8 fps second at 140.5 s (6.5 physics steps a frame, mean 126 ms), with \"falling\" jumping 40 -> 308 -> 40 -> 314. Cause: `FallingSection.wake()` called `wake_around`, and `wake_in` called `wake()` on each neighbour, so one wake woke the whole connected pile in one step and a huge Jolt step started a catch-up spiral. Now `wake(spread := true)` and `wake_in` wakes with `spread = false`: one step out, and the hold check (HOLD_CHECK) drops anything left unsupported. `AWAKE_MAX` (now 60) counts every structure's moving sections (`_cap_awake` once a 20th physics frame, static `_cap_frame`). `physics/common/max_physics_steps_per_frame=3` (was the default 8). Full check passes."}, {"p": "**(Claude, 2026-10-27 22:36)** Step 149 (SPLITSCREEN_PLAN S2, merge groups). A building no longer unmerges whole on its first hit: its standing pieces are in merge groups (6x4x6 m boxes, `MERGE_CELL`), each FallingSection's members are a group, and settled sections merge by area (10x6x10 m, at most 40k vertices an area). A change shows only its own group; a group quiet for 3 s (`MERGE_QUIET`) merges again. Merged meshes are built from the arrays kept on the CPU (chunk arrays, box arrays), not read back from the GPU, through a shared queue with a 1.5 ms budget a frame, and a big group merges 30k vertices a frame over several frames. Gate, 4 views as played: tower fall 61 -> 64 fps mean, worst frame 37 -> 28 ms, draws a frame 9.3k -> 5.7k; city-wide 47 -> 55 fps mean, draws 15.8k -> 7.6k, and ~70 fps once the rubble settles. Still to do: standing still ~100 fps (the gate wants 120), Jolt spikes when a pile lands (S5), and city-wide slowest second ~40 fps."}, {"p": "**(Claude, 2026-10-27 21:59)** Step 148 (SPLITSCREEN_PLAN S0 + S1). S0: fall_profile `--stress=1` (after the tower, the 3 nearest buildings lose their ground floor, 1 s apart), `--gate=tower|city` (GATE PASS/FAIL line), `--sharp=1`, objects/primitives every frame and scene/shadow draws every 30 frames; tools/gate.ps1 runs both (windowed, not in check.ps1); perf log adds views, draws (scene + shadows), objects. S1: SplitscreenLayout.apply_shadows: with 3+ views and Settings.sharp_shadows off, the moon gets 2 cascades and 60 m (FAST_SHADOW_*); sections under 1 m (FallingSection.NO_SHADOW_SIZE) cast no shadow, also on meshes they make later (meta no_shadow). Options > Splitscreen shadows Fast/Sharp. 4 views as played, Sharp -> Fast: standing 101 -> 106 fps (shadow draws 654 -> 337); tower 56 -> 61 fps mean, slowest second 43 -> 51, worst 35 -> 37 ms, draws 12.2k -> 9.3k, \"rest\" only 11.4 -> 11.0 ms; city-wide 45 -> 47 fps mean, slowest 39 -> 40. Gate: tower passes fps but fails standing 120 (standing is ~9 ms \"rest\" with only ~830 draws: a fixed cost per view, not draw count); city fails. Next S2."}, {"p": "**(Claude, 2026-10-27 21:49)** Step 147. 4-view City fall as played (rockets, vsync): before the cut 103 fps, after it 59 fps mean, worst 34 ms; \"rest\" (render thread) 12.8 of 17 ms, ours 1.5, Jolt 1.5 (spikes to 26). Timed with `--render-thread safe`: GPU 6.9, render CPU 6.2 ms. Draws 2,945 -> 12,800 a frame, about 60% shadows (4 PSSM cascades per view). An intact building is merged; one hit unmerges all of it for good. Plan written: PLANS/SPLITSCREEN_PLAN.md (S0 measure, S1 splitscreen shadows, S2 re-merge in groups, S3 visibility ranges, S4 occlusion, S5 cheaper rubble physics, S6 less GDScript per body, S7 load governor, S8 = NATIVE_PLAN N5b-d, S9 hardware/builds). Waiting for the user's OK on the order."}, {"p": "**(Claude, 2026-10-29 10:40)** Step 153 (playtest: big hitch when a tower top landed). `FallingSection.rebuild()` remade every member's box on each carve or landing, in `_physics_process` outside the job budget (15-52 ms a frame for a 200-member section). It now keeps a box per member (`_shape_of`) and refits only the ones marked by `changed(piece)` / `adopt`. `fall_profile` has `--cut-y=H` and `--tip=W` (cut all stilts, spin the tower over). At 12 rad/s: worst frame 76.5 -> 36.9 ms, frames over 33 ms 16 -> 3. Left: Jolt 23-27 ms on a few landing frames (COLLAPSE_BUDGET_PLAN B5)."}, {"p": "**(Claude, 2026-10-29 10:54)** Step 154. Playtest: 13-16 fps for 3 s (125-127 s) as a big piece broke off in the air, with physics at 2 steps a frame, physics 27-45 ms a frame, our jobs 0.4-3.7 ms, only 20-37 sections falling. Not reproduced yet by `--tip` or `--cut-y`. `PerfLog` now writes a \"slow:\" line (our top timers, ms a frame) for seconds with a mean frame over 20 ms (`SLOW_MS`)."}, {"p": "**(Claude, 2026-10-29 11:13)** Step 155. Clip + perf log: 15 fps at 118 s as a big top block leant and slid down the rocketed lower half, our timers ~3 ms a frame, so Jolt. Pieces riding a section were frozen static bodies on WORLD with their fine carved boxes, and big sections mask WORLD: so a big section hit other sections' members (immovable, teleported each step) as well as their coarse boxes. New `Layers.MEMBER` (128) for members and `Layers.SOLID` (WORLD | MEMBER) for shots, players (player.tscn mask 131), thrown things, splinters and bots; section masks unchanged, so they skip members. `fall_profile --lean=DEG` tilts the tower round its foot's edge; it doesn't reproduce the drop (the tower falls as 1-4 sections), so this is not measured yet. Probes: rubble, collapse_perf, movement, yard, weapon, destruction pass."}, {"p": "**(Claude, 2026-10-29 11:32)** Step 156. Playtest after step 155: no slow seconds in play (the drop is gone), but towers burst apart rather than crumple, as blocks now meet only by their coarse boxes. Cheapest try: `jolt_physics_3d/simulation/baumgarte_stabilization_factor` 0.2 -> 0.1 in project.godot (how hard Jolt pushes overlapping bodies apart each step). Rubble and yard probes pass; collapse_perf passed 2 of 3 runs (one headless timing miss). Next if not enough: more friction between sections."}, {"p": "**(Claude, 2026-10-29 11:40)** Step 157. Playtest of step 156: better fps, but towers slid apart unnaturally, so the baumgarte line is gone again. Instead, `FallingSection.FRICTION` 0.9 -> 1.6 with `rough = true` (the higher friction of a pair wins), to stand in for the snag the fine member boxes gave before step 155. Rubble, yard and collapse_perf probes pass."}, {"p": "**(Claude, 2026-10-29 11:50)** Step 158. Playtest of step 157: a bit better, but a big upright section was thrown about very fast, as if weightless. Cause: `_blast` called `_push` for every piece in range, and `_push` sends each piece's push to its section, so a section with N pieces in range took N x `blast_push` and its speed hardly depended on its size. Now each body (section or loose piece) gets one push, the strongest, from its nearest piece. Costs nothing extra. Rubble, yard and collapse_perf probes pass."}, {"p": "**(Claude, 2026-10-29 12:24)** Step 159. Clip of step 158: a big block of the tower thrown high and spinning after the landing. Logged it with `fall_profile --launches=1` (new: prints any section that gains 3 m/s or 1.5 rad/s in a step, with what it touched): mid-size slabs (3-7 t) pinned between 200-500 t sections and the ground gained 10-40 m/s in one step, up to 60.8 m/s upward, and spun at Jolt's 47.1 rad/s cap; reported contact impulses didn't explain it (the solver's mass-ratio squeeze). Not from rebuilds or waking. Fix in `FallingSection._calm` (in `_integrate_forces`): rising and sideways speed may grow at most `SPEED_GAIN` 1.5 m/s a step, spin at most `SPIN_GAIN` 0.5 rad/s a step and never past max(`MIN_SPIN` 2, `TIP_SPEED` 12 / half its size). Downward speed is left free: limiting it stopped landings (yard probe). Result on the tip test: 2105 launches and 60.8 m/s up -> 0 launches, nothing rises, top spin 7.4 rad/s. `--calm=0` turns it off to compare. Rubble and yard probes pass; collapse_perf is flaky on Office on this machine with and without the fix (on: 3-8 slow frames, off: 10-12)."}, {"p": "**(Claude, 2026-10-29 13:57)** Step 160. Profiled the City tower fall (solo) with the engine's own Jolt job timings (research folder `Godot + Jolt Physics research`, notes 08 T1/T9): in frames over 25 ms, Jolt's CCD sweep (`FindCCDContacts`) was ~80% of physics work. A compound's inner radius is its thinnest box's, so any section with a box under `CCD_THICK` swept on almost every step of its fall, casting all its boxes. Now `physics/jolt_physics_3d/simulation/continuous_cd_movement_threshold=2.0` (default 0.75) in project.godot: a body sweeps only when it moves more than its thinnest box's full thickness in a step. Tested on a copy first: CCD off made sections fall through the ground (3 of 6 runs), 1.0 gained little, 2.0 kept ~80% of the saving with nothing through the ground. Real game, 3 runs each: slowest second 28/37/34 -> 102/62/69 fps, frames over 33 ms 41/36/33 -> 1/14/13, mean 9.2 -> 7.5 ms. Destruction, rubble, tower (nothing through the floor), collapse perf, yard and materials probes pass. Risk: a thin piece could end up through a thin floor or wall; if seen, try 1.5. Before this: git tag `physics-baseline-2026-10-29`."}, {"p": "**(Claude, 2026-10-29 17:22)** Step 161. Perf log fix (tooling only): its once-a-second `find_children(\"*\", \"SubViewport\")` over the whole tree cost 11-16 ms (33k-46k nodes in the City; timed part by part: render info 0.06 ms, the search the rest), so every logged second held a logger stutter. It now searches only the `SplitscreenLayout` group (only PlayerView makes SubViewports, so the same views are found). Same City-wide fall, quiet seconds: worst process step per second ~20 -> ~7.3 ms. Note: `Performance.TIME_PROCESS`/`TIME_PHYSICS_PROCESS` are the slowest step of the last second (engine source), so the log's \"physics, process ms a frame\" columns read as worst steps. Playtest of step 160 (user): fine with lots of destruction, solo; feel note for later: a building's top quarter slips away as if frictionless."}]}, {"id": "F-093", "kind": "feature", "title": "Weapon Range mode (unlimited ammo)", "status": "verify", "priority": "", "section": ["Modes"], "progress": "", "file": "", "needs": "Pick Weapon Range in the menu (try it on the Materials Yard). Fire rockets and everything else with no ammo limit and no waiting.", "related": "F-092, F-086", "added": "2026-10-26", "edited": "2026-10-30 09:22", "body": [{"p": "**(Claude, 2026-10-26 16:15)** Asked for in chat. Every gun and melee weapon from the start, ammo and grenades always full, reload and fire waits short. The match never ends."}]}, {"id": "F-094", "kind": "feature", "title": "Jetpack (map pickup)", "status": "verify", "priority": "", "section": ["Weapons and pickups"], "progress": "", "file": "PLANS\\The Boys\\Ideas.md", "needs": "Play: grab the pack, fly onto a roof, shoot a flyer's pack in the back until it blows. Feel right? Fuel, lift and steering numbers are in tuning (Jetpack).", "related": "F-080, F-067", "added": "2026-10-30", "edited": "2026-10-30 09:51", "body": [{"p": "From Ideas.md (Joel): a slowly rechargeable jetpack. Worked out with Daniel, 2026-10-30:"}, {"ul": ["Jump as normal, then hold jump in the air for a steady upward push. Let go and you fall. Near a ledge, the ledge grab wins.", "Steering: normal air control plus a gentle push the way you hold. No flying about fast.", "Fuel: about 3 s of thrust. Refills 2 s after you stop, about 10 s from empty, in the air too.", "A map pickup, 1-2 per map in fixed spots. Worn until you die, then it drops with its fuel left; the spawn point refills after about 45 s.", "You can shoot and throw while flying, but guns spread more while thrusting.", "A pack on your back, a flame and a hiss while thrusting, fuel bar on the HUD.", "The pack can be shot: enough hits and it blows up, doing heavy damage (rocket-like) to the wearer and those near.", "2026-10-30: built (step 164). 2 packs on Test Map 2 and City Block, 1 on Tower Sandbox. Only in modes with map pickups (Deathmatch, Team Deathmatch, Survival). Tests: tests/jetpack_probe.gd."]}]}], "changelog": [{"date": "2026-10-30", "time": "13:56", "title": "Grapple grips corners; tie the rope off between two things (step 175)", "body": [{"ul": ["The hook now grips edges and corners properly. When it lands near an edge it sits between the two faces, and each claw closes until its tip meets something, then digs in. It no longer only fits flat walls.", "Tie-offs (F-080): while hooked, hold the grapple button for 1 second and aim somewhere else. The rope's other end flies there and sticks, so the rope ties the two places together, like Just Cause. You get a fresh hook straight away. A quick tap still lets go.", "A tied rope is very strong. It holds up loose or falling parts of a building with a little give, but any shot, melee swing or blast that crosses it cuts it, even from its owner. Each player can have 3 tied ropes; a 4th snaps the oldest. The hold time and limit are tunable (`grapple_tether_hold`, `grapple_tethers_max`).", "For now a tied rope only holds parts that have already come loose. It doesn't count as support for a building that is still standing."]}]}, {"date": "2026-10-30", "time": "13:26", "title": "Grapple claws really bite; damage only marks where it hit (step 174)", "body": [{"ul": ["The grapple's claws now do real damage: each of the three tips takes a cell out of whatever breakable piece it bites, like a weak pistol shot (`grapple_claw_damage`). Things that can't break (the ground, map walls) still get the gouge marks.", "Damage no longer changes the look of a whole block or slab. A hit used to redraw a long strip of the piece cell by cell with a speckled colour, so one shot on a slab could change a stripe metres long. Now the untouched outside keeps its plain colour, and only the hole and the stripped patch round it look different."]}]}, {"date": "2026-10-30", "time": "12:51", "title": "Grapple: a real three-claw hook that leaves marks (step 173)", "body": [{"ul": ["The hook is now a proper three-clawed grab with bright steel claws, a dark shank and a ring at the back that the rope ties to. The claws fly open, then snap shut into whatever it hits, with the tips sunk about 3 cm into the surface, so you can see exactly where it's latched.", "Where the claws bite they leave three gouges (dark scratches with chipped edges). They stay put, so you can see where people have been grappling. They move with whatever they're on, go with it if it breaks off, and clear on Reset environment. The newest 48 are kept (`grapple_marks_max`)."]}]}, {"date": "2026-10-30", "time": "11:56", "title": "City Block: grapples can be picked up (step 172)", "body": [{"p": "All four City Block spawn points sat right on top of the jetpacks and grapples, so whoever spawned there (often a bot) took one before seeing it, and it was gone for 45 s. The spawns now sit further out, mid-street on the next ring (one per side, facing the middle), clear of every pickup. The map test now fails if any spawn sits on a pickup."}]}, {"date": "2026-10-30", "time": "11:47", "title": "Grapple: real swinging, no floating, no clipping (step 171)", "body": [{"ul": ["On a tight rope you no longer get jump-style air control. That was what let you drift from a dead hang, and holding a direction braked a fast swing towards running speed. Now you push across the rope: only a small sway while hanging still, a full push once you're swinging, so you pump a swing up over a few passes. Otherwise gravity does the work and a free swing rises nearly as high on the far side.", "Hanging against a wall, you can run along it (or push off it) to get a swing going. No wall-running while hooked.", "Wrapping round a leg a few times no longer cuts through it: a rope can bend round up to 24 corners (was 8, which ran out after two laps of a square leg), bends sit clear of both faces, each lap lies on top of the last, and it unwinds properly when you go back round."]}]}, {"date": "2026-10-30", "time": "11:27", "title": "Grapple rope wraps, rests on the floor and stretches (step 170)", "body": [{"ul": ["The rope now wraps round things. Swing or walk past a tower's corner and it bends round it, and you swing round the corner rather than the hook; go back and it comes off again. Up to 8 bends. Letting go still flies the hook straight home.", "Slack rope lies on the floor, or on whatever's under it, instead of sinking through.", "The rope stretches up to 10% of its length, so reeling in pulls you smoothly instead of yanking you, in the air too. It's damped so it doesn't bounce like a bungee. Being reeled along the ground isn't slowed by ground friction any more.", "Cost: one ray a tick to watch for corners (a few more on the tick it wraps), plus up to 15 short rays down while the rope sags. Only while hooked."]}]}, {"date": "2026-10-30", "time": "11:15", "title": "Controller: grapple on Square, reel on L1/R1 (step 169)", "body": [{"ul": ["Square fires the grapple and lets go. While hooked, R1 reels in (more tension) and L1 lets out (less). Off the rope they throw a frag and switch guns as before; a shoulder held through letting go won't throw or switch until you let it up.", "Reload (and hanging off a ledge) moved to Circle, and roll moved to D-pad right. L3 and D-pad up/down are free again.", "In the lobby, Square still adds a bot and Triangle removes one."]}]}, {"date": "2026-10-30", "time": "11:01", "title": "Grapple fixes: no more freezing or dark slab (step 168)", "body": [{"ul": ["Hooking something froze you in place: the rope was set to exactly how far away you stood, so you couldn't step back. On the ground the line now runs out as you walk away; it only holds you in the air (swinging) or while you reel in.", "The huge dark rectangle was the rope itself: its pieces were drawn with scrambled positions (physics smoothing doesn't mix with how they were drawn). The rope is now one thin cable mesh redrawn each frame, and it sags properly."]}]}, {"date": "2026-10-30", "time": "10:36", "title": "Grapple hook (step 167)", "body": [{"p": "F-080: grapple hooks lie on the maps (two on Test Map 2 and City Block, one on Tower Sandbox), in modes with map pickups. Press L3 (E on keyboard) to fire: the hook flies about 30 m and sticks to walls, roofs, towers and buildings. Swing on the rope: it only pulls when tight and sags like steel cable when slack. Hold a direction to pump the swing. D-pad up/down (mouse wheel) reel in and out at 10 m/s; reel right up under a ledge and you climb onto it. L3 again lets go and you keep your speed; jump lets go with a hop. About 1 s before you can fire again. Guns spread more while hooked. A bullet within 15 cm of someone's rope cuts it, and so do blasts. Hook a building piece that breaks off and it drags you along."}, {"ul": ["Sticky grenades moved to D-pad left on the controller (D-pad up now reels). The menu's controls page lists the jetpack and grapple."]}]}, {"date": "2026-10-30", "time": "10:28", "title": "Grapple hook planned (step 166)", "body": [{"p": "The grapple hook (F-080) is worked out: a map pickup, L3 to fire, D-pad up/down to reel, about 30 m of slack steel rope you swing on. Keep your speed when you let go, reel up onto ledges, and others can shoot your rope to cut it. Hook a breakable piece that falls and it takes you with it."}]}, {"date": "2026-10-30", "time": "09:46", "title": "Fewer maps (step 165)", "body": [{"p": "The map list is now Test Map 2, Tower Sandbox and City Block. Test Map 1 is deleted. The Materials Yard is off the list but its file stays, because the building tests (yard, rubble and collapse probes) use it. Games, tests and the bot matches that used Test Map 1 now use Test Map 2, which is also the default map. Weapon Range now suggests the City Block."}, {"ul": ["Your saved map choice may land on a different map once, as the list numbers changed.", "The Materials Yard no longer gets game changes (its jetpack is gone again); it's only there for the building tests.", "Bots now leave jetpacks alone. Tests that relied on flat Test Map 1 were adjusted for Test Map 2.", "Note: Quake Arena, One in the Chamber, Be the Bummer and Weapon Range have no map pickups, so no jetpacks either. Use Deathmatch or Team Deathmatch to find them."]}]}, {"date": "2026-10-30", "time": "09:37", "title": "Jetpack (step 164)", "body": [{"p": "F-094: jetpacks lie on every map (two on Test Map 2 and the City, one on the others). Walk over one and it's on your back. Jump, then press and hold jump again in the air for a steady lift; let go and you fall. About 3 s of fuel, refilling 2 s after you stop (about 10 s from empty, in the air too). A bit more steering while thrusting, and guns spread more. Flames, a hiss and an orange fuel bar at the bottom of the screen. Shoot a flyer in the back enough and the pack blows up (the wearer is left on about 10 health). Die wearing it and it drops with its fuel left; a taken pack's spot gets a new one after 45 s."}, {"ul": ["Fixed: a player who had just respawned could pick up something lying where they died, from across the map."]}]}, {"date": "2026-10-30", "time": "09:21", "title": "Ideas sorted, jetpack planned (step 163)", "body": [{"p": "The new ideas at the top of the boys' Ideas.md are now in their sections (Map, Movement, Gamemodes, Weapons, Meeting). Alex's city/RPG ideas (currency, houses, NPC friends) got their own Economy / NPCs section. The jetpack is planned as F-094: hold jump in the air to fly, about 3 s of fuel, a map pickup that can be shot to explode."}]}, {"date": "2026-10-29", "time": "17:47", "title": "4-player splitscreen much smoother (step 162)", "body": [{"p": "In 4-player splitscreen the game only managed about 100 fps standing still, and 60-76 during a tower fall. The cause was the health ring: its two segmented bars (about 220 small glowing arcs per screen) were drawn again every frame, only because the mini-map inside them turns. Now the bars are drawn again only when health, armour or the low-health pulse change; the mini-map still moves every frame. It looks exactly the same (checked pixel by pixel). 4 players, City tower fall: standing 96-103 -> 144 fps (the screen's limit), during the fall 60-76 -> about 122 fps, slowest second 33-44 -> 71-78 fps. Solo saves a little too. Please check the bars still fill and empty when you take damage or pick up armour, and pulse when low (F-048, F-064, F-092)."}]}, {"date": "2026-10-29", "time": "17:22", "title": "Perf log no longer causes its own stutter (step 161)", "body": [{"p": "The perf log (`play.cmd -- --perf-log`) searched the whole game, 33,000 to 46,000 things in the City, once a second to find the player views. That took 11-16 ms, so every logged second had a stutter the log itself caused and then reported as the game's. It now looks only under the splitscreen layout, where the views are. Only the perf log changed, nothing in play, and logs from now on read lower worst frames than before (F-092)."}]}, {"date": "2026-10-29", "time": "13:57", "title": "Smoother tower falls (step 160)", "body": [{"p": "Research with the physics profiler showed the big fps drops during a tower fall came from the physics engine's anti-tunnelling sweep (it checks fast pieces don't pass through floors): it was running for almost every falling chunk, every step, and doing about 80% of the physics work in the slow moments. It now only sweeps chunks that move further than their own thickness in one step. City tower fall, solo: the slowest second went from about 33 fps to 62-102, and frames over 33 ms from about 37 to 1-14. Turning the sweep off fully was faster still, but whole chunks then fell through the ground, so it stays on. Please watch for anything poking through floors or walls (F-092)."}]}, {"date": "2026-10-29", "time": "12:24", "title": "No more flung chunks (step 159)", "body": [{"p": "Chunks of a falling tower were squeezed between much heavier ones and shot out, up to 60 m/s and spinning as fast as the physics engine allows. Now a falling chunk can only speed up sideways or upwards a little each moment, and big chunks can't spin fast, so towers should fold and tumble instead of throwing bits about. Being pushed down by weight above is still free, so landings still break things (F-092)."}]}, {"date": "2026-10-29", "time": "11:50", "title": "Big chunks feel heavy again (step 158)", "body": [{"p": "A rocket pushed every bit of a falling chunk separately, so a huge chunk got pushed dozens of times and flew about as fast as a small one, as if it weighed nothing. Now a blast pushes each chunk once, so big chunks barely budge and small ones still fly (F-092)."}]}, {"date": "2026-10-29", "time": "11:40", "title": "Grippier falling blocks (step 157)", "body": [{"p": "Step 156 made towers slide apart, so it's undone. Instead, falling blocks now grip each other harder (more friction), so a tower should crumple instead of sliding or bursting apart (F-092)."}]}, {"date": "2026-10-29", "time": "11:32", "title": "Softer push between overlapping blocks (step 156)", "body": [{"p": "Since step 155 a tower burst apart more than it crumpled. The physics engine now pushes overlapping falling blocks apart half as hard (one project setting), so they should sag and fold into each other more. Try it and say if it's better (F-092)."}]}, {"date": "2026-10-29", "time": "11:13", "title": "Falling pieces stop hitting each other twice (step 155)", "body": [{"p": "Your clip and the new perf log showed the mid-air drop was the physics engine, not our code (our timers were about 3 ms a frame at 15 fps). A big falling block was hitting every small box of the pieces riding other falling blocks as well as those blocks' own outlines, and those riding pieces counted as walls that can't move. They are now on their own layer, which falling blocks skip; shots, players and blasts still hit them. The perf log's \"slow:\" line no longer lists counts as times. The profile test has `--lean=DEG` (tower standing tilted before the cut), but it doesn't bring the drop back on its own, so this fix still needs your playtest (F-092)."}]}, {"date": "2026-10-29", "time": "10:54", "title": "Perf log names the slow code (step 154)", "body": [{"p": "A second in the perf log with a mean frame over 20 ms now gets a \"slow:\" line listing the collapse timers that took the most time that second. This tells our code apart from the physics engine in the next playtest of the mid-air fps drop (F-092)."}]}, {"date": "2026-10-29", "time": "10:40", "title": "Big falling pieces no longer stall the game when they land (step 153)", "body": [{"p": "The big hitch when the top of a tower broke off and hit the ground came from the falling piece remaking all of its collision boxes (up to 200) every time one bit of it cracked or landed. Now it only remakes the boxes that changed. Tipping a tower top onto its head: worst frame 76 -> 37 ms, frames over 33 ms 16 -> 3, first second 68 -> 132 fps. Still left: a few 23-27 ms frames inside the physics engine when a big pile lands (F-092)."}]}, {"date": "2026-10-28", "time": "11:53", "title": "Collapses use the tuned limits (step 152)", "body": [{"p": "From your tuner runs: with at most 20 pieces moving at once, the tower never fell under 82 fps (48 before). At 30 or 40 it stalled to 17-23 fps for a second or two. These are now the game's own values:"}, {"ul": ["At most 20 pieces moving at once (was 60). Up to 200 parts fall as one piece (was 40).", "A building's pieces break in two at most 6 times (was no limit), and only on hard landings (8 m/s, was 4) and for pieces 2.5 m or longer (was 1.2).", "A landing snaps 2 joints (was 6), and pieces under 200 cells just bounce (was 60).", "Rubble freezes after 0.5 s still (was 1.5), and small pieces (under 1.5 m) don't hit each other.", "When a frame runs long, the game catches up with at most 2 physics steps a frame (was 3), so a bad moment runs slightly slow instead of freezing."]}]}, {"date": "2026-10-28", "time": "11:16", "title": "Tuner fix: \"Play with perf log\" didn't start the game (step 151)", "body": [{"p": "Two tuners could run at once on the same port, and the page's buttons then talked to the wrong one (or one that had closed), with no message."}, {"ul": ["Only one tuner runs now. Running tuner.cmd again just opens the page of the one already running.", "If the tuner's window is closed, the page now says so in red instead of doing nothing."]}]}, {"date": "2026-10-28", "time": "11:01", "title": "A tuner page for how buildings fall (step 150)", "body": [{"p": "Run tuner.cmd: a page opens in the browser with a slider for each of 18 collapse values (how many pieces move at once, how much breaks on landing, how fast rubble freezes, and so on). Each shows its default, the plan's value and the % change. The game picks up a change within a second, so keep it open while you play."}, {"ul": ["\"Play with perf log\" starts the game with the log on. Every run is kept, and the page shows its fps over time, where the frame time went, and which group of sliders likely cost the most (red, then amber).", "Pick a second run in \"compare with\" to see if a change helped.", "A change shows on the next thing to break; Reset environment tries it on fresh buildings.", "\"All to default\" puts everything back. Without the page's file, the game plays as before."]}]}, {"date": "2026-10-28", "time": "10:45", "title": "New plan: a budget for collapses", "body": [{"p": "A tower falling alone still drops to about 22 fps, so making each piece cheaper isn't enough. The new plan (PLANS/COLLAPSE_BUDGET_PLAN.md) puts a hard limit on what is real physics and fakes the rest, as The Finals and Red Faction: Guerrilla do."}, {"ul": ["The skyscraper comes first: it will fall in about 12 big pieces, with at most 20 real pieces moving at once.", "Small debris becomes cheap, fake debris that falls, bounces, then sinks away, and dust hides the swaps.", "Nothing in the game has changed yet."]}]}, {"date": "2026-10-27", "time": "22:36", "title": "Broken buildings and rubble drawn in fewer pieces (step 149)", "body": [{"p": "The next step of the splitscreen plan (F-092). Nothing changes in how things break or fall."}, {"ul": ["A building is now split into blocks about 6 m wide. A hit shows only its own block piece by piece. Before, the whole building did, for good.", "A block that has been quiet for 3 seconds is drawn as one again. So are falling pieces that move as one, and rubble lying still in the same spot (about 10 m).", "This work is spread over frames, so it can't cause a slow frame of its own.", "4 players, tower coming down: things drawn a frame went from 9,300 to 5,700. 64 fps on average (was 61), the slowest second 50 fps (was 51 with more ups and downs), and the worst frame 28 ms (was 37).", "City-wide (four buildings down): drawn a frame 15,800 to 7,600, and 47 to 55 fps on average. Once the rubble is still it climbs back to about 70 fps (before, it stayed near 44)."]}]}, {"date": "2026-10-27", "time": "21:59", "title": "Cheaper shadows with 3 or 4 players (step 148)", "body": [{"p": "The first two steps of the splitscreen plan (F-092)."}, {"ul": ["With 3 or 4 players the moon's shadows are simpler and reach 60 m, not 100 m. Small falling rubble (under 1 m) casts no shadow then. This halves the shadow drawing.", "A new option, Options > Splitscreen shadows: Fast (the default) or Sharp (as before).", "4 players, tower coming down: 56 fps became 61 fps on average, and the slowest second went from 43 to 51 fps.", "A new \"city-wide\" test brings down three more buildings after the tower. It runs at about 45 fps, so there is more to do. Next is merging broken buildings back together for drawing.", "tools/gate.ps1 runs these 4-player tests and says PASS or FAIL. The perf log now also logs the views and what is drawn."]}]}, {"date": "2026-10-27", "time": "21:49", "title": "A plan for 4-player splitscreen with lots of destruction (step 147)", "body": [{"p": "I measured a 4-player game on City Block with the tower coming down (F-092). It runs at 59 fps during the fall and 103 fps standing still."}, {"ul": ["Three quarters of each frame is drawing. The graphics card has room to spare, but there are too many separate things to draw. Shadows are over half of them, and a building that has been hit turns into hundreds of separate bits to draw.", "The new plan (PLANS/SPLITSCREEN_PLAN.md) puts the safe, big wins first: cheaper shadows in splitscreen, merging rubble and broken walls back together for drawing, and hiding small bits far away. After that come cheaper physics for small rubble, and a \"governor\" that turns the detail down instead of letting the frame rate drop.", "Nothing in the game has changed yet."]}]}, {"date": "2026-10-27", "time": "21:37", "title": "No more rubble piles waking all at once (step 146)", "body": [{"p": "Your second log found the 11 fps drop at the end (F-092)."}, {"ul": ["When you shot a pile of rubble, or something under it moved, each piece woke the pieces touching it, and those woke theirs. One hit could set the whole pile of about 270 pieces moving in the same moment. The physics could not keep up and fell further and further behind.", "Now waking spreads one piece out. Pieces higher up still fall if what holds them goes, because each settled piece checks twice a second that something is under it.", "The limit on how many pieces may move at once is now for the whole map, not for each building.", "If physics ever falls behind, it catches up at most 3 steps a frame instead of 8, so a bad moment can't snowball. Under very heavy load the game slows down a little instead of freezing."]}]}, {"date": "2026-10-27", "time": "21:27", "title": "Buildings share their breaking time (step 145)", "body": [{"p": "Your frame-rate log showed the 30s fps (F-092). It came when the falling tower crashed into the buildings next to it."}, {"ul": ["Each building had its own time each frame to work out its cracks and falling pieces. With three buildings breaking at once, that time was spent three times over, 8-10 ms a frame.", "A slow frame then makes physics run twice in the next one, which makes it slower still.", "Now all buildings share one allowance and take turns, so breaking stays at about 3 ms a frame however many buildings are coming down. They may take a little longer to finish falling apart."]}]}, {"date": "2026-10-27", "time": "21:16", "title": "A frame-rate log you can turn on (step 144)", "body": [{"p": "More on the 30s fps when the City tower falls (F-092)."}, {"ul": ["The fall test can now bring the tower down your way: Hammerhead rockets at the stilts, watched from close by (`--rockets=3 --near=15`). On this laptop the slowest second was still 68-70 fps.", "New: start the game with `play.cmd -- --perf-log` and play as normal. Every second it writes a line to a log file: frames per second, the slowest frame, physics, our breaking work and how many pieces are falling. Your real game shows where the time goes."]}]}, {"date": "2026-10-27", "time": "21:11", "title": "Testing the tower fall as you play it (step 143)", "body": [{"p": "You saw the frame rate drop into the 30s when the tower fell in a one-player game (F-092). Nothing in the game changes yet."}, {"ul": ["The fall test can now play it your way: one player, full screen, vsync on (`--solo=1 --as-played=1`), and record for longer (`--watch=60`).", "Played that way, the City tower fall stayed at 135-145 fps, and a big Yard fall dipped to about 64 fps at its busiest (nearly 300 pieces falling at once).", "So far I can't make it drop into the 30s. Over 4 players the busiest second was 44 fps. The cost grows with the number of falling pieces: physics plus our breaking work.", "Waiting on how you dropped it (map, weapon, where you stood) to find what's different."]}]}, {"date": "2026-10-27", "time": "20:58", "title": "The 130 ms stutter was the test, not the game (step 142)", "body": [{"p": "Nothing in the game changes (F-092)."}, {"ul": ["The 130 ms first frame of the City Block fall came from how the test was run, not from the game. Each line the test printed took about 15 ms to pass through the window it was running in, and the cut printed about nine lines.", "The fall test now saves its notes and prints them after the timing ends, so printing can't spoil a frame.", "With that fixed, the cut takes 13-18 ms and the worst frame is 33-57 ms over three runs. The 57 ms one is a big hit on the plant room, where working out which bits broke off took 19 ms. That's next."]}]}, {"date": "2026-10-27", "time": "20:47", "title": "Faster collapses: carving holes in C++ (step 141)", "body": [{"p": "More work on the lag while a building falls (F-092). Nothing looks or plays different."}, {"ul": ["The code that picks which bits of wood a hit knocks out (bullets, axes, saws, blasts) now runs in C++: 8-10x faster.", "It takes exactly the same bits as before, down to the random rolls. The test checks 400 random hits of every kind against the old code.", "The biggest hit on the City Block now spends about 1 ms carving, down from up to 12 ms. The worst stutters left are in finding loose bits and rebuilding the pieces.", "Found a new one-off stutter of about 130 ms on the very first frame after the City Block starts falling. It is on the drawing side, not the collapse code, and it happens with the old carving too. Looking into it next."]}]}, {"date": "2026-10-27", "time": "20:34", "title": "Faster collapses: collision boxes in C++ (step 140)", "body": [{"p": "More work on the lag while a building falls (F-092). Nothing looks or plays different."}, {"ul": ["Planned the next part, spreading the work over the PC's cores. Measuring first showed the worst stutters come from single big hits on large pieces, so the plan starts with what those hits cost.", "The collision boxes of a broken piece are now worked out in C++: about 37x faster, with exactly the same boxes as before.", "In the City Block fall test the worst frame went from about 60 ms to 36-43 ms over three runs. Falls vary from run to run, so this is a rough guide.", "The probe now times each long job's parts. Next up: the code that carves a hole when something hits a big piece, which still takes up to 12 ms."]}]}, {"date": "2026-10-27", "time": "13:16", "title": "Faster collapses: the heavy maths moves to C++", "body": [{"p": "Work on the lag while a building falls (F-092, steps 125-139). Collapses look and behave the same; they just cost less."}, {"ul": ["Measured first: in a real 4-view game, the fall was held up by our own breaking code and by drawing, not by the GPU.", "Drawing: rendering moved to its own thread, and a standing building is drawn as one mesh per material instead of hundreds of pieces (about 9,000 draws down to 2,400 on the yard).", "Spikes: the job queue no longer runs several times in one frame, the first check after a cut skips needless work, and big pieces look for loose bits only round the fresh hole.", "New City Block test map: 45 breakable buildings on a street grid, for stress tests. Toggle a frame-rate readout with F1.", "The heaviest cell maths now runs in C++ instead of GDScript: finding loose bits (about 35x faster), building the meshes (about 21x) and the support check (about 24x). The new code is checked against the old on every test, and gives exactly the same answers.", "Next: spread that work over the PC's other cores (worker threads), then a City Block test: 60+ fps during a fall, no frame over 50 ms."]}]}, {"date": "2026-10-26", "time": "21:04", "title": "Note: the falling tower is laggy", "body": [{"p": "Step 124 is fine for now (F-092). To look at later: the game lags while the skyscraper comes down. The GPU sits at only 20-30% and the CPU looks barely used."}, {"ul": ["That points at the code, not the engine. Nearly all the breaking work (cracks, finding loose bits, rebuilding meshes) runs one step at a time on a single CPU core. On a many-core CPU, one busy core shows up as a small overall number, and the GPU waits on it.", "Ideas for later: profile the fall in the real game (not just headless), spread the crack and mesh work over other cores, move the heaviest cell code to C++ or C#, and have fewer, bigger falling pieces.", "Changing engine is unlikely to be needed: the same work would cost the same anywhere."]}]}, {"date": "2026-10-26", "time": "20:56", "title": "Falling buildings stop losing big pieces (step 124)", "body": [{"p": "Fix for the step 123 playtest (F-092): big parts of the skyscraper vanished while it fell."}, {"ul": ["The main cause was a bug. When a tilted piece cracked at a joint, the crack was made far too thick, so a slab of the piece was deleted. A tipping tower lost a lot of itself this way. Cracks now stay thin, however the piece is turned.", "A hard landing now breaks the piece it hits cleanly in two, so the halves carry on as rubble. It used to gouge out a big lump that mostly vanished. Softer hits only take a small bite.", "Pieces with nothing left in them are tidied away (they used to fall through the floor unseen).", "In the test, a collapsing tower now loses about a sixth as much of itself as before."]}]}, {"date": "2026-10-26", "time": "20:28", "title": "A skyscraper in the middle of the Materials Yard", "body": [{"p": "As asked (F-092): a test of how a very large building behaves."}, {"ul": ["A nine-storey concrete tower, 10 x 10 m and about 29 m tall, in the middle of the yard.", "The open ground storey stands on just four thick corner columns. Each storey above has a window band all the way round and a tiled floor, and there is a small plant room on the roof.", "Take out the columns and the whole tower comes down. In the test it fell in about 60 sections, and the worst frame was about 13 ms (headless).", "No way up inside yet: hit it from the ground."]}]}, {"date": "2026-10-26", "time": "20:24", "title": "Note: big chunks break up a bit fast", "body": [{"p": "Playtest of step 122 (F-092): rubble now behaves well. Some bigger chunks seem to disappear too quickly when they come loose and hit the ground. Noted for later work, keeping performance in mind."}]}, {"date": "2026-10-26", "time": "19:31", "title": "Rubble no longer hangs in the air or vanishes", "body": [{"p": "Fixes from the step 121 playtest (F-092): bits of the brick house stuck in the air, and the barn's pieces disappearing after a rocket."}, {"ul": ["Falling sections carry their pieces properly now. Before, a carried piece could get pinned where it was while its section fell away, so it hung in the air.", "Falling sections no longer shove each other up into the sky. That is where the barn's \"vanished\" pieces went. They now bump into each other like normal solid things.", "Settled rubble checks every half second that something is still under it, and falls again if not.", "Only small crumbs turn into flying debris now. Bits up to about a fist (0.05 m³) used to be deleted, and now anything over 0.006 m³ stays as a real piece.", "The top of a ramp whose foot was blown off no longer counts as standing on the ground.", "New rubble test: rockets at the barn corner and through the townhouse. Nothing may hang, fly off, leave its section, or vanish in lumps."]}]}, {"date": "2026-10-26", "time": "18:46", "title": "Smoother frames when a building comes down", "body": [{"p": "As asked (F-092): the stutter when a big part of a building came loose was mostly the landings. Each section that hit the ground cracked its joints and carved what it hit all in that one frame, which cost up to 100 ms or more."}, {"ul": ["Landing cracks and carves now wait in the same queue as the other cracks, spread over a few frames. The dust and sound still come straight away.", "Cracks that land on the same wall in a frame are done together, so the wall is rebuilt once.", "Fewer splinters at once: at most 30 new ones a frame, and cracks from a collapse throw a light spray. Gun and melee hits keep the full spray.", "Wall and floor sections that fall no longer use the costly anti-tunnelling check. Only thin bits (under 15 cm) do.", "Faster mesh and collision rebuilds for carved walls.", "In the test, cutting every ground-floor wall at once: worst frame about 20-30 ms (was 115-314 ms), no frames over 33 ms (was about 25)."]}]}, {"date": "2026-10-26", "time": "18:10", "title": "Buildings give way at about half the support, and no more hanging in the air", "body": [{"p": "As asked (F-092), from your townhouse playtest:"}, {"ul": ["Every wall, post and floor now carries twice what it holds up when whole. Take away about half of what holds a part and it breaks at its thinnest line. Before it took about 90%.", "Walls get a line where they will break. Show stress draws a ring there and a % once a wall is above 60%.", "The part cut off falls in a few big sections. The stub below stays. Bits that come off a wall now count in the building, so the rest of the wall still holds up what it should.", "No more floating: a fallen section only freezes after it has been resting on something. A wall with nothing left at its foot no longer counts as standing on the ground.", "Less lag: new sections no longer shove their neighbours, and the cracks and drops are spread over a few frames (worst frame in the test about 30 ms, was about 60).", "Landings count from a smaller fall now, because walls come down onto their stubs.", "Checked: all tests pass. Please play the townhouse and the office with Show stress on."]}]}, {"date": "2026-10-26", "time": "16:58", "title": "Buildings snap off in sections, all stairs break, less lag", "body": [{"p": "As asked (F-092):"}, {"ul": ["Every staircase can be carved now (office, concrete block, barn, brick house).", "Buildings now have load and strength. Cut a wall and the weak line gives way: the part above breaks off as a few big sections, not loose tiles.", "A section that lands hard cracks where it hits and can knock into the floor below, so collapses can domino.", "Fallen parts stay where they lie (frozen, no cost), and wake up again if you shoot, blast or hit them.", "Less lag: a falling section is one body, tiny bits are dust, and only about 40 sections move at once.", "New pause-menu row on test maps: Show stress (green, amber, red joints).", "Checked: all tests pass, plus a new collapse speed test. Please wreck the townhouse with Show stress on."]}]}, {"date": "2026-10-26", "time": "16:15", "title": "Stairs you can break, buildings fall in pieces, Weapon Range", "body": [{"p": "As asked (F-092, F-093):"}, {"ul": ["The brick house stairs are carvable wood now, so the house falls when its walls are gone.", "Collapsing floors let go in waves, lowest first, and break into smaller pieces where they hit the ground.", "New mode Weapon Range: all weapons, unlimited ammo, no fire waits, no end. Good for testing maps.", "Checked: all tests pass. Please wreck the brick house and try Weapon Range on the Materials Yard."]}]}, {"date": "2026-10-26", "time": "15:55", "title": "Holes you can shoot through, collapsing buildings, bigger yard", "body": [{"p": "As asked (F-091, F-092):"}, {"ul": ["Holes in walls are now real: bullets and bodies pass through them (no more invisible wall).", "Buildings fall when their support is gone. Wreck the ground floor and the floors, walls and roof above come down. One hole does not.", "The Materials Yard is now 160 x 160 m with much bigger buildings: a 3-storey concrete block, a 2-storey office with glass front, a brick townhouse, a timber barn, two containers and a longer bridge. Ramps lead up inside.", "Picking up a weapon you already have now refills its ammo to the full reserve (the Hammerhead gave 1 rocket before).", "Checked: all tests pass. Please try shooting through holes and blasting the ground floors."]}]}, {"date": "2026-10-26", "time": "15:10", "title": "Materials Yard and a city plan", "body": [{"p": "As asked (F-091, F-092, F-073):"}, {"ul": ["New test map \"Materials Yard\": a shed, brick cottage, concrete bunker, metal container with a plank bridge, and an office corner. Each breaks its own way.", "New materials: brick, concrete, sheet metal, glass, drywall, plastic, planks, steel.", "Frames stand, walls and glass break, the shed falls flat.", "City map plan written (PLANS/CITY_MAP.md): about 200 x 200 m, nine districts, build phases.", "Checked: all tests pass. Please try each building with each weapon."]}]}, {"date": "2026-10-26", "time": "13:15", "title": "Wood strips in spiky patches", "body": [{"p": "From your playtest (F-085): the stripped wood round a hit was a neat square. Now the bark comes off in a spiky, splintery star that runs along the grain."}, {"ul": ["A pistol bullet strips a small ragged patch round the hole; the sledge and heavy hits strip bigger ones.", "A rocket or grenade strips a lot, in several patches round the broken parts; torn ends fray too.", "Checked: destruction and tower tests pass. Please look at it in the Tower Sandbox."]}]}, {"date": "2026-10-26", "time": "12:30", "title": "Wood is made of cells now", "body": [{"p": "From your playtest (F-085): the damage was too basic. Wood in the Tower Sandbox is now a grid of small cells (F-090)."}, {"ul": ["Bullets chip tiny pits, the sledge knocks out rough lumps, the chainsaw cuts one flat slice, a rocket tears a ball out.", "Every break looks different and the ends are ragged.", "Joints go floppy as the wood at them gets eaten away.", "This is the base for concrete, metal and plastic later.", "Checked: all tests pass. Hit counts vary on purpose (sledge a few, Longsight 6-13, Kestrel 40-200, one rocket severs a leg)."]}]}, {"date": "2026-10-26", "time": "12:00", "title": "Bullet marks are flat now", "body": [{"p": "From your playtest (F-085): the pock marks looked like little cubes stuck in the wood. They are now thin flat patches of bare wood lying on the log's surface."}]}, {"date": "2026-10-26", "time": "11:30", "title": "Wood breaks differently for each weapon", "body": [{"p": "As planned (F-085, Tower Sandbox):"}, {"ul": ["Bullets and blades leave small pock marks where they hit.", "The sledge bites a chunk off one side of the log, and the final break is wide and ragged with big chunks.", "The chainsaw cuts one slot straight across and the log parts exactly there, with only sawdust.", "Rockets work as before. How many hits it takes to snap a leg hasn't changed."]}]}, {"date": "2026-10-24", "time": "15:37", "title": "Will's new ideas sorted", "body": [{"p": "Two new ideas from Will, now in the feature list and moved into their sections of the boys' notes:"}, {"ul": ["F-087 Overgrown map (Maps).", "F-088 Supply Raid: each team has 20 lives, take the other team to 0. Plus a map and mode rotation (Game modes).", "F-089 Vehicles that crumple and break in crashes, like BeamNG.drive (Big ideas for later, under a new Physics / Vehicles heading in the notes)."]}]}, {"date": "2026-10-24", "time": "15:03", "title": "Towers no longer rebuild by themselves", "body": [{"p": "As asked (F-019, F-086): the 20 s rebuild timer is gone. A fallen tower stays down until you pick \"Reset environment\" in the pause menu."}]}, {"date": "2026-10-24", "time": "14:33", "title": "Tower Sandbox: bigger, four towers, Reset environment", "body": [{"p": "As asked (F-019, F-086): the Tower Sandbox is now a testing map for more than towers."}, {"ul": ["It's four times the size (100 m across) with four breakable sniper towers, one near each corner.", "Pause menu, on this map only: \"Reset environment\". It stands every tower back up, clears the wood chips and brings every pickup back. Players stay where they are.", "Fixed: bots had no floor to walk on in the sandbox, so they couldn't find a path anywhere."]}]}, {"date": "2026-10-24", "time": "14:10", "title": "Tower a bit sturdier, wood breaking planned", "body": [{"p": "From your playtest (F-019, F-085):"}, {"ul": ["The tower joints are stiffer again. Knocking out a leg on the side away from the ladder still brings it down. On the ladder side the ladder props that corner up, so it can stand on three legs and need a second leg taking out.", "Planned for later: wood that breaks the way each weapon would break it. Bullets chip it, the sledge splinters off random chunks, and the chainsaw cuts straight through."]}]}, {"date": "2026-10-24", "time": "13:06", "title": "Tower: stiffer joints, wood chips, ladder bug fixed", "body": [{"p": "From your playtest of the Tower Sandbox (F-019, F-084):"}, {"ul": ["Stiffer joints: the joints now spring back when bent instead of hanging loose, so the parts that weren't hit keep their shape. Thin braces are much weaker than the thick legs. One lost leg still brings it down.", "Wood chips: shots, swings and blasts knock chips off wood, and heavy hits and blasts throw real chunks. A snapped log bursts into chunks. Worn legs get visibly thinner and paler where they've been hit.", "Chips never hold up or push the tower (they used to be able to wedge under a leg).", "Fixed: after the tower fell, getting on the fallen ladder could fling you away and let you climb an invisible ladder. A ladder that's tipped over or gone can't be climbed now, and you drop off one that falls under you.", "The sandbox floor is now solid, so thin pieces can't sink through it."]}]}, {"date": "2026-10-24", "time": "12:24", "title": "Breakable tower prototype in a sandbox map", "body": [{"p": "As asked: a first go at a tower that falls with real physics (F-019), in its own test map. The normal maps still have the solid tower."}, {"ul": ["Pick \"Tower Sandbox\" in the map list. One tower, plus rockets, a sniper rifle, grenades, the chainsaw, sledge, spear and nightstick lying around.", "The tower is 11 separate pieces: 4 legs, 4 cross braces, the deck, the roof and the ladder, held together by 15 joints.", "Wear a leg (or brace) through and it snaps in two. From then on only gravity, the joints and your hits move anything. Joints that get bent or pulled too far break.", "Which way it goes isn't chosen by the game. In the headless test, knocking out different legs sent it different ways.", "The game now uses the Jolt physics engine (steadier for piles of joined pieces). All the usual checks pass with it.", "Not in yet: falling pieces don't hurt anyone, no creak or crash sounds, bots don't know about it."]}]}, {"date": "2026-10-24", "time": "11:53", "title": "Sniper tower is solid again, falling to be redone", "body": [{"p": "As asked: all the sniper tower destruction is taken out (F-019). The falls were never real gravity: the script chose which way it went and pushed it there."}, {"ul": ["The tower is a plain solid structure again. Shots and blasts don't hurt it.", "Gone: leg wear, holes, wood chips, the fall, the rebuild, and the tower sounds and probes.", "Research on how to do it properly is in PLANS/Research/tower-physics.md. The short version: build it from separate pieces held by joints that can snap, and let gravity do the rest.", "Wood vs concrete (F-084) stays, ready for when breakable things come back."]}]}, {"date": "2026-10-24", "time": "11:45", "title": "Tower falls are real physics again", "body": [{"p": "Fix for sniper towers falling like the old scripted tilt (F-019)."}, {"ul": ["The last fix held the tower on a stiff hinge: it stopped any turning every frame, glued the feet to the floor and started the tip too gently. That's what made it look like the first, scripted fall. All three are gone.", "Now it's just gravity: the corner that lost its leg drops, the tower lurches and falls about twice as fast, and its feet can skid. Shot legs still fall straight toward the lost leg.", "A rocket from the side can turn it a little as the feet skid, like a real shove."]}]}, {"date": "2026-10-24", "time": "11:37", "title": "Chainsaws cut wood", "body": [{"p": "Weapons now matter against what things are made of (F-084)."}, {"ul": ["The chainsaw cuts a sniper tower leg through in about half a second.", "The sledge hits wood twice as hard as before, so it does far more than the spear or nightstick. Two good swings snap a leg.", "Rockets and grenades bite wood harder too.", "Wood is now a material. Concrete is set up for later: it will shrug off blasts and saws but crack under the sledge."]}]}, {"date": "2026-10-24", "time": "11:31", "title": "Towers fall like real towers", "body": [{"p": "Fix for sniper towers twisting as they fell (F-019)."}, {"ul": ["A tower now tips over the legs it has left, toward the side that lost its support. No more spinning round.", "Guns and melee only wear a leg down. A rocket or grenade that lands close snaps the leg in one go and gives the tower a small shove.", "How far it gets shoved depends on how heavy it is, and its weight comes from its size. Bigger structures added later will move less.", "The ladder no longer props the tower up when a back leg goes."]}]}, {"date": "2026-10-24", "time": "11:11", "title": "Towers fall differently every time", "body": [{"p": "Fix for sniper towers falling on a set path (F-019)."}, {"ul": ["The physics was always on, in every mode. But each tower got the exact same nudge toward its broken leg, so it fell along the same arc every time. It only looked like real physics when a rocket hit it mid-fall, which is why Quake Arena seemed different.", "Now the hit that breaks the leg pushes the tower. Shoot it from the side and it twists, blow it up and it gets kicked.", "Every fall has a bit of chance in it, and the tower tips over faster at the start."]}]}, {"date": "2026-10-23", "time": "13:29", "title": "A watch house to hide and shoot from", "body": [{"p": "More hiding spots, weapon spots and windows to shoot from on Test Map 1 (F-018)."}, {"ul": ["A two-storey house on the empty east side, its front door facing the middle.", "Slit windows on both floors, so you can shoot out while staying hard to hit.", "A ladder goes up through a hatch to the top floor, where a Kestrel sits.", "Downstairs there's a cupboard with a door. Shut it and you're hidden. There's health inside.", "Bots can get in and find the cupboard. They can't climb the ladder yet."]}]}, {"date": "2026-10-23", "time": "13:23", "title": "A changelog you can skim", "body": [{"p": "From Ideas.md (F-081)."}, {"ul": ["Each update in the Changelog now folds down to its title. Click one to read it. The newest is open.", "A By date / By section switch sits at the top. By section groups what changed under Movement, Weapons, Maps and the rest, so you can open the area you care about.", "Search still filters it and opens everything that matches."]}]}, {"date": "2026-10-23", "time": "13:21", "title": "No more flashing ladders and bridges", "body": [{"p": "From Ideas.md (X-003)."}, {"ul": ["Ladders: the wooden back board was sat exactly on the wall, so the two kept swapping which one showed. It now stands 2 cm out from the wall.", "Bridges: where the bridge ends run into the corner decks and the spire, both floors were at exactly the same height. The bridges are 1 cm lower now, so the deck floor shows. You won't feel the step."]}]}, {"date": "2026-10-23", "time": "13:19", "title": "New ideas sorted", "body": [{"p": "The six new ideas in Ideas.md are in their sections now, and on this list."}, {"ul": ["New section in Ideas.md: Meeting for the boyz, for ideas we talk through together first. Everyone designing their own character is the first one (F-083).", "Grapple hook (F-080), the ladder and bridge flicker (X-003), a changelog you can skim by section (F-081) and a cheaper way of building with Claude (F-082).", "The stick-man idea was already being built: that's F-078."]}]}, {"date": "2026-10-23", "time": "13:11", "title": "Guns in hand, a proper one-handed aim", "body": [{"p": "From your playtest notes."}, {"ul": ["Other players now see the weapon in your stick man's right hand (F-078). It points where you're aiming, and hangs in the hand while you climb, roll or hang on with both hands. The werewolf's claws stay empty-handed.", "Hanging and aiming (F-026): the arm goes out straight and points right at what your reticle is on, and the chest turns round towards it."]}]}, {"date": "2026-10-23", "time": "13:05", "title": "Ledge grab on Square, shoot while hanging", "body": [{"p": "From your notes on the ledge hang (F-026)."}, {"ul": ["Grab is on Square now (R on keyboard), not crouch. Hold it in the air and you grab any ledge you're looking at as you reach it.", "Any ledge you can see: one up ahead within reach, or the edge you're stood on. Look down over a drop and press Square to swing down and hang off it.", "Shimmy is faster (2.2 m/s, was 1.4).", "Hang still and the gun hand lets go: aim and shoot one-handed. Shimmying, both hands are on the edge and you can't shoot.", "Square with no ledge in view still reloads."]}]}, {"date": "2026-10-23", "time": "12:52", "title": "Hang off ledges and pull people down", "body": [{"p": "Uncharted 3 style (F-026). Built how U3 did it as far as we know: tell me if Will remembers it differently."}, {"ul": ["Hold crouch while you jump at a ledge and you grab the edge and hang there instead of climbing up.", "Move the stick left / right to shimmy along the edge. You stop at the end of it.", "Jump pulls you up onto the top. Crouch lets go and you drop.", "No shooting while hanging. But if an enemy stands right at the edge above you, \"FIRE: PULL ... DOWN\" shows: press fire to yank them over the edge, which kills them."]}]}, {"date": "2026-10-23", "time": "12:40", "title": "Sliding on the floor, a proper ledge pull-up", "body": [{"p": "From your playtest videos."}, {"ul": ["Slide (F-078): the stick man drops right down onto the floor, hip low and lead leg out, instead of floating. Look around while sliding and the chest twists round to point the gun where you aim, while the legs keep going the way you slide.", "Ledge climb (F-067): both hands grab the edge and stay on it while you haul yourself up. Your feet scrabble up the wall, then you crouch over the top with a knee up and stand. The rise is smooth now (no jerk at the start), and it takes 0.6 s instead of 0.45 s so you can see it."]}]}, {"date": "2026-10-23", "time": "12:15", "title": "Third-person camera", "body": [{"ul": ["Tap Select (the button left of Start; Tab on keyboard) to swap between first and third person, so you can watch your stick man run, slide and climb. Hold it for the scoreboard, as before. The camera sits over your right shoulder and keeps out of walls."]}]}, {"date": "2026-10-23", "time": "12:12", "title": "Fix: stick men's shoulders and hips", "body": [{"ul": ["The shoulder and hip bars stuck out to one side of the body, so the left arm and leg hung off thin air. Both bars are now centred, with the arms and legs on their ends."]}]}, {"date": "2026-10-23", "time": "12:05", "title": "Fix: test runs filling the disk", "body": [{"ul": ["A test run that got stuck while closing kept writing the same error to Godot's log, gigabytes a minute, which pinned the SSD at 100%. The game no longer ticks once its mode has closed, so this can't happen again."]}]}, {"date": "2026-10-23", "time": "11:55", "title": "Stick-man bodies, faster falling parts, pads for NPCs", "body": [{"p": "Changes from your playtest notes."}, {"ul": ["Stick-man bodies (F-078): the bean is gone. Players, bot
