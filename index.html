<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nightshift - Features and Fixes</title>
<style>
  :root{
    --bg:#14110f;--panel:#1d1915;--panel2:#26211b;--line:#3a3128;
    --text:#ece4d6;--muted:#a79a86;--accent:#e0a64a;--need:#e8793f;
    --s-open:#e06a5a;--s-verify:#e8a13f;--s-in-progress:#e0c24a;--s-research:#6fa8dc;
    --s-planned:#4fc3b0;--s-idea:#b29be0;--s-blocked:#d9534f;--s-parked:#8d8579;--s-pass:#9cc36c;--s-done:#6cc38a;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#f6f1e8;--panel:#fffdf8;--panel2:#efe7d8;--line:#d9cdb8;
      --text:#2a241c;--muted:#6f6552;--accent:#a8691a;--need:#b8501b;
      --s-open:#b83e30;--s-verify:#a86a10;--s-in-progress:#8a7410;--s-research:#2c6aa0;
      --s-planned:#17806f;--s-idea:#6a4fb0;--s-blocked:#a8302c;--s-parked:#6f6a60;--s-pass:#5a7f1e;--s-done:#2b8a4e;
    }
  }
  :root[data-theme="light"]{
    --bg:#f6f1e8;--panel:#fffdf8;--panel2:#efe7d8;--line:#d9cdb8;
    --text:#2a241c;--muted:#6f6552;--accent:#a8691a;--need:#b8501b;
    --s-open:#b83e30;--s-verify:#a86a10;--s-in-progress:#8a7410;--s-research:#2c6aa0;
    --s-planned:#17806f;--s-idea:#6a4fb0;--s-blocked:#a8302c;--s-parked:#6f6a60;--s-pass:#5a7f1e;--s-done:#2b8a4e;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 "Segoe UI",system-ui,Arial,sans-serif}
  header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 16px 10px}
  .wrap{max-width:1200px;margin:0 auto}
  h1{margin:0;font:700 20px Georgia,"Times New Roman",serif;letter-spacing:.5px}
  h1 small{display:block;font:600 12px "Segoe UI",system-ui,sans-serif;color:var(--accent);letter-spacing:1.5px;text-transform:uppercase;margin-top:2px}
  .row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
  .chip{background:var(--panel);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:4px 12px;cursor:pointer;font:600 12px inherit;font-family:inherit}
  .chip:hover{border-color:var(--accent)}
  .chip.on{color:var(--text);border-color:var(--accent);background:var(--panel2)}
  .chip .n{opacity:.7;margin-left:4px}
  .chip.need.on,.chip.need:hover{border-color:var(--need)}
  input[type=search]{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:4px 12px;font:13px inherit;font-family:inherit;outline:none;width:200px}
  input[type=search]:focus{border-color:var(--accent)}
  .sp{flex:1}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .layout{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;padding:14px 16px 60px}
  aside{position:sticky;top:var(--hh,120px);align-self:start;max-height:calc(100vh - var(--hh,120px) - 10px);overflow:auto;padding-right:4px}
  aside summary.navtitle{display:none}
  .navlabel{font:700 11px "Segoe UI",system-ui,sans-serif;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin:4px 0 6px}
  .navtools{display:flex;flex-direction:column;gap:6px;margin:0 0 10px}
  .navtools input[type=search]{width:100%}
  .sortlbl{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
  .sortlbl select{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:3px 10px;font:13px inherit;font-family:inherit;outline:none}
  .sortlbl select:focus{border-color:var(--accent)}
  .when{font:600 11px "Segoe UI",system-ui,sans-serif;color:var(--muted);white-space:nowrap}
  .tree,.tree ul{list-style:none;margin:0;padding:0}
  .tree ul{padding-left:14px;border-left:1px solid var(--line);margin-left:7px}
  .tree button{display:flex;width:100%;gap:6px;align-items:baseline;text-align:left;background:none;border:0;border-radius:6px;color:var(--text);padding:3px 8px;cursor:pointer;font:14px inherit;font-family:inherit}
  .tree button:hover{background:var(--panel)}
  .tree button.on{background:var(--panel2);color:var(--accent);font-weight:600}
  .tree button.top{font-weight:600}
  .tree button .nm{flex:1;min-width:0}
  .tree button .n{color:var(--muted);font-size:12px}
  .tree button.dim{opacity:.45}
  .tree .trow{display:flex;align-items:center;border-radius:6px}
  .tree .trow:hover{background:var(--panel)}
  .tree .trow button:hover{background:none}
  .tree .trow:has(button.on){background:var(--panel2)}
  .tree .tog{flex:none;width:24px;display:inline-block}
  .tree button.tog{width:24px;padding:3px 0;justify-content:center;color:var(--muted);font-size:9px}
  .tree button.tog span{display:inline-block;transition:transform .15s}
  .tree button.tog:hover{color:var(--accent)}
  .tree button.tog.open span{transform:rotate(90deg)}
  #tree > li{padding:3px 0}
  #tree > li + li{border-top:1px solid var(--line)}
  #tree > li:first-child{padding-bottom:6px}
  #tree > li.logrow + li{border-top-width:2px}
  .tree button .ic{color:var(--accent);font-size:12px}
  .log{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:8px}
  .log header{position:static;background:none;border:0;padding:0;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  .log .t{font:700 15px Georgia,"Times New Roman",serif;flex:1;min-width:0}
  .log .detail{padding:0}
  .log .detail a{text-decoration:none;font:700 12px Consolas,"Courier New",monospace}
  .loghint{color:var(--muted);font-size:13px;margin:4px 0 2px}
  .tree ul li{margin-top:1px}
  main{min-width:0}
  .crumb{color:var(--muted);font-size:13px;margin:4px 0 2px}
  .crumb a{color:var(--accent);cursor:pointer;text-decoration:none}
  h2{font:700 13px "Segoe UI",system-ui,sans-serif;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin:22px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line);cursor:pointer}
  h3{font:600 14px "Segoe UI",system-ui,sans-serif;color:var(--text);margin:14px 0 6px;cursor:pointer}
  h2 .c,h3 .c{color:var(--muted);font-weight:600;letter-spacing:0;margin-left:6px;font-size:12px}
  h2:hover,h3:hover{color:var(--accent)}
  details.item{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:6px}
  details.item[open]{border-color:var(--accent)}
  details.item.flash{outline:2px solid var(--accent)}
  details.item > summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:baseline;padding:8px 12px}
  details.item > summary::-webkit-details-marker{display:none}
  .caret{color:var(--muted);font-size:10px;width:10px;flex:none;transition:transform .15s}
  details[open] .caret{transform:rotate(90deg);color:var(--accent)}
  .id{font:700 12px Consolas,"Courier New",monospace;color:var(--muted);flex:none;width:44px}
  .title{flex:1;min-width:0;font-weight:600}
  .badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
  .badge{font:700 10px "Segoe UI",system-ui,sans-serif;letter-spacing:.8px;text-transform:uppercase;border-radius:999px;padding:2px 8px;border:1px solid currentColor;white-space:nowrap}
  .badge.pri{color:var(--muted)}
  .badge.pri.high{color:var(--need)}
  .badge.needs{color:var(--need)}
  .badge.fix{color:var(--s-open)}
  .pct{display:inline-flex;align-items:center;gap:5px;font:700 11px "Segoe UI",system-ui,sans-serif;color:var(--muted)}
  .pct i{display:inline-block;width:44px;height:5px;border-radius:3px;background:var(--panel2);overflow:hidden}
  .pct i b{display:block;height:100%;background:var(--s-pass)}
  .detail{padding:2px 14px 14px 66px;color:var(--text)}
  .detail p{margin:8px 0}
  .detail ul{margin:6px 0 8px;padding-left:20px}
  .detail li{margin:3px 0}
  .detail code{font:13px Consolas,"Courier New",monospace;background:var(--panel2);padding:1px 5px;border-radius:4px}
  .detail a{color:var(--accent)}
  .meta{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;display:grid;grid-template-columns:90px 1fr;gap:4px 10px;font-size:13px}
  .meta dt{color:var(--muted)}
  .meta dd{margin:0;overflow-wrap:anywhere}
  .meta dd.need{color:var(--need)}
  .empty{color:var(--muted);text-align:center;padding:30px}
  footer{color:var(--muted);font-size:12px;text-align:center;padding:0 16px 30px}
  @media (max-width:800px){
    .layout{grid-template-columns:1fr;gap:6px}
    aside{position:static;max-height:none;overflow:visible}
    aside details.nav{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
    aside summary.navtitle{display:block;cursor:pointer;font-weight:600}
    .navlabel{display:none}
    .detail{padding-left:14px}
    details.item > summary{flex-wrap:wrap}
    .badges{justify-content:flex-start;width:100%;padding-left:20px}
    input[type=search]{width:100%}
  }
</style>
</head>

<header><div class="wrap">
  <h1>NIGHTSHIFT<small>Features and fixes</small></h1>
  <div style="font-size:12px;opacity:.65;margin:2px 0 6px">Last updated: 2026-10-23 09:10 GMT</div>
  <div class="row" id="statusChips"></div>
  <div class="row">
    <button class="chip on" data-kind="all">All</button>

      <input type="search" id="secQ" placeholder="Filter sections and entries…" title="Shows only sections whose name, or one of whose entries, matches">
      <label class="sortlbl">Sort

          <option value="section">By section</option>
          <option value="recent">Most recent first</option>
          <option value="oldest">Oldest first</option>
        </select>

<script>
const DATA = {"updated": "2026-10-23 09:10 GMT", "statuses": ["in progress", "open", "verify", "research", "planned", "idea", "blocked", "parked", "pass", "done"], "items": [{"id": "F-046", "kind": "feature", "title": "Splitscreen 1-4 players + join in game", "status": "pass", "priority": "", "section": ["Current build", "Built so far"], "progress": "", "file": "PLANS\\PROGRESS.md", "needs": "", "related": "", "added": "2026-10-21", "edited": "2026-10-22 12:58", "body": [{"p": "Pad A/Start or Enter joins. F4 fills empty screens with bots. Join screen and pad unplug handling still to do (Milestone 2)."}]}, {"id": "X-002", "kind": "fix", "title": "Not tested with real controllers yet", "status": "open", "priority": "", "section": ["Current build", "Built so far"], "progress": "", "file": "PLANS\\PROGRESS.md", "needs": "Test with 2+ pads, including the generic one", "related": "", "added": "2026-10-21", "edited": "2026-10-22 12:58", "body": [{"p": "Generic pads without an SDL mapping may have wrong buttons."}]}, {"id": "F-047", "kind": "feature", "title": "Damage, death and respawn", "status": "pass", "priority": "", "section": ["Current build", "Built so far"], "progress": "", "file": "PLANS\\PROGRESS.md", "needs": "", "related": "", "added": "2026-10-22", "edited": "2026-10-22 12:58", "body": [{"p": "100 health, bullet headshots x2, rockets hurt you at half. Death screen names the killer; respawn after 3 s far from living players."}]}, {"id": "F-048", "kind": "feature", "title": "Health ring + armour vests", "status": "pass", "priority": "", "section": ["Current build", "Built so far"], "progress": "", "file": "PLANS\\PROGRESS.md", "needs": "", "related": "", "added": "2026-10-22", "edited": "2026-10-22 20:28", "body": [{"p": "Circle top right: orange health, blue armour outer ring. Armour soaks damage first."}, {"ul": ["2026-10-22: restyled after Nightfire's look (from memory): bigger, thinner rings made of short glowing segments; health pulses red when low. The number in the middle is gone: the mini-map sits there now (F-064)."]}]}, {"id": "F-074", "kind": "feature", "title": "VALUES folder: every tuning number in one place", "status": "pass", "priority": "", "section": ["Current build", "Built so far"], "progress": "", "file": "VALUES\\README.md", "needs": "", "related": "F-071, F-008", "added": "2026-10-23", "edited": "2026-10-23 00:58", "body": [{"p": "Darren asked for this so that changing a mechanic we tweak again and again doesn't mean searching the code."}, {"ul": ["`VALUES\\` has five pages: a README, tuning (movement, combat, modes), weapons side by side, bots, and the fixed numbers inside the scripts (swing timings and so on). Each row says what the value does and links to the line to change.", "It's made from the code: after changing a value, run `python tools\\build_values.py` to refresh it."]}]}, {"id": "F-075", "kind": "feature", "title": "Melee hits up close, and a switch to see hitboxes", "status": "verify", "priority": "", "section": ["Current build", "Built so far"], "progress": "", "file": "PLANS\\The Boys\\Ideas.md", "needs": "Does melee connect now when you're right next to someone? Try with show_hitboxes on", "related": "F-020, F-071", "added": "2026-10-23", "edited": "2026-10-23 00:58", "body": [{"p": "Darren wasn't connecting some hits when right next to someone."}, {"ul": ["The cause: a swing only counted if the middle of the other player was inside its cone. Up close a body is wide, so someone half in front of you could be missed. Now it also hits if the swing's line passes through their body (plus 15 cm).", "The werewolf's bigger body is easier to hit, to match how it looks.", "Debug switch `show_hitboxes` (game_tuning.gd, \"Debug\"): every player shows a see-through green capsule, the shape melee checks against, and each swing leaves a mark where it reached: green if it hit, red if not."]}]}, {"id": "F-071", "kind": "feature", "title": "Melee weapon abilities", "status": "verify", "priority": "", "section": ["Current build", "Built so far"], "progress": "", "file": "PLANS\\The Boys\\Ideas.md", "needs": "Try each one. Too strong, too weak, cooldowns too long or short? Is the icon easy to read?", "related": "F-020, F-072", "added": "2026-10-22", "edited": "2026-10-23 00:32", "body": [{"p": "Each melee weapon gets something special, so it's worth carrying against guns. Aim (LT / right mouse) does nothing with a melee weapon, so that's the button."}, {"ul": ["**Knife:** throw it. Kills outright within 12 m, 50 damage further away. It drops to the floor where it lands: walk over it to get it back (anyone without a knife can grab it). Gone after 30 s.", "**Spear:** lunge about 4 m forward with a thrust at the end. 2 s cooldown.", "**Sledge:** ground slam. Everyone within 3.5 m takes 35, gets knocked up and away and is dazed for 0.7 s. 4 s cooldown.", "**Shield:** hold Aim to raise it. Rockets that hit it from the front bounce back the way you're looking, and count as yours.", "**Chainsaw:** hold Aim to rev: you run 30% faster.", "**Nightstick:** a stun swing. The hit freezes their aim and trigger for 1.2 s (they can still move). 3 s cooldown.", "**Claws (werewolf):** pounce and claw whoever you land on. Tap Aim for a short pounce, or hold it to charge for up to 5 s: a full charge leaps about 7.5 m high. 2.5 s cooldown.", "**Ability icon:** a small round badge above the weapon name shows the ability, with its own picture for each weapon. It goes dark grey when you use it, the colour fills back in from the bottom as it recharges, and it flashes when it's ready. A charging pounce fills a ring around it.", "Each weapon has its own cooldown, so switching doesn't skip one. All the numbers are in game_tuning.gd under \"Melee abilities\"."]}]}, {"id": "F-067", "kind": "feature", "title": "Ledge climbing", "status": "verify", "priority": "", "section": ["Current build", "Built so far"], "progress": "", "file": "PLANS\\The Boys\\Ideas.md", "needs": "Does the climb feel good? Too slow, too fast, reach too high or too low?", "related": "F-026", "added": "2026-10-22", "edited": "2026-10-23 00:06", "body": [{"p": "Jump at a ledge with the stick held forward and you pull yourself up onto it: a first-person version for now."}, {"ul": ["You can grab anything whose top is 0.5 to 2 m above your feet while you're in the air. From a running jump that's walls and crates up to about 3.5 m high.", "You rise up the wall, then roll forward over the edge with the view dipping, and keep a little speed so you can run straight on. It takes about 0.25 to 0.45 s, quicker for lower ledges.", "Needs room to stand on top. Works on the fallen sniper tower too. No shooting while climbing.", "Other players see your body lean into the wall. A proper climbing animation waits for player models with arms and legs."]}]}, {"id": "F-070", "kind": "feature", "title": "Wall run lasts while you're fast", "status": "done", "priority": "", "section": ["Current build", "Built so far"], "progress": "", "file": "PLANS\\The Boys\\Ideas.md", "needs": "", "related": "F-027, F-069", "added": "2026-10-22", "edited": "2026-10-23 00:06", "body": [{"p": "No set time any more: you stay on the wall while you keep your speed up."}, {"ul": ["You lose a little speed every second on the wall (8.5 m/s at the start, more if you come in fast).", "While you're fast you barely sink. Below 7 m/s you start to slip down, faster the slower you go, and below 5 m/s you fall off.", "A normal run from the ground lasts about 2 s and 14 m; coming in fast off a jump pad or a slide goes much further."]}]}, {"id": "F-069", "kind": "feature", "title": "Momentum slide", "status": "done", "priority": "", "section": ["Current build", "Built so far"], "progress": "", "file": "PLANS\\The Boys\\Ideas.md", "needs": "", "related": "F-001, F-068, F-027", "added": "2026-10-22", "edited": "2026-10-23 00:06", "body": [{"p": "The slide starts at the speed you're going (at least 11 m/s, at most 17 m/s), and a faster slide lasts longer."}, {"ul": ["Hit slide within 0.2 s of landing (or press it just before you land) and the slide keeps your run speed plus some of the fall: about 13.5 m/s off a running jump.", "Crouching in the air no longer slows you down, so you can tuck for the landing."]}]}, {"id": "F-068", "kind": "feature", "title": "No slide spamming", "status": "done", "priority": "", "section": ["Current build", "Built so far"], "progress": "", "file": "PLANS\\The Boys\\Ideas.md", "needs": "", "related": "F-001, F-069", "added": "2026-10-22", "edited": "2026-10-23 00:06", "body": [{"p": "Each slide straight after another goes 25% less far (100%, 75%, 56%...)."}, {"ul": ["1.5 s without sliding clears it, so one slide for cover and another later is never cut; only chained slides are."]}]}, {"id": "F-065", "kind": "feature", "title": "Cleaner screen", "status": "verify", "priority": "", "section": ["Current build", "Built so far"], "progress": "", "file": "PLANS\\PROGRESS.md", "needs": "Anything else on screen you'd take away?", "related": "F-048, F-063", "added": "2026-10-22", "edited": "2026-10-22 20:32", "body": [{"p": "Asked for: less text on screen. The \"press A to join\" line at the bottom of the match is gone (everyone joins in the lobby; late joining still works). The P1 / P2 name only shows in split screen, and smaller. Ammo shows just the gun and \"12 / 48\"; grenades only show when you have some. Pickup messages are short (\"+ KESTREL\"), \"respawning...\" and the \"(to 25)\" in Team Deathmatch are gone, and the spawn protection line is smaller and fainter. In the lobby, empty cards just say OPEN instead of blinking \"PRESS A / ENTER\"."}]}, {"id": "F-064", "kind": "feature", "title": "Mini-map in the health ring", "status": "verify", "priority": "", "section": ["Current build", "Built so far"], "progress": "", "file": "PLANS\\PROGRESS.md", "needs": "Is 30 m the right range? Are the far dots too faint or too easy to see?", "related": "F-048", "added": "2026-10-22", "edited": "2026-10-22 20:28", "body": [{"p": "Asked for with the health ring restyle. A round map of the arena inside the health and armour rings. It turns with you (you're the white arrow, always facing up). Walls are bright, floors darker, higher floors lighter. Other players and bots are dots in their colour: faint when far away, solid as they get close (30 m from the middle to the edge). Anyone further away sits faintly on the edge, showing which way they are."}]}, {"id": "F-049", "kind": "feature", "title": "Kestrel assault rifle", "status": "pass", "priority": "", "section": ["Current build", "Built so far"], "progress": "", "file": "PLANS\\PROGRESS.md", "needs": "", "related": "F-002", "added": "2026-10-22", "edited": "2026-10-22 12:58", "body": [{"p": "Automatic, 30 rounds. Our own name for an AK-style rifle."}]}, {"id": "F-050", "kind": "feature", "title": "Health pickups", "status": "pass", "priority": "", "section": ["Current build", "Built so far"], "progress": "", "file": "PLANS\\PROGRESS.md", "needs": "", "related": "", "added": "2026-10-21", "edited": "2026-10-22 16:36", "body": [{"p": "White kits with a red cross: +50 health, never above 100, only taken if you are hurt, back after 25 s. One in each hut and one under each tower."}]}, {"id": "F-052", "kind": "feature", "title": "Deathmatch rules, scores, end screen", "status": "verify", "priority": "", "section": ["Current build", "Built so far"], "progress": "", "file": "PLANS\\PROGRESS.md", "needs": "Play a full match: does 15 kills / 10 min feel right?", "related": "F-010", "added": "2026-10-21", "edited": "2026-10-22 16:58", "body": [{"p": "First to 15 kills, or most kills after 10 minutes. Falls and your own rocket cost a point. 2 s of spawn protection (you look see-through; firing ends it). Score and clock at the top of each screen, hold Back / Tab for the scoreboard, end screen with the winner, then A / Space to play again."}]}, {"id": "F-055", "kind": "feature", "title": "Nightstick (melee)", "status": "verify", "priority": "", "section": ["Current build", "Built so far"], "progress": "", "file": "PLANS\\PROGRESS.md", "needs": "Does a 2-hit kill and 2.2 m reach feel fair?", "related": "F-020", "added": "2026-10-22", "edited": "2026-10-22 17:02", "body": [{"p": "Everyone always carries it: switch to it with Y / RB (last in the cycle). RT / click swings: 50 damage (2 hits kill without armour), reach 2.2 m in a cone in front of you, a small knockback, one swing every 0.6 s. No ammo, no zoom, no hits through walls."}]}, {"id": "F-017", "kind": "feature", "title": "Frag grenades", "status": "verify", "priority": "", "section": ["Current build", "Built so far"], "progress": "", "file": "PLANS\\PROGRESS.md", "needs": "Do the fuse (2.5 s), blast size and throw distance feel right?", "related": "", "added": "2026-10-22", "edited": "2026-10-22 17:06", "body": [{"p": "Thrown with their own button: LB / G. You start with 2 (carry up to 4); FRAGS pickups behind the north and south cover walls give 2 more. They bounce, blink red, and go off 2.5 s after the throw: up to 100 damage within 5 m, fading with distance, plus a push. Your own grenade hurts you half as much and costs a point if it kills you."}]}, {"id": "F-054", "kind": "feature", "title": "Menus, settings, sound", "status": "verify", "priority": "", "section": ["Current build", "Built so far"], "progress": "", "file": "PLANS\\PROGRESS.md", "needs": "Are the sounds OK (too loud, too quiet, annoying)? Are footsteps too loud with four players? Is the pause menu easy to use on a pad?", "related": "", "added": "2026-10-21", "edited": "2026-10-22 20:17", "body": [{"p": "Start / Esc pauses the game and opens a menu for that player: look sensitivity, invert look, crouch toggle or hold, volume, match setup, quit. Match setup sets the kill limit, time limit and number of bots for the next match. Choices are saved. Sound effects for guns, the Nightstick, grenades, explosions, reloads, pickups, hits, getting hurt, deaths, the end of a match and the menu, all made by the game itself (no sound files). Match setup also sets bot difficulty (F-053)."}, {"ul": ["2026-10-22: every move has a sound now: footsteps (quieter crouched), jump, landing (louder the further you fall), slide, roll, backstep, crouch and stand, wall-run start and steps, wall jump, ladder grab and rungs. Everyone hears other players' footsteps, fading with distance.", "2026-10-22: footsteps, slides and rolls turned down, as asked."]}]}, {"id": "F-053", "kind": "feature", "title": "Proper bots", "status": "verify", "priority": "", "section": ["Current build", "Built so far"], "progress": "", "file": "PLANS\\PROGRESS.md", "needs": "Do the bots feel fair? Is Easy easy enough and Hard hard enough?", "related": "", "added": "2026-10-21", "edited": "2026-10-22 17:52", "body": [{"p": "Bots walk the map to pickups they need (health when hurt, armour, guns they don't have, ammo), spot you in front of them, chase, keep a good distance for their gun, strafe and shoot. Shoot one from behind and it turns round. Easy, Medium or Hard in Match setup: harder bots react faster, aim better, see further and dodge more. They don't throw grenades or use ladders yet."}]}, {"id": "F-056", "kind": "feature", "title": "Sticky grenades you set off yourself", "status": "verify", "priority": "", "section": ["Current build", "Built so far"], "progress": "", "file": "PLANS\\PROGRESS.md", "needs": "Is D-pad up / F a good button? Do the damage (up to 120) and 4.5 m blast feel right?", "related": "F-017", "added": "2026-10-22", "edited": "2026-10-22 18:23", "body": [{"p": "From the boys' ideas. D-pad up / F throws one; it sticks to the first wall, floor or player it hits and only goes off when you press the button again. One out at a time. You start with 1 and carry up to 3; STICKY boxes on the east and west crates give 2. Stuck on someone, it rides along with them and they see \"STICKY ON YOU!\". It fizzles if you die first. Bots don't use them yet."}]}, {"id": "F-020", "kind": "feature", "title": "Melee: sledge, spear, knife, shield, chainsaw", "status": "verify", "priority": "", "section": ["Current build", "Built so far"], "progress": "", "file": "PLANS\\PROGRESS.md", "needs": "Is each one worth picking up? Is the shield too strong or too weak?", "related": "F-055", "added": "2026-10-22", "edited": "2026-10-22 23:38", "body": [{"ul": ["2026-10-22: each weapon now swings its own way, with a wind-up and then a hard, fast strike: the Nightstick chops down, the knife slashes, the spear and shield thrust, the sledge winds up high and smashes down, the claws swipe. The hit lands on the frame the swing does, and the sound is a soft whoosh timed to it (heavier for the sledge, sharper for the knife)."]}, {"p": "All five are pickups on the map, next to the Nightstick in the Y / RB cycle. RT / click swings. Knife: quick, 35 damage, short reach. Spear: 60 damage, long reach (3.5 m) but you have to aim it. Sledge: slow, kills in one hit without armour, big knockback. Chainsaw: hold RT to keep cutting, about 75 damage a second, short reach. Shield: while you hold it, hits from in front do only a fifth of the damage (bullets, rockets, grenades and melee); RT bashes for 25. Bots pick them up and use the strongest one up close."}]}, {"id": "F-027", "kind": "feature", "title": "Wall running", "status": "done", "priority": "", "section": ["Current build", "Built so far"], "progress": "", "file": "PLANS\\The Boys\\Ideas.md", "needs": "", "related": "", "added": "2026-10-22", "edited": "2026-10-23 00:06", "body": [{"p": "Jump at a wall from the side while running, keep holding forward, and you run along it for as long as you keep your speed up (F-070), with the view tilted away from the wall. Press jump to leap off it, out and up; you can jump across to another wall and run that one too (not the same wall twice before you land). Let go of forward or press crouch to drop off. You can shoot while wall running. Bots don't wall run yet."}]}, {"id": "F-058", "kind": "feature", "title": "Jump pads (Claude)", "status": "verify", "priority": "", "section": ["Current build", "Built so far"], "progress": "", "file": "PLANS\\PROGRESS.md", "needs": "Fun or annoying? Do they throw you too high or too far?", "related": "F-059", "added": "2026-10-22", "edited": "2026-10-22 19:22", "body": [{"p": "**(Claude)** Glowing blue pads that bounce you about 6 m up and onward the way you're running, or the way you face if you stand still, so they work from any side. Bots use them too (they get thrown straight to the ledge). They are on Test Map 2 (F-059)."}, {"ul": ["2026-10-22: changed from a fixed throw to a bounce the way you run, as asked."]}]}, {"id": "F-062", "kind": "feature", "title": "Boot intro and front end", "status": "verify", "priority": "", "section": ["Current build", "Built so far"], "progress": "", "file": "PLANS\\PROGRESS.md", "needs": "Does it feel like a proper console game? Is the intro too long (any button skips it)?", "related": "F-040, F-063, F-010", "added": "2026-10-22", "edited": "2026-10-22 20:05", "body": [{"p": "Asked for in the Nightfire style, with our own names and look. The game boots with a short \"secure terminal\" intro: lines type out, a flash and a sting, and the NIGHTSHIFT logo decodes itself. Then a PRESS START title, and the COMMAND CENTRE menu: Multiplayer, Options, Controls, Quit. Multiplayer opens MISSION SETUP: scenario (mode), arena (map), weapons and the match rules, with a briefing panel on the right that explains the row you're on and the arena turning behind it. Navy screens with scanlines, cyan and amber text, button hints at the bottom. Works on any pad or the keyboard."}, {"ul": ["**(Claude)** Options > Boot intro turns the intro off (it goes straight to the title). Controls shows the pad and keyboard buttons. \"Main menu\" in the pause menu now goes back to Mission setup."]}]}, {"id": "F-063", "kind": "feature", "title": "Agent lobby with teams", "status": "verify", "priority": "", "section": ["Current build", "Built so far"], "progress": "", "file": "PLANS\\PROGRESS.md", "needs": "Is it clear how to join, pick a team and ready up?", "related": "F-062, F-060", "added": "2026-10-22", "edited": "2026-10-22 20:05", "body": [{"p": "After Mission setup comes the AGENT LOBBY: four agent cards. Whoever pressed Continue is already in; everyone else presses A / Enter to join with their own pad or the keyboard. In Team Deathmatch, left / right picks Blue or Red. A readies up; B un-readies (press again to leave). X / R adds a bot, Y / Q removes one (bots are shared out to even the teams). When everyone is ready, and both teams have someone, a 3 s countdown starts the match."}, {"ul": ["**(Claude)** The ready-up and countdown, and the bot buttons in the lobby."]}]}, {"id": "F-039", "kind": "feature", "title": "Fair for everyone (Joel)", "status": "idea", "priority": "", "section": ["Design rules"], "progress": "", "file": "PLANS\\The Boys\\Joel .txt", "needs": "Discuss the catch-up idea with the boys", "related": "", "added": "2026-10-22", "edited": "2026-10-22 12:58", "body": [{"p": "The game should be accessible: anyone has a chance, and even an elite player can be killed."}, {"ul": ["Possible equaliser: players doing worse get a small health bonus."]}]}, {"id": "F-066", "kind": "feature", "title": "Screen tricks in split screen", "status": "idea", "priority": "", "section": ["Look and feel"], "progress": "", "file": "PLANS\\The Boys\\Ideas.md", "needs": "Talk it through: is it fun or just annoying?", "related": "F-046", "added": "2026-10-22", "edited": "2026-10-23 00:58", "body": [{"p": "Darren's idea, from the Mario Kart ink blot (2026-10-23: he's branching it out, and says it needs careful thought). Stop players looking at each other's part of the screen: an effect that makes your quarter clear to you but hard to read for the others, which relies on everyone sitting in front of their own quarter."}, {"ul": ["**(Claude)** A true \"only clear from your seat\" trick needs special screens, so it can't really be done. What can work: a weapon or pickup that splats ink or static over one player's screen for a few seconds (the Mario Kart way), or a \"radar jammer\" that scrambles the enemy's mini-map. Both use the same screen spot as the HUD."]}]}, {"id": "F-001", "kind": "feature", "title": "Slide", "status": "pass", "priority": "", "section": ["Movement"], "progress": "", "file": "PLANS\\The Boys\\Ideas.md", "needs": "", "related": "", "added": "2026-10-22", "edited": "2026-10-22 12:58", "body": [{"p": "Works in game."}]}, {"id": "X-001", "kind": "fix", "title": "Slide could last longer / travel further", "status": "pass", "priority": "", "section": ["Movement"], "progress": "", "file": "PLANS\\The Boys\\Ideas.md", "needs": "", "related": "F-001", "added": "2026-10-22", "edited": "2026-10-22 16:42", "body": [{"p": "Feedback from the boys after playing."}, {"ul": ["2026-10-22: slide now carries about 10 m (was about 6.5 m) and lasts up to 1.6 s. Numbers in `scripts/core/game_tuning.gd` (Slide)."]}]}, {"id": "F-003", "kind": "feature", "title": "Tap jump = small, hold jump = big", "status": "done", "priority": "", "section": ["Movement"], "progress": "", "file": "PLANS\\The Boys\\Ideas.md", "needs": "", "related": "", "added": "2026-10-22", "edited": "2026-10-22 12:58", "body": []}, {"id": "F-004", "kind": "feature", "title": "Dark Souls style roll", "status": "done", "priority": "", "section": ["Movement"], "progress": "", "file": "PLANS\\The Boys\\Ideas.md", "needs": "", "related": "", "added": "2026-10-22", "edited": "2026-10-22 12:58", "body": [{"p": "On B / Circle, with dodge frames."}]}, {"id": "F-026", "kind": "feature", "title": "Ledge hang + pull people down", "status": "idea", "priority": "", "section": ["Movement"], "progress": "", "file": "PLANS\\The Boys\\Ideas.md", "needs": "Ask Will how it worked in Uncharted 3", "related": "", "added": "2026-10-22", "edited": "2026-10-22 12:58", "body": [{"p": "From Uncharted 3 multiplayer: hang off a ledge and drag a player above you down. Was under game modes, but it's a move."}]}, {"id": "F-072", "kind": "feature", "title": "Realistic melee weapons and swings", "status": "in progress", "priority": "", "section": ["Weapons and pickups"], "progress": "", "file": "PLANS\\The Boys\\Ideas.md", "needs": "Do the new swings feel right? Then: better models", "related": "F-020, F-071", "added": "2026-10-22", "edited": "2026-10-22 23:38", "body": [{"p": "Make the melee weapons look real and swing the way you'd really hold them. Worth spending time on (like Mount & Blade and Morrowind)."}, {"ul": ["2026-10-22: first pass at the swings: each weapon has its own wind-up and strike, with the hit and the whoosh timed to it (see F-020). The models are still simple boxes; next is proper models, then hands holding them."]}]}, {"id": "F-002", "kind": "feature", "title": "Pistol, rocket launcher, sniper", "status": "done", "priority": "", "section": ["Weapons and pickups"], "progress": "", "file": "PLANS\\The Boys\\Ideas.md", "needs": "", "related": "", "added": "2026-10-22", "edited": "2026-10-22 12:58", "body": [{"p": "Pocket 9 pistol, Hammerhead rocket launcher, Longsight sniper. The Kestrel assault rifle was added since."}]}, {"id": "F-012", "kind": "feature", "title": "Pickups hover, spin and bob", "status": "done", "priority": "", "section": ["Weapons and pickups"], "progress": "", "file": "PLANS\\The Boys\\Ideas.md", "needs": "", "related": "", "added": "2026-10-22", "edited": "2026-10-22 12:58", "body": [{"p": "Was \"gun animation\" under Guns. Weapons on the ground already float, rotate and bob."}]}, {"id": "F-061", "kind": "feature", "title": "Weapon sets: choose what spawns", "status": "verify", "priority": "", "section": ["Weapons and pickups"], "progress": "", "file": "PLANS\\PROGRESS.md", "needs": "Which sets are fun? Any set you'd add?", "related": "F-062", "added": "2026-10-22", "edited": "2026-10-22 20:05", "body": [{"p": "Asked for with the new menus. Mission setup > Weapons picks what the map's weapon pickups turn into. Standard (the map's own), Rifles, Snipers, Explosives, Power weapons (rockets and snipers), Pistols only (no weapon pickups), Melee only (no guns or grenades at all, everyone starts with the Nightstick, the pickups are melee weapons) and Random (different every match). Ammo, health and armour stay as they are. Also in the pause menu's Match setup."}]}, {"id": "F-057", "kind": "feature", "title": "Bodies blown apart, parts popping off (Joel)", "status": "idea", "priority": "", "section": ["Look and feel"], "progress": "", "file": "PLANS\\The Boys\\Ideas.md", "needs": "", "related": "", "added": "2026-10-22", "edited": "2026-10-22 18:23", "body": [{"p": "Something happens to the body on death. Explosions blow it to pieces; enough damage knocks parts off. Placeholder bodies are capsules for now, so this waits for proper player models."}]}, {"id": "F-006", "kind": "feature", "title": "Night theme, huts to camp in, sniper towers", "status": "in progress", "priority": "", "section": ["Maps", "Current map"], "progress": "60", "file": "PLANS\\The Boys\\Ideas.md", "needs": "", "related": "", "added": "2026-10-22", "edited": "2026-10-22 19:14", "body": [{"p": "Night lighting, 2 huts and 2 towers are in. This map is now called Test Map 1; the taller arena is Test Map 2 (F-059)."}]}, {"id": "F-018", "kind": "feature", "title": "Bigger map with lots of hiding spots", "status": "in progress", "priority": "", "section": ["Maps", "Current map"], "progress": "40", "file": "PLANS\\The Boys\\Ideas.md", "needs": "", "related": "", "added": "2026-10-22", "edited": "2026-10-22 20:50", "body": [{"p": "Test map is now 4x the area with spread-out spawns."}, {"ul": ["Still to do: more hiding spots, weapon spots, small windows in buildings to shoot from.", "2026-10-22: the toilet block (F-013) and its vent (F-014) are new hiding spots, with slit windows."]}]}, {"id": "F-013", "kind": "feature", "title": "Toilet to hide in, doors that open and close", "status": "verify", "priority": "", "section": ["Maps", "Current map"], "progress": "", "file": "PLANS\\The Boys\\Ideas.md", "needs": "Do the doors feel right? Should they shut by themselves, or stay open until someone closes them?", "related": "F-014, F-018", "added": "2026-10-22", "edited": "2026-10-22 20:50", "body": [{"p": "Test Map 1 has a toilet block on the west side: three cubicles, each with a toilet and a swing door, and a WC sign over the doors."}, {"ul": ["**(Claude)** Doors swing open away from you when you walk into them (bots too) and shut by themselves a moment after nobody is near. A shut door blocks bullets and blasts, so you can hide inside. There's no extra button: the pad has none to spare.", "**(Claude)** Small slit windows in the end cubicle to peek and shoot out of.", "Bots don't go into the cubicles yet (the doorways are too narrow for their paths)."]}]}, {"id": "F-014", "kind": "feature", "title": "Vents to crawl through to sneaky spots", "status": "verify", "priority": "", "section": ["Maps", "Current map"], "progress": "", "file": "PLANS\\The Boys\\Ideas.md", "needs": "Is the vent fun? Where else should vents go?", "related": "F-013", "added": "2026-10-22", "edited": "2026-10-22 20:50", "body": [{"p": "GoldenEye style, e.g. a vent into the toilet."}, {"ul": ["2026-10-22: a low duct (crouch or slide to get in) runs from the gap by the west wall into the end toilet cubicle. Bots don't use it."]}]}, {"id": "F-019", "kind": "feature", "title": "Destructible sniper tower", "status": "verify", "priority": "", "section": ["Maps", "Current map"], "progress": "", "file": "PLANS\\The Boys\\Ideas.md", "needs": "Knock a tower down: does it take the right number of shots, and does the fall look and feel right?", "related": "F-006", "added": "2026-10-22", "edited": "2026-10-22 23:38", "body": [{"p": "Shoot its legs to wear them down (visible damage). It falls with physics and does big damage to anyone on it or under it."}, {"ul": ["Both towers on Test Map 1 can now be knocked down. Bullets and blasts wear the legs down: a hurt leg gets thinner and scorched, and the tower starts to lean.", "When a leg breaks the tower creaks, topples toward that leg and crashes. Anyone under it or up on it takes 200 damage; the kill goes to whoever broke the leg.", "**(Claude)** It stands back up after 45 s (once nobody is in the way), and on a new match.", "2026-10-22 (rework, as asked, Red Faction style): every shot punches a hole in the wood where it lands and throws wood chips. A leg snaps at the spot you hit most, leaving a stump with splintered ends. Then the whole tower is a physics object: it rocks on the legs that are left and tips toward the missing one. Shoot a leg high and it snaps high. Melee swings chip it too. Once it lands it's solid cover. Checked by a new headless probe (tests/tower_probe.gd)."]}]}, {"id": "F-073", "kind": "feature", "title": "City level with things to destroy", "status": "idea", "priority": "", "section": ["Maps", "New maps"], "progress": "", "file": "PLANS\\The Boys\\Ideas.md", "needs": "What kind of city? Which things should break?", "related": "F-019", "added": "2026-10-22", "edited": "2026-10-22 23:38", "body": [{"p": "Destruction like the sniper tower (F-019) as a big part of the game, maybe in a city level: wooden sheds, scaffolding, walls and water towers you can shoot apart, and floors that drop when the supports go."}, {"ul": ["**(Claude)** The tower code can be reused for any wooden frame: legs that wear and snap, and the rest falling under physics."]}]}, {"id": "F-059", "kind": "feature", "title": "Test Map 2: tall arena (Claude)", "status": "verify", "priority": "", "section": ["Maps", "New maps"], "progress": "", "file": "PLANS\\PROGRESS.md", "needs": "Is it fun? Too big, too small, too easy to camp the spire?", "related": "F-058, F-027, F-018", "added": "2026-10-22", "edited": "2026-10-22 19:22", "body": [{"p": "**(Claude)** A second test map built for going up. Pick it in the main menu (F-010)."}, {"ul": ["Four corner decks 4 m up with a hiding room under each one. Get up by ramp, ladder or jump pad.", "Catwalks along the outer walls with a 10 m gap in the middle of each side: wall run across it (F-027), or bounce along the wall from the jump pad in the gap.", "Four bridges from the corner decks to a spire in the middle. A gentle jump pad on the spire's slab bounces you onto the top, where the Hammerhead sits. Armour is in the room under it.", "Tall fins on the ground to wall run along, crates and low walls for cover.", "Rifles and scopes on the decks, health under them, all five melee weapons on the ground."]}]}, {"id": "F-015", "kind": "feature", "title": "Alaska Fried Chicken level", "status": "idea", "priority": "", "section": ["Maps", "New maps"], "progress": "", "file": "PLANS\\The Boys\\Ideas.md", "needs": "", "related": "F-033", "added": "2026-10-22", "edited": "2026-10-22 12:58", "body": [{"p": "Just the restaurant interior as a map. Could pair with a capture or waves mode."}]}, {"id": "F-007", "kind": "feature", "title": "Stars, rounder shapes, overgrown ruins", "status": "in progress", "priority": "", "section": ["Maps", "Visual style"], "progress": "", "file": "PLANS\\The Boys\\Ideas.md", "needs": "", "related": "", "added": "2026-10-22", "edited": "2026-10-22 16:36", "body": [{"p": "Sky with stars; buildings that aren't all boxes. Will loves the overgrown post-apocalyptic world of The Last of Us Part II."}, {"ul": ["2026-10-22: stars and a moon are in the night sky (`maps/materials/night_sky.gdshader`). Rounder buildings and ruins still to do."]}]}, {"id": "F-077", "kind": "feature", "title": "Game mode: Be the bummer", "status": "verify", "priority": "", "section": ["Game modes"], "progress": "", "file": "PLANS\\The Boys\\Ideas.md", "needs": "the boys to play a few rounds and judge the head start, round time and points", "related": "F-005, F-073", "added": "2026-10-23", "edited": "2026-10-23 08:53", "body": [{"p": "One player hunts the rest. If he catches someone, they're out (the joke stays off screen). Everyone else has to survive until the timer runs out. Best on a city map with lots of places to hide (F-073)."}, {"p": "Built 2026-10-23 as \"Be the Bummer\" in Mission setup:"}, {"ul": ["Everyone takes one turn as the bummer, in player order. He is dark red with a glowing visor, has claws that grab in one hit, runs a bit faster, and takes only a quarter of any hit.", "He is held with a black screen for 5 s while the others hide. Rounds last 90 s by default (Round time in setup).", "Hiders carry a nightstick and can't hurt each other. Caught = out until the next round.", "Points: 1 per catch for the bummer, 2 for each hider still free at the end, 1 for knocking the bummer out. The most points after everyone's turn wins.", "Bot hiders run from the bummer; a bot bummer hunts.", "2026-10-23: a swipe grabs the hider from behind first. The bummer holds them in front of him and bounces them up and down for 3 s (boing!), then they're caught. Neither can move; knocking the bummer out in time sets them free. Tuning: bummer_hold_time, bummer_bounce_rate, bummer_bounce_height."]}]}, {"id": "F-010", "kind": "feature", "title": "Mode select: everyone gets their own mode", "status": "verify", "priority": "", "section": ["Game modes"], "progress": "", "file": "PLANS\\The Boys\\Joel .txt", "needs": "Is the main menu easy to use? Which mode should come next?", "related": "F-028", "added": "2026-10-22", "edited": "2026-10-22 20:05", "body": [{"p": "Joel's idea: simple selectable modes, so each of the boys has a corner for their own ideas."}, {"ul": ["2026-10-22: new front end (F-062): pick the scenario, arena and weapons in Mission setup, then join and pick teams in the lobby (F-063). Team Deathmatch added (F-060).", "2026-10-22: the game now starts on a main menu with the map turning behind it. Pick the mode (Deathmatch or One in the Chamber), the map (Test Map 1 or 2) and the match setup, then Start. Whoever presses Start is P1; the others join in the game as before. \"Main menu\" in the pause menu goes back to it."]}]}, {"id": "F-060", "kind": "feature", "title": "Team Deathmatch", "status": "verify", "priority": "", "section": ["Game modes"], "progress": "", "file": "PLANS\\PROGRESS.md", "needs": "Should friendly fire be on or off by default? Is the -1 for a teamkill fair?", "related": "F-010, F-063", "added": "2026-10-22", "edited": "2026-10-22 20:05", "body": [{"p": "Blue against Red. Pick your team in the lobby (F-063); bots are shared out to even it up. Everyone wears their team colour. Every kill scores for your team; killing a teammate or yourself costs a point. First team to the kill limit wins, or the team with the most when time runs out. The HUD and scoreboard show the team totals."}, {"ul": ["**(Claude)** Friendly fire is a setting (Off by default): with it off, teammates' bullets and blasts don't hurt you."]}]}, {"id": "F-023", "kind": "feature", "title": "Quake Arena mode", "status": "idea", "priority": "", "section": ["Game modes"], "progress": "", "file": "PLANS\\The Boys\\Ideas.md", "needs": "", "related": "", "added": "2026-10-22", "edited": "2026-10-22 12:58", "body": []}, {"id": "F-028", "kind": "feature", "title": "One in the Chamber", "status": "verify", "priority": "", "section": ["Game modes"], "progress": "", "file": "PLANS\\The Boys\\Ideas.md", "needs": "Are 3 lives right? Should the Nightstick stay, or bullets only?", "related": "F-044, F-010", "added": "2026-10-22", "edited": "2026-10-22 19:14", "body": [{"p": "Black Ops 1 style: one bullet, a kill refills it, limited lives."}, {"ul": ["2026-10-22: built. Everyone has the Pocket 9 with one bullet and the Nightstick, and every hit kills. A kill gives you a bullet back. 3 lives each (1 to 9 in Match setup); out of lives means you watch. Last one with lives left wins. No pickups. Bots play it too."]}]}, {"id": "F-016", "kind": "feature", "title": "Slay the Minotaur", "status": "research", "priority": "", "section": ["Game modes"], "progress": "", "file": "PLANS\\The Boys\\Ideas.md", "needs": "", "related": "F-041", "added": "2026-10-22", "edited": "2026-10-22 12:58", "body": [{"p": "Play it and work out what makes it fun."}]}, {"id": "F-021", "kind": "feature", "title": "Co-op survival waves + campaign", "status": "idea", "priority": "", "section": ["Game modes"], "progress": "", "file": "PLANS\\The Boys\\Ideas.md", "needs": "", "related": "", "added": "2026-10-22", "edited": "2026-10-22 12:58", "body": [{"p": "Left 4 Dead style."}]}, {"id": "F-036", "kind": "feature", "title": "Aliens vs Predator style mode", "status": "research", "priority": "", "section": ["Game modes"], "progress": "", "file": "PLANS\\The Boys\\Ideas.md", "needs": "", "related": "", "added": "2026-10-22", "edited": "2026-10-22 12:58", "body": [{"p": "The 360 multiplayer was awesome. Work out what to take from it."}]}, {"id": "F-030", "kind": "feature", "title": "Monkey Ball style party mode", "status": "research", "priority": "", "section": ["Game modes"], "progress": "", "file": "PLANS\\The Boys\\Ideas.md", "needs": "", "related": "", "added": "2026-10-22", "edited": "2026-10-22 12:58", "body": [{"p": "Great fun on the 360 version. Note #31: the chance of success or failure is what makes it fun, and it's a good drunk game."}]}, {"id": "F-034", "kind": "feature", "title": "Crazy Taxi style mode", "status": "research", "priority": "", "section": ["Game modes"], "progress": "", "file": "PLANS\\The Boys\\Ideas.md", "needs": "", "related": "", "added": "2026-10-22", "edited": "2026-10-22 12:58", "body": []}, {"id": "F-037", "kind": "feature", "title": "Killstreak rewards and awards", "status": "verify", "priority": "", "section": ["Killstreaks and progression"], "progress": "50", "file": "PLANS\\The Boys\\Ideas.md", "needs": "Play a match and say if 3 and 5 kills feel right. Which other rewards do the boys want (and any awards or progression)?", "related": "F-008", "added": "2026-10-22", "edited": "2026-10-22 20:55", "body": [{"p": "Second note #7. Modern Warfare style killstreaks plus progression to keep players interested."}, {"ul": ["Kills in a row without dying now earn rewards in Deathmatch and Team Deathmatch. Dying resets your streak.", "**(Claude)** 3 kills: radar for 30 s. The mini-map zooms out and shows everyone clearly; its rim pulses green.", "5 kills: you turn into the werewolf (F-008).", "**(Claude)** A \"Killstreaks\" On/Off switch on the match setup page (on by default).", "Not done yet: awards and progression."]}]}, {"id": "F-008", "kind": "feature", "title": "5-kill streak = become the werewolf", "status": "verify", "priority": "", "section": ["Killstreaks and progression"], "progress": "", "file": "PLANS\\The Boys\\Ideas.md", "needs": "Is the werewolf too strong or too weak? Should it look more like a wolf than a big furry player?", "related": "F-037", "added": "2026-10-22", "edited": "2026-10-23 00:58", "body": [{"p": "Inspired by the film Dog Soldiers."}, {"ul": ["5 kills without dying turns you into a werewolf for 30 s, with a howl. Everyone else is told.", "**(Claude)** The werewolf is bigger and furry, with glowing red eyes, and has claws only: fast, hard-hitting swipes. No guns, grenades or pickups.", "**(Claude)** It runs faster, starts at full health and takes half damage. It shows with a red ring on everyone's mini-map.", "When it wears off (or you die) you get your guns back.", "2026-10-23 (Darren's notes):"]}, {"p": "- The change takes 1.6 s. You can't move and can't be hurt while the camera circles round from in front of you to behind, so you watch yourself grow and turn furry. Then it slides back into your eyes. - Jaw view: rows of teeth and gums at the top and bottom of your screen, with long fangs, a slow pant, and a loping sway as you run (after the skulk in Natural Selection 2). - Claws: two paws in view, each with four curved claws. - Everyone hears the howl, wherever they are. It's made up for now: drop a recording in as `sounds\\howl.mp3` (or .ogg / .wav) and it's used instead. That works for any sound. - 4 s before it wears off, a whoosh rises so you know it's ending."}]}, {"id": "F-025", "kind": "feature", "title": "Create a class", "status": "idea", "priority": "", "section": ["Killstreaks and progression"], "progress": "", "file": "PLANS\\The Boys\\Ideas.md", "needs": "", "related": "", "added": "2026-10-22", "edited": "2026-10-22 12:58", "body": [{"p": "Choose your loadout before spawning."}]}, {"id": "F-024", "kind": "feature", "title": "Persistent leaderboards", "status": "idea", "priority": "", "section": ["Killstreaks and progression"], "progress": "", "file": "PLANS\\The Boys\\Ideas.md", "needs": "", "related": "", "added": "2026-10-22", "edited": "2026-10-22 12:58", "body": []}, {"id": "F-005", "kind": "feature", "title": "The \"bumming guy\"", "status": "verify", "priority": "", "section": ["Silly extras"], "progress": "", "file": "PLANS\\The Boys\\Ideas.md", "needs": "Does he come too often or too rarely? Too fast, too tough? Is breaking free fun?", "related": "", "added": "2026-10-22", "edited": "2026-10-23 09:10", "body": [{"p": "Miss 10-15 shots with a projectile weapon and he's alerted and chases you."}, {"ul": ["If he catches you, you're out of play for 5 s.", "You can escape on a timer if you're skilled; he can be killed, but not easily.", "As a whole game mode, see F-077."]}, {"p": "Built 2026-10-23 (Deathmatch and Team Deathmatch, \"Bumming guy\" row in Mission setup):"}, {"ul": ["Misses in a row count (a hit resets them). Bullets that hit nobody and rockets whose blast hurts nobody are misses. At a random 10-15 he's called.", "He turns up 15-35 m away with an alarm and runs you down along the navmesh, a bit slower than you run.", "Caught: he bounces you in front of him for 5 s (like the bummer). You can't move or be hurt. Each jump press takes 0.25 s off.", "500 health; shots, blades and blasts hurt him. Downing him frees whoever he holds. He gives up after 45 s. One per player at a time.", "Bots run from him and mash jump when caught. Tuning: the \"Bumming guy\" group in game_tuning.gd."]}]}, {"id": "F-035", "kind": "feature", "title": "Voice acting from everyone we know", "status": "idea", "priority": "", "section": ["Silly extras"], "progress": "", "file": "PLANS\\The Boys\\Ideas.md", "needs": "", "related": "", "added": "2026-10-22", "edited": "2026-10-22 12:58", "body": []}, {"id": "F-033", "kind": "feature", "title": "Bumbaclart chicken nuggets", "status": "idea", "priority": "", "section": ["Silly extras"], "progress": "", "file": "PLANS\\The Boys\\Ideas.md", "needs": "Ask the boys what this one means", "related": "F-015", "added": "2026-10-22", "edited": "2026-10-22 12:58", "body": [{"p": "An item, a taunt, or part of the Alaska Fried Chicken level? **(Claude)**"}]}, {"id": "F-076", "kind": "feature", "title": "Humanoid players with fluid parkour", "status": "idea", "priority": "", "section": ["Big ideas for later"], "progress": "", "file": "PLANS\\The Boys\\Ideas.md", "needs": "", "related": "F-067, F-072, F-075", "added": "2026-10-23", "edited": "2026-10-23 00:58", "body": [{"p": "Players and bots as proper people, not capsules. A full, smooth system for climbing, wall running, sliding, rolling and changing weapons. Parkour climb-ups and vaults over small things while fighting or chasing, in any direction, and it looks smooth to the other players too."}, {"ul": ["**(Claude)** Needs a rigged model with animations, blended to fit the movement we already have. Melee hitboxes would then follow the model's limbs (F-075)."]}]}, {"id": "F-009", "kind": "feature", "title": "Online multiplayer + proximity chat", "status": "parked", "priority": "", "section": ["Big ideas for later"], "progress": "", "file": "PLANS\\The Boys\\Ideas.md", "needs": "", "related": "", "added": "2026-10-22", "edited": "2026-10-22 12:58", "body": [{"p": "Voice and text chat. A big job: splitscreen comes first."}]}, {"id": "F-011", "kind": "feature", "title": "Forge-style map editor", "status": "parked", "priority": "", "section": ["Big ideas for later"], "progress": "", "file": "PLANS\\The Boys\\Ideas.md", "needs": "", "related": "", "added": "2026-10-22", "edited": "2026-10-22 12:58", "body": [{"p": "Halo Forge: build our own maps and environments."}]}, {"id": "F-038", "kind": "feature", "title": "Open world", "status": "parked", "priority": "", "section": ["Big ideas for later"], "progress": "", "file": "PLANS\\The Boys\\Ideas.md", "needs": "", "related": "", "added": "2026-10-22", "edited": "2026-10-22 12:58", "body": [{"p": "Second note #13. \"Lol\"."}]}, {"id": "F-040", "kind": "feature", "title": "Nightfire", "status": "research", "priority": "", "section": ["Inspiration: games to study"], "progress": "", "file": "PLANS\\The Boys\\Games to play-reference.txt", "needs": "", "related": "", "added": "2026-10-22", "edited": "2026-10-22 20:05", "body": [{"p": "The base inspiration. We use only our own names, art and maps."}, {"ul": ["2026-10-22: the menus (F-062) follow its style: a boot intro, a \"command centre\" and mission setup, with our own names."]}]}, {"id": "F-041", "kind": "feature", "title": "Slay the Minotaur", "status": "research", "priority": "", "section": ["Inspiration: games to study"], "progress": "", "file": "PLANS\\The Boys\\Games to play-reference.txt", "needs": "", "related": "F-016", "added": "2026-10-22", "edited": "2026-10-22 12:58", "body": []}, {"id": "F-042", "kind": "feature", "title": "Battlefield 1943", "status": "research", "priority": "", "section": ["Inspiration: games to study"], "progress": "", "file": "PLANS\\The Boys\\Games to play-reference.txt", "needs": "", "related": "", "added": "2026-10-22", "edited": "2026-10-22 12:58", "body": []}, {"id": "F-043", "kind": "feature", "title": "Vampire Slayer FPS", "status": "research", "priority": "", "section": ["Inspiration: games to study"], "progress": "", "file": "PLANS\\The Boys\\Games to play-reference.txt", "needs": "", "related": "", "added": "2026-10-22", "edited": "2026-10-22 12:58", "body": []}, {"id": "F-045", "kind": "feature", "title": "Uncharted 3 multiplayer", "status": "research", "priority": "", "section": ["Inspiration: games to study"], "progress": "", "file": "PLANS\\The Boys\\Games to play-reference.txt", "needs": "Ask Will which mode", "related": "F-026", "added": "2026-10-22", "edited": "2026-10-22 12:58", "body": []}, {"id": "F-044", "kind": "feature", "title": "Black Ops 1: One in the Chamber", "status": "research", "priority": "", "section": ["Inspiration: games to study"], "progress": "", "file": "PLANS\\The Boys\\Games to play-reference.txt", "needs": "", "related": "F-028", "added": "2026-10-22", "edited": "2026-10-22 12:58", "body": []}, {"id": "F-029", "kind": "feature", "title": "PS3 / 360 era games", "status": "research", "priority": "", "section": ["Inspiration: games to study"], "progress": "", "file": "PLANS\\The Boys\\Ideas.md", "needs": "", "related": "", "added": "2026-10-22", "edited": "2026-10-22 12:58", "body": [{"p": "Black Ops 1, MW2, Singularity (powers). Shadowrun: magic abilities, one to play with the boys."}]}], "changelog": [{"date": "2026-10-23", "time": "09:10", "title": "The bumming guy", "body": [{"p": "Miss too many shots and someone comes for you (F-005). In Deathmatch and Team Deathmatch:"}, {"ul": ["Miss 10-15 shots in a row (bullets or rockets that hit nobody) and an alarm goes off. A big dark red guy turns up some way off and runs at you.", "If he catches you, he bounces you in front of him for 5 s. You can't move, but you can't be hurt either. Mash jump to break free sooner.", "He takes a lot of damage to put down. Down him while he holds someone and they go free. He gives up after 45 s.", "Turn him off in Mission setup (\"Bumming guy\"). Bots run from him too."]}]}, {"date": "2026-10-23", "time": "08:53", "title": "The bummer bounces you before you're caught", "body": [{"p": "In Be the Bummer, a swipe now grabs a hider from behind instead of catching them straight away (F-077)."}, {"ul": ["The bummer holds them right in front of him and bounces them up and down for 3 seconds, with a boing on every bounce. Then they're caught.", "Neither of them can move while it happens. Knock the bummer out in time and your friend goes free."]}]}, {"date": "2026-10-23", "time": "08:46", "title": "New game mode: Be the Bummer", "body": [{"p": "One player is the bummer and hunts the rest (F-077). Pick it in Mission setup."}, {"ul": ["The bummer is dark red with claws and catches in one swipe. He waits 5 s with a black screen while everyone hides.", "Caught players are out until the next round. Players still free when time runs out score 2 points. Knocking the bummer out scores 1.", "Everyone gets one turn as the bummer, then the match ends. The most points wins.", "Bots run from the bummer, or hunt when they are the bummer."]}]}, {"date": "2026-10-23", "time": "00:58", "title": "Werewolf change, jaw view, VALUES folder", "body": [{"ul": ["Turning into the werewolf now takes a moment: the camera circles you while you grow and go furry. You can't be hurt while it happens (F-008).", "As the werewolf you see out through its jaws, with teeth at the top and bottom of the screen that sway as you run. Two clawed paws in view.", "Everyone hears the howl now. Put a recording at `sounds\\howl.mp3` to replace it. A whoosh rises 4 s before you change back.", "Melee hits connect better when you're right next to someone. A new `show_hitboxes` switch shows what melee aims at (F-075).", "New VALUES folder: every tuning number in a few tables, each with a link to where you change it (F-074).", "New ideas on the list: humanoid players with parkour (F-076), and the \"Be the bummer\" game mode (F-077)."]}]}, {"date": "2026-10-23", "time": "00:32", "title": "Ability icon and a charged werewolf pounce", "body": [{"ul": ["Melee weapons now have a small ability icon above the weapon name, with a different picture for each one. It goes dark grey when used and the colour fills back in as it recharges (F-071).", "Werewolf pounce: hold aim to charge it for up to 5 seconds. A full charge jumps about 7.5 m high."]}]}, {"date": "2026-10-23", "time": "00:17", "title": "Melee weapons get abilities", "body": [{"p": "Every melee weapon has a special move now on the aim button (LT / right mouse) (F-071)."}, {"ul": ["Knife: throw it. It kills up close, then lies on the floor until you pick it back up.", "Spear: lunge 4 m with a thrust. Sledge: slam the ground to knock everyone near you flying and dazed.", "Shield: hold aim to raise it and bounce rockets back. Chainsaw: hold aim to rev and run faster.", "Nightstick: a stun hit that freezes their aim and trigger for a moment. Werewolf claws: pounce."]}]}, {"date": "2026-10-23", "time": "00:06", "title": "Ledge climbing", "body": [{"p": "You can climb up onto ledges now (F-067). Jump at a wall or crate with the stick held forward and you pull yourself up onto the top."}, {"ul": ["Anything up to about 3.5 m high from a running jump, as long as there's room to stand on top.", "You rise, roll over the edge and keep running. It's first person only for now: proper climbing moves for other players to see come with proper player models."]}, {"p": "The new slides and wall runs are signed off as done (F-068, F-069, F-070, F-027)."}]}, {"date": "2026-10-22", "time": "23:54", "title": "Smarter slides and longer wall runs", "body": [{"p": "Slides now reward speed and stop rewarding spam."}, {"ul": ["Slide straight after another slide and it goes 25% less far each time. Wait 1.5 s and it's a full slide again (F-068).", "The slide starts at the speed you're going. Hit slide just as you land a jump and you shoot off faster and further (F-069).", "Crouching in mid-air no longer slows you down."]}, {"p": "Wall runs last as long as you keep your speed (F-070). You slow down bit by bit, then start to slip down the wall and drop off. Come in fast and you can run a long way."}]}, {"date": "2026-10-22", "time": "23:38", "title": "New melee swings, splintering towers, new ideas filed", "body": [{"p": "Melee weapons swing properly now (F-020, F-072)."}, {"ul": ["Each one moves its own way: the Nightstick chops down, the knife slashes, the spear and shield jab forward, the sledge winds up high and smashes down.", "The hit lands right when the swing does, with a soft whoosh instead of the scratchy sound."]}, {"p": "The sniper towers break apart like in Red Faction (F-019)."}, {"ul": ["Every shot punches a hole in the wooden legs and sends wood chips flying.", "A leg snaps where you hit it most and leaves a splintered stump. The tower then tips over toward the missing leg under real physics.", "Melee swings chip the wood too. A fallen tower is solid cover."]}, {"p": "New ideas from the boys are on the list: ledge climbing (F-067), no slide spamming (F-068), momentum slides (F-069), longer wall runs while you're fast (F-070), melee abilities (F-071), screen tricks in split screen (F-066) and a city level full of things to break (F-073)."}]}, {"date": "2026-10-22", "time": "20:59", "title": "Sniper towers come down", "body": [{"p": "You can now knock down the sniper towers on Test Map 1 (F-019)."}, {"ul": ["Shoot the legs or hit them with rockets and grenades. They get thinner and scorched, and the tower starts to lean.", "When a leg breaks the tower falls over and crushes anyone under it or on it.", "It stands back up after 45 seconds."]}]}, {"date": "2026-10-22", "time": "20:55", "title": "Killstreaks and the werewolf", "body": [{"p": "Get kills without dying to earn rewards (F-037)."}, {"ul": ["3 kills in a row: radar for 30 seconds. Your mini-map zooms out and shows everyone.", "5 kills in a row: you become the werewolf for 30 seconds (F-008). Bigger, furry, red eyes, claws only, faster and tougher. Everyone gets warned.", "You can switch killstreaks off lth kits on the map heal you (F-050).", "The night sky now has stars (F-007)."]}]}, {"date": "2026-10-22", "time": "13:43", "title": "One-click build and feature list", "body": [{"ul": ["One-click Windows build, and one-click publishing of this page.", "The feature list got a folding sidebar and clearer section names."]}]}, {"date": "2026-10-22", "time": "12:59", "title": "Plans folder", "body": [{"p": "Progress notes, the plan, the ideas board and the boys' notes now live together in the PLANS folder."}]}, {"date": "2026-10-21", "time": "23:31", "title": "Damage, death and respawn", "body": [{"ul": ["Players can now be hurt and die, then respawn (F-047).", "Health ring and armour vests (F-048).", "New Kestrel assault rifle (F-049) and a bigger 80 m test map."]}]}, {"date": "2026-10-21", "time": "22:43", "title": "First weapons", "body": [{"ul": ["Pocket 9 starting pistol.", "Hammerhead and Longsight weapon pickups, plus ammo boxes (F-002)."]}]}, {"date": "2026-10-21", "time": "22:20", "title": "Movement extras and night props", "body": [{"ul": ["Tap jump for a small jump, hold jump for a big one (F-003).", "Slide (F-001), roll (F-004) and ladders.", "A hut to camp in and a sniper tower (F-006)."]}]}, {"date": "2026-10-21", "time": "21:16", "title": "First playable build", "body": [{"p": "Nightshift starts: the project skeleton, controller and keyboard input, basic movement and a test room."}]}]};
const $ = id => document.getElementById(id);
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const state = {kind:"all", status:"", need:false, hideDone:store.get("ns.hideDone")==="1", q:"", secQ:"",
  section:store.get("ns.section")||"", sort:store.get("ns.sort")||"section", view:store.get("ns.view")==="log" ? "log" : "list"};
const LOG = DATA.changelog || [];
if(!["section","recent","oldest"].includes(state.sort)) state.sort = "section";
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const inline = s => esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
const cssStatus = s => "var(--s-" + s.replace(/ /g,"-") + ")";
const label = s => s.charAt(0).toUpperCase() + s.slice(1);
const SEP = " > ";
const pathOf = it => it.section.join(SEP);
const fileHref = f => "../" + f.replace(/\\/g,"/").split("/").map(encodeURIComponent).join("/");

// section tree, in the order sections first appear in FEATURES.md
const root = {name:"", path:"", kids:[], items:[]};
for(const it of DATA.items){
  let node = root;
  it.section.forEach((name, i) => {
    const path = it.section.slice(0, i+1).join(SEP);
    let k = node.kids.find(c => c.path === path);
    if(!k){ k = {name, path, kids:[], items:[], depth:i+1}; node.kids.push(k); }
    node = k;
  });
  node.items.push(it);
}
const allNodes = []; (function walk(n){ for(const k of n.kids){ allNodes.push(k); walk(k); } })(root);
if(state.section && !allNodes.some(n => n.path === state.section)) state.section = "";

function matches(it, opt){
  opt = opt || {};
  if(state.kind !== "all" && it.kind !== state.kind) return false;
  if(state.kind === "fix" && (it.status === "done" || it.status === "pass")) return false;   // finished fixes no longer need fixing
  if(!opt.ignoreStatus && state.status && it.status !== state.status) return false;
  if(state.hideDone && (it.status === "done" || it.status === "pass")) return false;
  if(state.need && !it.needs) return false;
  if(!opt.ignoreSection && state.section){
    const p = pathOf(it);
    if(p !== state.section && !p.startsWith(state.section + SEP)) return false;
  }
  if(state.q && !hay(it).includes(state.q)) return false;
  if(state.secQ && !hay(it).includes(state.secQ)) return false;
  return true;
}
const hay = it => it._hay || (it._hay = [it.id,it.title,it.status,pathOf(it),it.file,it.needs,it.related,
  it.body.map(b => b.p || b.ul.join(" ")).join(" ")].join(" ").toLowerCase());
const subtreeItems = n => n.items.concat(...n.kids.map(subtreeItems));

// folding sidebar: which sections show their subsections, and whether the list under "All sections" shows (both remembered)
const openSecs = new Set((() => { try { return JSON.parse(store.get("ns.openSecs") || "[]"); } catch(e) { return []; } })());
state.treeOpen = store.get("ns.treeOpen") !== "0";
const saveFold = () => { store.set("ns.openSecs", JSON.stringify([...openSecs])); store.set("ns.treeOpen", state.treeOpen ? "1" : "0"); };
// unfold the parents of a section so it can be seen in the sidebar
const openTo = p => { if(!p) return; state.treeOpen = true; const parts = p.split(SEP); for(let i = 1; i < parts.length; i++) openSecs.add(parts.slice(0, i).join(SEP)); };
openTo(state.section);

// "list" (the entries) or "log" (the changelog / devblog)
function setView(v){ state.view = v; store.set("ns.view", v); }
function setSection(p){ setView("list"); state.section = p; store.set("ns.section", p); openTo(p); saveFold(); render(); window.scrollTo({top:0}); }

function tree(){
  const box = $("tree"); box.innerHTML = "";
  const mk = (node, ul) => {
    const li = document.createElement("li");
    const row = document.createElement("div"); row.className = "trow";
    const b = document.createElement("button");
    const n = node === root ? DATA.items.filter(it => matches(it, {ignoreSection:true})).length
                            : subtreeItems(node).filter(it => matches(it, {ignoreSection:true})).length;
    // the sidebar filter hides sections with nothing that matches (the open section and "All sections" stay)
    if(state.secQ && !n && node !== root && state.section !== node.path) return;
    b.className = (node.depth === 1 ? "top" : "") + (state.view === "list" && state.section === node.path ? " on" : "") + (n ? "" : " dim");
    b.innerHTML = '<span class="nm">' + esc(node === root ? "All sections" : node.name) + '</span><span class="n">' + n + "</span>";
    b.onclick = () => setSection(node.path);
    // a filter in the sidebar unfolds everything so the matches show
    const isOpen = !!state.secQ || (node === root ? state.treeOpen : openSecs.has(node.path));
    if(node.kids.length){
      const t = document.createElement("button");
      t.className = "tog" + (isOpen ? " open" : "");
      t.innerHTML = "<span>&#9654;</span>";
      t.title = (isOpen ? "Hide " : "Show ") + (node === root ? "sections" : "subsections");
      t.setAttribute("aria-expanded", isOpen);
      t.onclick = () => {
        if(node === root) state.treeOpen = !isOpen;
        else if(isOpen) openSecs.delete(node.path); else openSecs.add(node.path);
        saveFold(); tree();
      };
      row.append(b, t);
    } else { row.appendChild(b); row.insertAdjacentHTML("beforeend", '<span class="tog"></span>'); }
    li.appendChild(row);
    if(node.kids.length && node !== root && isOpen){
      const sub = document.createElement("ul");
      for(const k of node.kids) mk(k, sub);
      li.appendChild(sub);
    }
    ul.appendChild(li);
  };
  mk(root, box);
  // the changelog sits right under "All sections"
  if(LOG.length){
    const li = document.createElement("li"); li.className = "logrow";
    li.innerHTML = '<div class="trow"><button class="top' + (state.view === "log" ? " on" : "") + '" title="What has been added and changed, newest first">' +
      '<span class="nm"><span class="ic">&#9998;</span> Changelog</span><span class="n">' + LOG.length + '</span></button><span class="tog"></span></div>';
    li.querySelector("button").onclick = () => { setView("log"); render(); window.scrollTo({top:0}); };
    box.appendChild(li);
  }
  if(state.treeOpen || state.secQ) for(const k of root.kids) mk(k, box);
}

function chips(){
  const box = $("statusChips"); box.innerHTML = "";
  const all = document.createElement("button");
  all.className = "chip" + (state.status ? "" : " on");
  all.innerHTML = "Any status";
  all.onclick = () => { state.status = ""; render(); };
  box.appendChild(all);
  for(const s of DATA.statuses){
    const n = DATA.items.filter(it => it.status === s && matches(it, {ignoreStatus:true})).length;
    if(!n && state.status !== s) continue;
    const b = document.createElement("button");
    b.className = "chip" + (state.status === s ? " on" : "");
    b.innerHTML = '<span class="dot" style="background:' + cssStatus(s) + '"></span>' + label(s) + '<span class="n">' + n + '</span>';
    b.onclick = () => { state.status = state.status === s ? "" : s; render(); };
    box.appendChild(b);
  }
}

function itemEl(it){
  const d = document.createElement("details");
  d.className = "item"; d.id = it.id;
  let badges = "";
  if(it.progress) badges += '<span class="pct" title="Completion">' + esc(it.progress) + '%<i><b style="width:' + Math.min(100, +it.progress || 0) + '%"></b></i></span>';
  if(it.kind === "fix" && it.status !== "done" && it.status !== "pass") badges += '<span class="badge fix">fix</span>';
  badges += '<span class="badge" style="color:' + cssStatus(it.status) + '">' + esc(it.status) + '</span>';
  if(it.priority) badges += '<span class="badge pri ' + esc(it.priority) + '">' + esc(it.priority) + '</span>';
  if(it.needs) badges += '<span class="badge needs">waiting on you</span>';
  if(state.sort !== "section") badges += '<span class="when" title="Last changed">' + esc(it.edited ? (it.edited.split(" ")[1] ? it.edited.split(" ")[1] + " GMT" : it.edited) : "no date") + "</span>";
  let body = "";
  for(const b of it.body){
    if(b.p) body += "<p>" + inline(b.p) + "</p>";
    else body += "<ul>" + b.ul.map(x => "<li>" + inline(x) + "</li>").join("") + "</ul>";
  }
  let meta = "";
  if(it.needs) meta += '<dt>Waiting on</dt><dd class="need">' + inline(it.needs) + "</dd>";
  if(it.file) meta += '<dt>File</dt><dd><a href="' + fileHref(it.file) + '" target="_blank">' + esc(it.file) + "</a></dd>";
  if(it.related) meta += "<dt>Related</dt><dd>" + inline(it.related) + "</dd>";
  meta += "<dt>Section</dt><dd>" + esc(it.section.join(" › ")) + "</dd>";
  if(it.added) meta += "<dt>Added</dt><dd>" + esc(it.added) + "</dd>";
  if(it.edited) meta += "<dt>Last changed</dt><dd>" + esc(it.edited) + (it.edited.includes(" ") ? " GMT" : "") + "</dd>";
  d.innerHTML = '<summary><span class="caret">&#9654;</span><span class="id">' + esc(it.id) +
    '</span><span class="title">' + esc(it.title) + '</span><span class="badges">' + badges +
    '</span></summary><div class="detail">' + body + '<dl class="meta">' + meta + "</dl></div>";
  return d;
}

function render(){
  chips(); tree();
  document.querySelectorAll("[data-kind]").forEach(b => b.classList.toggle("on", b.dataset.kind === state.kind));
  $("needBtn").classList.toggle("on", state.need);
  $("hideDone").classList.toggle("on", state.hideDone);
  $("needN").textContent = " " + DATA.items.filter(it => it.needs && matches(it, {ignoreSection:true})).length;
  const list = $("list");
  if(state.view === "log"){ renderLog(list); foot(); return; }
  const open = new Set([...list.querySelectorAll("details[open]")].map(d => d.id));
  list.innerHTML = "";
  if(state.section){
    const c = document.createElement("div"); c.className = "crumb";
    const parts = state.section.split(SEP);
    c.innerHTML = '<a data-p="">All sections</a>' + parts.map((p, i) =>
      ' › <a data-p="' + esc(parts.slice(0, i+1).join(SEP)) + '">' + esc(p) + "</a>").join("");
    c.querySelectorAll("a").forEach(a => a.onclick = () => setSection(a.dataset.p));
    list.appendChild(c);
  }
  let shown = 0;
  const heading = (node, tag, text, n) => {
    const h = document.createElement(tag);
    h.innerHTML = esc(text) + '<span class="c">' + n + "</span>";
    h.title = "Show only this section";
    h.onclick = () => setSection(node.path);
    list.appendChild(h);
  };
  const walk = (node, top) => {
    const items = node.items.filter(it => matches(it));
    const sub = subtreeItems(node).filter(it => matches(it));
    if(!sub.length) return;
    if(node.depth === 1) heading(node, "h2", node.name, sub.length);
    else if(items.length) heading(node, "h3", node.path.split(SEP).slice(top.depth).join(" › "), items.length);
    // features first, then fixes, keeping file order
    for(const it of items.filter(i => i.kind === "feature").concat(items.filter(i => i.kind === "fix"))){
      const el = itemEl(it);
      if(open.has(it.id)) el.open = true;
      list.appendChild(el); shown++;
    }
    for(const k of node.kids) walk(k, node.depth === 1 ? node : top);
  };
  if(state.sort === "section") for(const k of root.kids) walk(k, k);
  else {
