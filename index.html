p their speed, and joints get floppy as the wood at them is eaten away. Only the Tower Sandbox uses it; normal maps keep the solid tower. Numbers are in VALUES/materials.md."}]}, {"id": "F-091", "kind": "feature", "title": "Materials: brick, concrete, metal, glass, drywall, plastic, planks, steel", "status": "verify", "priority": "", "section": ["Weapons and pickups"], "progress": "", "file": "", "needs": "Does each material feel different to break? Glass shatter, drywall wallbangs, concrete holes?", "related": "F-090, F-073", "added": "2026-10-26", "edited": "2026-10-26 15:02", "body": [{"p": "**(Claude)** Asked for in chat, as the kit for the city (F-073). Each is one file in `materials/` with its own look, debris and six hit shapes. Brick crumbles in lumps, concrete is tough and takes holes from rockets, sheet metal gets small holes and sparks, glass shatters whole, drywall is weak (bullets go through), plastic cracks, planks snap, steel only has joints. Numbers are in VALUES/materials.md."}]}, {"id": "F-092", "kind": "feature", "title": "Materials Yard (test map)", "status": "verify", "priority": "", "section": ["Maps", "New maps"], "progress": "", "file": "", "needs": "Walk each building with each weapon. Smooth in 4-player splitscreen while wrecking things?", "related": "F-091, F-090, F-073", "added": "2026-10-26", "edited": "2026-10-26 20:24", "body": [{"p": "**(Claude)** Asked for in chat. A test map (Reset environment in the pause menu) with a breakable tower, a wooden shed (falls in a heap), a brick cottage (walls crumble, glass shatters, stands), a concrete bunker (holes in the walls, frame stays), a metal container with a plank footbridge to the bunker roof, and an office corner (glass front, drywall partitions). Pickups as in the Tower Sandbox. Bots and the mini-map ignore breakable pieces for now (city plan, phase C1)."}, {"p": "**(Claude, 2026-10-26 15:55)** Holes in walls can be shot and walked through. Buildings now collapse when the support under them is destroyed. The yard is 160 x 160 m with bigger, multi-storey buildings with ramps. Picking up an owned weapon refills it to full reserve."}, {"p": "**(Claude, 2026-10-26 16:15)** Townhouse stairs are carvable planks now and no longer hold floors up, so the house falls when its walls go. Falling floors drop in waves (lowest first) and break into smaller pieces where they hit the ground. `BreakableStructure` has `collapsed` and `piece_broke` signals for Will's sound effects."}, {"p": "**(Claude, 2026-10-26 16:58)** Buildings now have a stress graph: joints between touching pieces carry load (area x material strength x what is left of the cells). When a joint is overloaded it snaps with a torn crack, and what is cut off falls as one FallingSection (a single body, not dozens of tiles). Landing sections crack along weak joints, carve what they hit and can overload the floor below. Settled rubble freezes in place and wakes when hit; only about 40 sections move at once. All stairs are carvable. Pause menu on test maps has Show stress. Strength values in materials/*.tres need playtest tuning; bots and the navmesh still ignore breakables."}, {"p": "**(Claude, 2026-10-26 18:10)** Playtest fix: nothing fell until ~90% was gone, parts hung in the air, big stutter. Now `hold_margin` (2.0) sets how much every joint and wall carries: twice its load as built, so a building runs at 50% and gives way at about half. A wall breaks at its thinnest slice (`BreakablePiece.weakest_slice`); bits that come off join the building (`_enroll`). `MaterialDef.strength` is gone. Sections freeze only after resting on something (`is_resting`), start slightly smaller and ghost through what they overlap. The check runs a few passes a frame and cracks go through a 3 ms job queue. Show stress draws a ring at each wall's weakest slice and a % label. Needs: Weapon Range on the Materials Yard, Show stress on; cut about half of the townhouse ground walls and the upper storey should drop in a few sections."}, {"p": "**(Claude, 2026-10-26 18:46)** Less stutter in a collapse. Landings no longer crack and carve in the same frame: that work goes through the job queue, and cracks on the same piece are batched (`BreakablePiece.crack_many`, one rebuild). Splinters are capped at 30 new bodies a frame (`Splinters.PER_FRAME`), with a light spray for collapse cracks (`Splinters.LIGHT`). Sections only use continuous collision when a box is under 0.15 m thick (`FallingSection.CCD_THICK`). Faster `CellGrid.chunk_arrays` and exact boxes. The perf probe's new mass-disconnect test cuts every ground-floor wall at once. Worst headless frame went from 115-314 ms to about 20-30 ms."}, {"p": "**(Claude, 2026-10-26 19:31)** Rubble fixes from the step 121 playtest. A falling section's pieces are frozen static, not kinematic. Jolt sometimes wrote a kinematic piece's old place back, which left it hanging in the air. Section bodies are on their own `Layers.RUBBLE` layer and meet other sections body to body, never through their pieces. Pushing against those pieces sent sections flying up, which is where the barn's pieces went. A settled section checks for support every `FallingSection.HOLD_CHECK` (0.5 s) and wakes if nothing is within `HOLD_GAP` under it. Carving wakes rubble nearby (`BreakableStructure.wake_in`, `WAKE_CELLS`). `BreakablePiece.MIN_ISLAND_VOLUME` dropped from 0.05 to 0.006 m³. A split floor or ramp counts as grounded only if some wood still reaches the ground. New `tests/rubble_probe.gd` is in check.ps1."}, {"p": "**(Claude, 2026-10-26 20:24)** To do later: the step 122 playtest went well, but some bigger chunks seem to vanish too quickly when they come loose and hit the ground. They probably break into crumbs on landing, through the landing carve and the debris for islands under `MIN_ISLAND_VOLUME`. Ideas: break up less on landing, or keep larger lumps as pieces. Watch performance."}]}, {"id": "F-093", "kind": "feature", "title": "Weapon Range mode (unlimited ammo)", "status": "verify", "priority": "", "section": ["Modes"], "progress": "", "file": "", "needs": "Pick Weapon Range in the menu (try it on the Materials Yard). Fire rockets and everything else with no ammo limit and no waiting.", "related": "F-092, F-086", "added": "2026-10-26", "edited": "2026-10-26 16:13", "body": [{"p": "**(Claude, 2026-10-26 16:15)** Asked for in chat. Every gun and melee weapon from the start, ammo and grenades always full, reload and fire waits short. The match never ends."}]}], "changelog": [{"date": "2026-10-26", "time": "20:24", "title": "Note: big chunks break up a bit fast", "body": [{"p": "Playtest of step 122 (F-092): rubble now behaves well. Some bigger chunks seem to disappear too quickly when they come loose and hit the ground. Noted for later work, keeping performance in mind."}]}, {"date": "2026-10-26", "time": "19:31", "title": "Rubble no longer hangs in the air or vanishes", "body": [{"p": "Fixes from the step 121 playtest (F-092): bits of the brick house stuck in the air, and the barn's pieces disappearing after a rocket."}, {"ul": ["Falling sections carry their pieces properly now. Before, a carried piece could get pinned where it was while its section fell away, so it hung in the air.", "Falling sections no longer shove each other up into the sky. That is where the barn's \"vanished\" pieces went. They now bump into each other like normal solid things.", "Settled rubble checks every half second that something is still under it, and falls again if not.", "Only small crumbs turn into flying debris now. Bits up to about a fist (0.05 m³) used to be deleted, and now anything over 0.006 m³ stays as a real piece.", "The top of a ramp whose foot was blown off no longer counts as standing on the ground.", "New rubble test: rockets at the barn corner and through the townhouse. Nothing may hang, fly off, leave its section, or vanish in lumps."]}]}, {"date": "2026-10-26", "time": "18:46", "title": "Smoother frames when a building comes down", "body": [{"p": "As asked (F-092): the stutter when a big part of a building came loose was mostly the landings. Each section that hit the ground cracked its joints and carved what it hit all in that one frame, which cost up to 100 ms or more."}, {"ul": ["Landing cracks and carves now wait in the same queue as the other cracks, spread over a few frames. The dust and sound still come straight away.", "Cracks that land on the same wall in a frame are done together, so the wall is rebuilt once.", "Fewer splinters at once: at most 30 new ones a frame, and cracks from a collapse throw a light spray. Gun and melee hits keep the full spray.", "Wall and floor sections that fall no longer use the costly anti-tunnelling check. Only thin bits (under 15 cm) do.", "Faster mesh and collision rebuilds for carved walls.", "In the test, cutting every ground-floor wall at once: worst frame about 20-30 ms (was 115-314 ms), no frames over 33 ms (was about 25)."]}]}, {"date": "2026-10-26", "time": "18:10", "title": "Buildings give way at about half the support, and no more hanging in the air", "body": [{"p": "As asked (F-092), from your townhouse playtest:"}, {"ul": ["Every wall, post and floor now carries twice what it holds up when whole. Take away about half of what holds a part and it breaks at its thinnest line. Before it took about 90%.", "Walls get a line where they will break. Show stress draws a ring there and a % once a wall is above 60%.", "The part cut off falls in a few big sections. The stub below stays. Bits that come off a wall now count in the building, so the rest of the wall still holds up what it should.", "No more floating: a fallen section only freezes after it has been resting on something. A wall with nothing left at its foot no longer counts as standing on the ground.", "Less lag: new sections no longer shove their neighbours, and the cracks and drops are spread over a few frames (worst frame in the test about 30 ms, was about 60).", "Landings count from a smaller fall now, because walls come down onto their stubs.", "Checked: all tests pass. Please play the townhouse and the office with Show stress on."]}]}, {"date": "2026-10-26", "time": "16:58", "title": "Buildings snap off in sections, all stairs break, less lag", "body": [{"p": "As asked (F-092):"}, {"ul": ["Every staircase can be carved now (office, concrete block, barn, brick house).", "Buildings now have load and strength. Cut a wall and the weak line gives way: the part above breaks off as a few big sections, not loose tiles.", "A section that lands hard cracks where it hits and can knock into the floor below, so collapses can domino.", "Fallen parts stay where they lie (frozen, no cost), and wake up again if you shoot, blast or hit them.", "Less lag: a falling section is one body, tiny bits are dust, and only about 40 sections move at once.", "New pause-menu row on test maps: Show stress (green, amber, red joints).", "Checked: all tests pass, plus a new collapse speed test. Please wreck the townhouse with Show stress on."]}]}, {"date": "2026-10-26", "time": "16:15", "title": "Stairs you can break, buildings fall in pieces, Weapon Range", "body": [{"p": "As asked (F-092, F-093):"}, {"ul": ["The brick house stairs are carvable wood now, so the house falls when its walls are gone.", "Collapsing floors let go in waves, lowest first, and break into smaller pieces where they hit the ground.", "New mode Weapon Range: all weapons, unlimited ammo, no fire waits, no end. Good for testing maps.", "Checked: all tests pass. Please wreck the brick house and try Weapon Range on the Materials Yard."]}]}, {"date": "2026-10-26", "time": "15:55", "title": "Holes you can shoot through, collapsing buildings, bigger yard", "body": [{"p": "As asked (F-091, F-092):"}, {"ul": ["Holes in walls are now real: bullets and bodies pass through them (no more invisible wall).", "Buildings fall when their support is gone. Wreck the ground floor and the floors, walls and roof above come down. One hole does not.", "The Materials Yard is now 160 x 160 m with much bigger buildings: a 3-storey concrete block, a 2-storey office with glass front, a brick townhouse, a timber barn, two containers and a longer bridge. Ramps lead up inside.", "Picking up a weapon you already have now refills its ammo to the full reserve (the Hammerhead gave 1 rocket before).", "Checked: all tests pass. Please try shooting through holes and blasting the ground floors."]}]}, {"date": "2026-10-26", "time": "15:10", "title": "Materials Yard and a city plan", "body": [{"p": "As asked (F-091, F-092, F-073):"}, {"ul": ["New test map \"Materials Yard\": a shed, brick cottage, concrete bunker, metal container with a plank bridge, and an office corner. Each breaks its own way.", "New materials: brick, concrete, sheet metal, glass, drywall, plastic, planks, steel.", "Frames stand, walls and glass break, the shed falls flat.", "City map plan written (PLANS/CITY_MAP.md): about 200 x 200 m, nine districts, build phases.", "Checked: all tests pass. Please try each building with each weapon."]}]}, {"date": "2026-10-26", "time": "13:15", "title": "Wood strips in spiky patches", "body": [{"p": "From your playtest (F-085): the stripped wood round a hit was a neat square. Now the bark comes off in a spiky, splintery star that runs along the grain."}, {"ul": ["A pistol bullet strips a small ragged patch round the hole; the sledge and heavy hits strip bigger ones.", "A rocket or grenade strips a lot, in several patches round the broken parts; torn ends fray too.", "Checked: destruction and tower tests pass. Please look at it in the Tower Sandbox."]}]}, {"date": "2026-10-26", "time": "12:30", "title": "Wood is made of cells now", "body": [{"p": "From your playtest (F-085): the damage was too basic. Wood in the Tower Sandbox is now a grid of small cells (F-090)."}, {"ul": ["Bullets chip tiny pits, the sledge knocks out rough lumps, the chainsaw cuts one flat slice, a rocket tears a ball out.", "Every break looks different and the ends are ragged.", "Joints go floppy as the wood at them gets eaten away.", "This is the base for concrete, metal and plastic later.", "Checked: all tests pass. Hit counts vary on purpose (sledge a few, Longsight 6-13, Kestrel 40-200, one rocket severs a leg)."]}]}, {"date": "2026-10-26", "time": "12:00", "title": "Bullet marks are flat now", "body": [{"p": "From your playtest (F-085): the pock marks looked like little cubes stuck in the wood. They are now thin flat patches of bare wood lying on the log's surface."}]}, {"date": "2026-10-26", "time": "11:30", "title": "Wood breaks differently for each weapon", "body": [{"p": "As planned (F-085, Tower Sandbox):"}, {"ul": ["Bullets and blades leave small pock marks where they hit.", "The sledge bites a chunk off one side of the log, and the final break is wide and ragged with big chunks.", "The chainsaw cuts one slot straight across and the log parts exactly there, with only sawdust.", "Rockets work as before. How many hits it takes to snap a leg hasn't changed."]}]}, {"date": "2026-10-24", "time": "15:37", "title": "Will's new ideas sorted", "body": [{"p": "Two new ideas from Will, now in the feature list and moved into their sections of the boys' notes:"}, {"ul": ["F-087 Overgrown map (Maps).", "F-088 Supply Raid: each team has 20 lives, take the other team to 0. Plus a map and mode rotation (Game modes).", "F-089 Vehicles that crumple and break in crashes, like BeamNG.drive (Big ideas for later, under a new Physics / Vehicles heading in the notes)."]}]}, {"date": "2026-10-24", "time": "15:03", "title": "Towers no longer rebuild by themselves", "body": [{"p": "As asked (F-019, F-086): the 20 s rebuild timer is gone. A fallen tower stays down until you pick \"Reset environment\" in the pause menu."}]}, {"date": "2026-10-24", "time": "14:33", "title": "Tower Sandbox: bigger, four towers, Reset environment", "body": [{"p": "As asked (F-019, F-086): the Tower Sandbox is now a testing map for more than towers."}, {"ul": ["It's four times the size (100 m across) with four breakable sniper towers, one near each corner.", "Pause menu, on this map only: \"Reset environment\". It stands every tower back up, clears the wood chips and brings every pickup back. Players stay where they are.", "Fixed: bots had no floor to walk on in the sandbox, so they couldn't find a path anywhere."]}]}, {"date": "2026-10-24", "time": "14:10", "title": "Tower a bit sturdier, wood breaking planned", "body": [{"p": "From your playtest (F-019, F-085):"}, {"ul": ["The tower joints are stiffer again. Knocking out a leg on the side away from the ladder still brings it down. On the ladder side the ladder props that corner up, so it can stand on three legs and need a second leg taking out.", "Planned for later: wood that breaks the way each weapon would break it. Bullets chip it, the sledge splinters off random chunks, and the chainsaw cuts straight through."]}]}, {"date": "2026-10-24", "time": "13:06", "title": "Tower: stiffer joints, wood chips, ladder bug fixed", "body": [{"p": "From your playtest of the Tower Sandbox (F-019, F-084):"}, {"ul": ["Stiffer joints: the joints now spring back when bent instead of hanging loose, so the parts that weren't hit keep their shape. Thin braces are much weaker than the thick legs. One lost leg still brings it down.", "Wood chips: shots, swings and blasts knock chips off wood, and heavy hits and blasts throw real chunks. A snapped log bursts into chunks. Worn legs get visibly thinner and paler where they've been hit.", "Chips never hold up or push the tower (they used to be able to wedge under a leg).", "Fixed: after the tower fell, getting on the fallen ladder could fling you away and let you climb an invisible ladder. A ladder that's tipped over or gone can't be climbed now, and you drop off one that falls under you.", "The sandbox floor is now solid, so thin pieces can't sink through it."]}]}, {"date": "2026-10-24", "time": "12:24", "title": "Breakable tower prototype in a sandbox map", "body": [{"p": "As asked: a first go at a tower that falls with real physics (F-019), in its own test map. The normal maps still have the solid tower."}, {"ul": ["Pick \"Tower Sandbox\" in the map list. One tower, plus rockets, a sniper rifle, grenades, the chainsaw, sledge, spear and nightstick lying around.", "The tower is 11 separate pieces: 4 legs, 4 cross braces, the deck, the roof and the ladder, held together by 15 joints.", "Wear a leg (or brace) through and it snaps in two. From then on only gravity, the joints and your hits move anything. Joints that get bent or pulled too far break.", "Which way it goes isn't chosen by the game. In the headless test, knocking out different legs sent it different ways.", "The game now uses the Jolt physics engine (steadier for piles of joined pieces). All the usual checks pass with it.", "Not in yet: falling pieces don't hurt anyone, no creak or crash sounds, bots don't know about it."]}]}, {"date": "2026-10-24", "time": "11:53", "title": "Sniper tower is solid again, falling to be redone", "body": [{"p": "As asked: all the sniper tower destruction is taken out (F-019). The falls were never real gravity: the script chose which way it went and pushed it there."}, {"ul": ["The tower is a plain solid structure again. Shots and blasts don't hurt it.", "Gone: leg wear, holes, wood chips, the fall, the rebuild, and the tower sounds and probes.", "Research on how to do it properly is in PLANS/Research/tower-physics.md. The short version: build it from separate pieces held by joints that can snap, and let gravity do the rest.", "Wood vs concrete (F-084) stays, ready for when breakable things come back."]}]}, {"date": "2026-10-24", "time": "11:45", "title": "Tower falls are real physics again", "body": [{"p": "Fix for sniper towers falling like the old scripted tilt (F-019)."}, {"ul": ["The last fix held the tower on a stiff hinge: it stopped any turning every frame, glued the feet to the floor and started the tip too gently. That's what made it look like the first, scripted fall. All three are gone.", "Now it's just gravity: the corner that lost its leg drops, the tower lurches and falls about twice as fast, and its feet can skid. Shot legs still fall straight toward the lost leg.", "A rocket from the side can turn it a little as the feet skid, like a real shove."]}]}, {"date": "2026-10-24", "time": "11:37", "title": "Chainsaws cut wood", "body": [{"p": "Weapons now matter against what things are made of (F-084)."}, {"ul": ["The chainsaw cuts a sniper tower leg through in about half a second.", "The sledge hits wood twice as hard as before, so it does far more than the spear or nightstick. Two good swings snap a leg.", "Rockets and grenades bite wood harder too.", "Wood is now a material. Concrete is set up for later: it will shrug off blasts and saws but crack under the sledge."]}]}, {"date": "2026-10-24", "time": "11:31", "title": "Towers fall like real towers", "body": [{"p": "Fix for sniper towers twisting as they fell (F-019)."}, {"ul": ["A tower now tips over the legs it has left, toward the side that lost its support. No more spinning round.", "Guns and melee only wear a leg down. A rocket or grenade that lands close snaps the leg in one go and gives the tower a small shove.", "How far it gets shoved depends on how heavy it is, and its weight comes from its size. Bigger structures added later will move less.", "The ladder no longer props the tower up when a back leg goes."]}]}, {"date": "2026-10-24", "time": "11:11", "title": "Towers fall differently every time", "body": [{"p": "Fix for sniper towers falling on a set path (F-019)."}, {"ul": ["The physics was always on, in every mode. But each tower got the exact same nudge toward its broken leg, so it fell along the same arc every time. It only looked like real physics when a rocket hit it mid-fall, which is why Quake Arena seemed different.", "Now the hit that breaks the leg pushes the tower. Shoot it from the side and it twists, blow it up and it gets kicked.", "Every fall has a bit of chance in it, and the tower tips over faster at the start."]}]}, {"date": "2026-10-23", "time": "13:29", "title": "A watch house to hide and shoot from", "body": [{"p": "More hiding spots, weapon spots and windows to shoot from on Test Map 1 (F-018)."}, {"ul": ["A two-storey house on the empty east side, its front door facing the middle.", "Slit windows on both floors, so you can shoot out while staying hard to hit.", "A ladder goes up through a hatch to the top floor, where a Kestrel sits.", "Downstairs there's a cupboard with a door. Shut it and you're hidden. There's health inside.", "Bots can get in and find the cupboard. They can't climb the ladder yet."]}]}, {"date": "2026-10-23", "time": "13:23", "title": "A changelog you can skim", "body": [{"p": "From Ideas.md (F-081)."}, {"ul": ["Each update in the Changelog now folds down to its title. Click one to read it. The newest is open.", "A By date / By section switch sits at the top. By section groups what changed under Movement, Weapons, Maps and the rest, so you can open the area you care about.", "Search still filters it and opens everything that matches."]}]}, {"date": "2026-10-23", "time": "13:21", "title": "No more flashing ladders and bridges", "body": [{"p": "From Ideas.md (X-003)."}, {"ul": ["Ladders: the wooden back board was sat exactly on the wall, so the two kept swapping which one showed. It now stands 2 cm out from the wall.", "Bridges: where the bridge ends run into the corner decks and the spire, both floors were at exactly the same height. The bridges are 1 cm lower now, so the deck floor shows. You won't feel the step."]}]}, {"date": "2026-10-23", "time": "13:19", "title": "New ideas sorted", "body": [{"p": "The six new ideas in Ideas.md are in their sections now, and on this list."}, {"ul": ["New section in Ideas.md: Meeting for the boyz, for ideas we talk through together first. Everyone designing their own character is the first one (F-083).", "Grapple hook (F-080), the ladder and bridge flicker (X-003), a changelog you can skim by section (F-081) and a cheaper way of building with Claude (F-082).", "The stick-man idea was already being built: that's F-078."]}]}, {"date": "2026-10-23", "time": "13:11", "title": "Guns in hand, a proper one-handed aim", "body": [{"p": "From your playtest notes."}, {"ul": ["Other players now see the weapon in your stick man's right hand (F-078). It points where you're aiming, and hangs in the hand while you climb, roll or hang on with both hands. The werewolf's claws stay empty-handed.", "Hanging and aiming (F-026): the arm goes out straight and points right at what your reticle is on, and the chest turns round towards it."]}]}, {"date": "2026-10-23", "time": "13:05", "title": "Ledge grab on Square, shoot while hanging", "body": [{"p": "From your notes on the ledge hang (F-026)."}, {"ul": ["Grab is on Square now (R on keyboard), not crouch. Hold it in the air and you grab any ledge you're looking at as you reach it.", "Any ledge you can see: one up ahead within reach, or the edge you're stood on. Look down over a drop and press Square to swing down and hang off it.", "Shimmy is faster (2.2 m/s, was 1.4).", "Hang still and the gun hand lets go: aim and shoot one-handed. Shimmying, both hands are on the edge and you can't shoot.", "Square with no ledge in view still reloads."]}]}, {"date": "2026-10-23", "time": "12:52", "title": "Hang off ledges and pull people down", "body": [{"p": "Uncharted 3 style (F-026). Built how U3 did it as far as we know: tell me if Will remembers it differently."}, {"ul": ["Hold crouch while you jump at a ledge and you grab the edge and hang there instead of climbing up.", "Move the stick left / right to shimmy along the edge. You stop at the end of it.", "Jump pulls you up onto the top. Crouch lets go and you drop.", "No shooting while hanging. But if an enemy stands right at the edge above you, \"FIRE: PULL ... DOWN\" shows: press fire to yank them over the edge, which kills them."]}]}, {"date": "2026-10-23", "time": "12:40", "title": "Sliding on the floor, a proper ledge pull-up", "body": [{"p": "From your playtest videos."}, {"ul": ["Slide (F-078): the stick man drops right down onto the floor, hip low and lead leg out, instead of floating. Look around while sliding and the chest twists round to point the gun where you aim, while the legs keep going the way you slide.", "Ledge climb (F-067): both hands grab the edge and stay on it while you haul yourself up. Your feet scrabble up the wall, then you crouch over the top with a knee up and stand. The rise is smooth now (no jerk at the start), and it takes 0.6 s instead of 0.45 s so you can see it."]}]}, {"date": "2026-10-23", "time": "12:15", "title": "Third-person camera", "body": [{"ul": ["Tap Select (the button left of Start; Tab on keyboard) to swap between first and third person, so you can watch your stick man run, slide and climb. Hold it for the scoreboard, as before. The camera sits over your right shoulder and keeps out of walls."]}]}, {"date": "2026-10-23", "time": "12:12", "title": "Fix: stick men's shoulders and hips", "body": [{"ul": ["The shoulder and hip bars stuck out to one side of the body, so the left arm and leg hung off thin air. Both bars are now centred, with the arms and legs on their ends."]}]}, {"date": "2026-10-23", "time": "12:05", "title": "Fix: test runs filling the disk", "body": [{"ul": ["A test run that got stuck while closing kept writing the same error to Godot's log, gigabytes a minute, which pinned the SSD at 100%. The game no longer ticks once its mode has closed, so this can't happen again."]}]}, {"date": "2026-10-23", "time": "11:55", "title": "Stick-man bodies, faster falling parts, pads for NPCs", "body": [{"p": "Changes from your playtest notes."}, {"ul": ["Stick-man bodies (F-078): the bean is gone. Players, bots, ghouls and the bumming guy are now jointed stick men in their colour. They walk and run with real steps, crouch with bent knees, tuck their legs in the air, slide, roll, climb ladders, put a hand on the wall when wall-running and reach up when climbing ledges. They hold their gun up and aim it up and down with you. Ghouls hunch and reach out; the bumming guy swings his arms.", "Bodies falling apart (F-057): the stick man now falls apart limb by limb, right where it stood. There's no switch to blocks. The pieces also fall at proper speed now; before they were using half the game's gravity.", "Jump pads (F-058): ghouls and the bumming guy now get thrown by pads too.", "Ghouls leap up at you if you stand on something just above them. One stuck behind a wall now pops back in somewhere it can see you."]}]}, {"date": "2026-10-23", "time": "11:14", "title": "Bodies fly apart, and a Survival mode", "body": [{"p": "Two more of the boys' ideas, ready to try."}, {"ul": ["Bodies blown apart (F-057): when someone dies, the body falls apart into head, chest, arms and legs. A big hit (a rocket, a sniper shot) throws the pieces and some gore around. The pieces fade after a few seconds.", "Survival (F-021): a new co-op mode. Everyone is on the same side against waves of ghouls, and each wave is bigger and faster. If you die you are out until the wave is cleared, then everyone comes back. If everyone goes down, you are overrun. Pick how many waves in Mission setup (10 to start). Bots help fight."]}]}, {"date": "2026-10-23", "time": "10:58", "title": "Quake Arena mode and pick a class", "body": [{"p": "Two more of the boys' ideas, both ready to try."}, {"ul": ["Quake Arena (F-023): a new mode in Mission setup. Everyone spawns with the rifle, sniper and rocket launcher, full ammo. No pickups. You run faster, your own rockets barely hurt you and throw you higher, and every kill gives 50 health back.", "Create a class (F-025): in the agent lobby, press up / down to pick what you spawn with in Deathmatch and Team Deathmatch: Standard, Assault (rifle), Marksman (sniper), Demolition (rockets), Brawler (sledge) or Grenadier (extra grenades)."]}]}, {"date": "2026-10-23", "time": "10:49", "title": "Only people call the bumming guy", "body": [{"p": "Bots' missed shots no longer count, so easy bots don't fill the map with bumming guys (F-005). He still only comes for real players who miss too much."}]}, {"date": "2026-10-23", "time": "09:10", "title": "The bumming guy", "body": [{"p": "Miss too many shots and someone comes for you (F-005). In Deathmatch and Team Deathmatch:"}, {"ul": ["Miss 10-15 shots in a row (bullets or rockets that hit nobody) and an alarm goes off. A big dark red guy turns up some way off and runs at you.", "If he catches you, he bounces you in front of him for 5 s. You can't move, but you can't be hurt either. Mash jump to break free sooner.", "He takes a lot of damage to put down. Down him while he holds someone and they go free. He gives up after 45 s.", "Turn him off in Mission setup (\"Bumming guy\"). Bots run from him too."]}]}, {"date": "2026-10-23", "time": "08:53", "title": "The bummer bounces you before you're caught", "body": [{"p": "In Be the Bummer, a swipe now grabs a hider from behind instead of catching them straight away (F-077)."}, {"ul": ["The bummer holds them right in front of him and bounces them up and down for 3 seconds, with a boing on every bounce. Then they're caught.", "Neither of them can move while it happens. Knock the bummer out in time and your friend goes free."]}]}, {"date": "2026-10-23", "time": "08:46", "title": "New game mode: Be the Bummer", "body": [{"p": "One player is the bummer and hunts the rest (F-077). Pick it in Mission setup."}, {"ul": ["The bummer is dark red with claws and catches in one swipe. He waits 5 s with a black screen while everyone hides.", "Caught players are out until the next round. Players still free when time runs out score 2 points. Knocking the bummer out scores 1.", "Everyone gets one turn as the bummer, then the match ends. The most points wins.", "Bots run from the bummer, or hunt when they are the bummer."]}]}, {"date": "2026-10-23", "time": "00:58", "title": "Werewolf change, jaw view, VALUES folder", "body": [{"ul": ["Turning into the werewolf now takes a moment: the camera circles you while you grow and go furry. You can't be hurt while it happens (F-008).", "As the werewolf you see out through its jaws, with teeth at the top and bottom of the screen that sway as you run. Two clawed paws in view.", "Everyone hears the howl now. Put a recording at `sounds\\howl.mp3` to replace it. A whoosh rises 4 s before you change back.", "Melee hits connect better when you're right next to someone. A new `show_hitboxes` switch shows what melee aims at (F-075).", "New VALUES folder: every tuning number in a few tables, each with a link to where you change it (F-074).", "New ideas on the list: humanoid players with parkour (F-076), and the \"Be the bummer\" game mode (F-077)."]}]}, {"date": "2026-10-23", "time": "00:32", "title": "Ability icon and a charged werewolf pounce", "body": [{"ul": ["Melee weapons now have a small ability icon above the weapon name, with a different picture for each one. It goes dark grey when used and the colour fills back in as it recharges (F-071).", "Werewolf pounce: hold aim to charge it for up to 5 seconds. A full charge jumps about 7.5 m high."]}]}, {"date": "2026-10-23", "time": "00:17", "title": "Melee weapons get abilities", "body": [{"p": "Every melee weapon has a special move now on the aim button (LT / right mouse) (F-071)."}, {"ul": ["Knife: throw it. It kills up close, then lies on the floor until you pick it back up.", "Spear: lunge 4 m with a thrust. Sledge: slam the ground to knock everyone near you flying and dazed.", "Shield: hold aim to raise it and bounce rockets back. Chainsaw: hold aim to rev and run faster.", "Nightstick: a stun hit that freezes their aim and trigger for a moment. Werewolf claws: pounce."]}]}, {"date": "2026-10-23", "time": "00:06", "title": "Ledge climbing", "body": [{"p": "You can climb up onto ledges now (F-067). Jump at a wall or crate with the stick held forward and you pull yourself up onto the top."}, {"ul": ["Anything up to about 3.5 m high from a running jump, as long as there's room to stand on top.", "You rise, roll over the edge and keep running. It's first person only for now: proper climbing moves for other players to see come with proper player models."]}, {"p": "The new slides and wall runs are signed off as done (F-068, F-069, F-070, F-027)."}]}, {"date": "2026-10-22", "time": "23:54", "title": "Smarter slides and longer wall runs", "body": [{"p": "Slides now reward speed and stop rewarding spam."}, {"ul": ["Slide straight after another slide and it goes 25% less far each time. Wait 1.5 s and it's a full slide again (F-068).", "The slide starts at the speed you're going. Hit slide just as you land a jump and you shoot off faster and further (F-069).", "Crouching in mid-air no longer slows you down."]}, {"p": "Wall runs last as long as you keep your speed (F-070). You slow down bit by bit, then start to slip down the wall and drop off. Come in fast and you can run a long way."}]}, {"date": "2026-10-22", "time": "23:38", "title": "New melee swings, splintering towers, new ideas filed", "body": [{"p": "Melee weapons swing properly now (F-020, F-072)."}, {"ul": ["Each one moves its own way: the Nightstick chops down, the knife slashes, the spear and shield jab forward, the sledge winds up high and smashes down.", "The hit lands right when the swing does, with a soft whoosh instead of the scratchy sound."]}, {"p": "The sniper towers break apart like in Red Faction (F-019)."}, {"ul": ["Every shot punches a hole in the wooden legs and sends wood chips flying.", "A leg snaps where you hit it most and leaves a splintered stump. The tower then tips over toward the missing leg under real physics.", "Melee swings chip the wood too. A fallen tower is solid cover."]}, {"p": "New ideas from the boys are on the list: ledge climbing (F-067), no slide spamming (F-068), momentum slides (F-069), longer wall runs while you're fast (F-070), melee abilities (F-071), screen tricks in split screen (F-066) and a city level full of things to break (F-073)."}]}, {"date": "2026-10-22", "time": "20:59", "title": "Sniper towers come down", "body": [{"p": "You can now knock down the sniper towers on Test Map 1 (F-019)."}, {"ul": ["Shoot the legs or hit them with rockets and grenades. They get thinner and scorched, and the tower starts to lean.", "When a leg breaks the tower falls over and crushes anyone under it or on it.", "It stands back up after 45 seconds."]}]}, {"date": "2026-10-22", "time": "20:55", "title": "Killstreaks and the werewolf", "body": [{"p": "Get kills without dying to earn rewards (F-037)."}, {"ul": ["3 kills in a row: radar for 30 seconds. Your mini-map zooms out and shows everyone.", "5 kills in a row: you become the werewolf for 30 seconds (F-008). Bigger, furry, red eyes, claws only, faster and tougher. Everyone gets warned.", "You can switch killstreaks off on the match setup page."]}]}, {"date": "2026-10-22", "time": "20:50", "title": "Toilets, doors and a vent", "body": [{"p": "A toilet block on Test Map 1 (F-013): three cubicles with doors that swing open when you walk into them and shut behind you, so you can hide. Shut doors stop bullets."}, {"ul": ["A vent to crawl through (F-014): crouch or slide in from behind the block and come out in a toilet.", "Small windows in the end cubicle to shoot out of (F-018)."]}]}, {"date": "2026-10-22", "time": "20:32", "title": "Cleaner screen", "body": [{"p": "Less text on screen during a match (F-065)."}, {"ul": ["No more \"press A to join\" line at the bottom. Everyone joins in the lobby.", "The P1 name only shows in split screen. Ammo is just the gun and the numbers; grenades only show when you have some.", "Shorter pickup messages, and the lobby's empty slots no longer blink."]}]}, {"date": "2026-10-22", "time": "20:27", "title": "New health ring with a mini-map", "body": [{"p": "The health and armour circle has a new look (F-048), inspired by Nightfire."}, {"ul": ["Bigger, thinner rings made of small glowing segments. Health is red-orange and pulses when low; armour is blue.", "Inside the rings is now a mini-map (F-064) instead of the health number. It turns as you turn.", "Other players and bots show as dots: faint when far away, brighter as they get close."]}]}, {"date": "2026-10-22", "time": "20:17", "title": "Quieter footsteps", "body": [{"p": "Footsteps, wall-run steps, slides, rolls and backsteps are quieter now (F-054)."}]}, {"date": "2026-10-22", "time": "20:13", "title": "Movement sounds", "body": [{"p": "Every move now makes a sound (F-054)."}, {"ul": ["Footsteps when you run, quieter when crouched. You can hear other players walking near you.", "Jumps, landings (a hard fall lands louder), slides, rolls and backsteps, crouching and standing up.", "Wall runs, wall jumps and climbing ladders."]}]}, {"date": "2026-10-22", "time": "20:05", "title": "Boot intro, lobby, teams and weapon sets", "body": [{"p": "The game now boots like a proper console game, in a Nightfire-style look with our own names (F-062)."}, {"ul": ["A short intro types out on a \"secure terminal\" and the NIGHTSHIFT logo decodes. Any button skips it, and Options can turn it off.", "Then PRESS START and the Command Centre menu: Multiplayer, Options, Controls, Quit.", "Mission setup: pick the mode, the map and what weapons spawn (F-061: snipers only, melee only, random and more).", "New mode, Team Deathmatch (F-060): Blue against Red, with a friendly fire setting.", "Agent lobby (F-063): everyone joins with their own pad, picks a team and readies up. Add or remove bots there. The match starts after a 3 s countdown."]}]}, {"date": "2026-10-22", "time": "19:21", "title": "Jump pads go your way", "body": [{"p": "Jump pads (F-058) now bounce you up and onward the way you're running, from any side. Stand still on one and it sends you the way you face."}, {"ul": ["Test Map 2: the side pads moved into the catwalk gaps against the wall. Bounce left or right along the wall onto a catwalk, or out into the middle.", "The pad by the spire top pushes you only a little, so you land on the small top."]}]}, {"date": "2026-10-22", "time": "19:13", "title": "Main menu, Test Map 2, One in the Chamber", "body": [{"p": "The game now starts on a main menu where you pick the mode and the map (F-010)."}, {"ul": ["New map, Test Map 2 (F-059): a tall arena with corner decks, catwalks, bridges and a spire in the middle. The old map is now Test Map 1.", "Jump pads (F-058) throw you up onto ledges. Wall run across the gaps in the catwalks.", "New mode, One in the Chamber (F-028): one bullet, every hit kills, a kill gives you a bullet back. 3 lives each, last one standing wins.", "\"Main menu\" in the pause menu goes back to the menu."]}]}, {"date": "2026-10-22", "time": "18:35", "title": "Wall running", "body": [{"p": "You can now run along walls (F-027)."}, {"ul": ["While running, jump at a wall from the side and keep holding forward. You run along it for about 1.4 s.", "Press jump to leap off it. You can jump across to another wall and keep going.", "Let go of forward or press crouch to drop off. You can still shoot while on the wall."]}]}, {"date": "2026-10-22", "time": "18:28", "title": "Melee weapons", "body": [{"p": "Five new melee weapons to pick up (F-020): knife, spear, sledge, chainsaw and shield. Switch to them with Y / RB like the Nightstick."}, {"ul": ["Knife is quick but short. Spear reaches far but is narrow. Sledge is slow and kills in one hit.", "Chainsaw: hold RT to keep cutting.", "Shield: hold it and hits from in front only do a fifth of the damage. RT bashes with it."]}]}, {"date": "2026-10-22", "time": "18:22", "title": "Sticky grenades", "body": [{"p": "Sticky grenades have their own button: D-pad up on a controller, F on the keyboard (F-056)."}, {"ul": ["Press once to throw. It sticks to whatever it hits, walls, floors or people. Press again to set it off.", "Only one can be out at a time. You start with 1 and can carry 3. STICKY boxes on the east and west crates give 2 more.", "Stuck on someone, it goes wherever they go and they see \"STICKY ON YOU!\". If you die before setting it off, it fizzles.", "The boys' new ideas are filed: stickies (F-056) and Joel's bodies blown apart (F-057, waits for real player models)."]}]}, {"date": "2026-10-22", "time": "17:52", "title": "Proper bots", "body": [{"p": "Bots now play properly instead of wandering (F-053)."}, {"ul": ["They go for pickups they need, chase you when they see you, and shoot with the right gun for the distance.", "Shoot one from behind and it turns round.", "Pick Easy, Medium or Hard in Match setup. Hard bots react faster, aim better and dodge.", "They don't throw grenades or climb ladders yet."]}]}, {"date": "2026-10-22", "time": "17:39", "title": "Aim assist dropped", "body": [{"p": "Aim assist (F-051) is off the list. Nobody asked for it, so it won't be built."}]}, {"date": "2026-10-22", "time": "17:35", "title": "Pause menu, settings and sound", "body": [{"p": "The game has a pause menu, saved settings and sound effects (F-054)."}, {"ul": ["Start / Esc pauses and opens the menu: look sensitivity, invert look, crouch toggle or hold, volume.", "Match setup: kill limit, time limit and bots for the next match.", "Sounds for every gun, the Nightstick, grenades, explosions, pickups, hits and the end of a match. The game makes them itself."]}]}, {"date": "2026-10-22", "time": "17:18", "title": "Changelog on the feature list", "body": [{"p": "This page now has a devblog. Pick \"Changelog\" under \"All sections\" on the left to read what changed and when."}]}, {"date": "2026-10-22", "time": "17:06", "title": "Frag grenades", "body": [{"p": "Grenades have their own button: LB on a controller, G on the keyboard (F-017)."}, {"ul": ["You start with 2 and can carry 4. FRAGS boxes behind the north and south cover walls give 2 more.", "They bounce, blink red, and go off 2.5 s after the throw. The blast does up to 100 damage within 5 m.", "Your own grenade hurts you half as much. Rockets now share the same explosion code."]}]}, {"date": "2026-10-22", "time": "17:02", "title": "Nightstick", "body": [{"p": "Everyone always carries a Nightstick for melee (F-055). Switch to it with Y / RB. Swing with RT."}, {"ul": ["50 damage, so two hits kill. Each hit knocks the target back.", "Short reach. You have to be facing your target."]}]}, {"date": "2026-10-22", "time": "16:58", "title": "Deathmatch rules", "body": [{"p": "Matches are now proper deathmatches (F-052)."}, {"ul": ["Kills score points. The match ends at the kill limit or the time limit.", "Spawn protection after respawning, plus a scoreboard (Back / Tab) and an end screen with the winner."]}]}, {"date": "2026-10-22", "time": "16:38", "title": "Longer slide, health kits, starry sky", "body": [{"ul": ["The slide lasts longer and travels further (X-001). The boys tested it and passed it.", "Health kits on the map heal you (F-050).", "The night sky now has stars (F-007)."]}]}, {"date": "2026-10-22", "time": "13:43", "title": "One-click build and feature list", "body": [{"ul": ["One-click Windows build, and one-click publishing of this page.", "The feature list got a folding sidebar and clearer section names."]}]}, {"date": "2026-10-22", "time": "12:59", "title": "Plans folder", "body": [{"p": "Progress notes, the plan, the ideas board and the boys' notes now live together in the PLANS folder."}]}, {"date": "2026-10-21", "time": "23:31", "title": "Damage, death and respawn", "body": [{"ul": ["Players can now be hurt and die, then respawn (F-047).", "Health ring and armour vests (F-048).", "New Kestrel assault rifle (F-049) and a bigger 80 m test map."]}]}, {"date": "2026-10-21", "time": "22:43", "title": "First weapons", "body": [{"ul": ["Pocket 9 starting pistol.", "Hammerhead and Longsight weapon pickups, plus ammo boxes (F-002)."]}]}, {"date": "2026-10-21", "time": "22:20", "title": "Movement extras and night props", "body": [{"ul": ["Tap jump for a small jump, hold jump for a big one (F-003).", "Slide (F-001), roll (F-004) and ladders.", "A hut to camp in and a sniper tower (F-006)."]}]}, {"date": "2026-10-21", "time": "21:16", "title": "First playable build", "body": [{"p": "Nightshift starts: the project skeleton, controller and keyboard input, basic movement and a test room."}]}]};
const $ = id => document.getElementById(id);
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const state = {kind:"all", status:"", need:false, hideDone:store.get("ns.hideDone")==="1", q:"", secQ:"",
  section:store.get("ns.section")||"", sort:store.get("ns.sort")||"section", view:store.get("ns.view")==="log" ? "log" : "list"};
const LOG = DATA.changelog || [];
if(!["section","recent","oldest"].includes(state.sort)) state.sort = "section";
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const inline = s => esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
const cssStatus = s => "var(--s-" + s.replace(/ /g,"-") + ")";
const label = s => s.charAt(0).toUpperCase() + s.slice(1);
const SEP = " > ";
const pathOf = it => it.section.join(SEP);
const fileHref = f => "../" + f.replace(/\\/g,"/").split("/").map(encodeURIComponent).join("/");

// section tree, in the order sections first appear in FEATURES.md
const root = {name:"", path:"", kids:[], items:[]};
for(const it of DATA.items){
  let node = root;
  it.section.forEach((name, i) => {
    const path = it.section.slice(0, i+1).join(SEP);
    let k = node.kids.find(c => c.path === path);
    if(!k){ k = {name, path, kids:[], items:[], depth:i+1}; node.kids.push(k); }
    node = k;
  });
  node.items.push(it);
}
const allNodes = []; (function walk(n){ for(const k of n.kids){ allNodes.push(k); walk(k); } })(root);
if(state.section && !allNodes.some(n => n.path === state.section)) state.section = "";

function matches(it, opt){
  opt = opt || {};
  if(state.kind !== "all" && it.kind !== state.kind) return false;
  if(state.kind === "fix" && (it.status === "done" || it.status === "pass")) return false;   // finished fixes no longer need fixing
  if(!opt.ignoreStatus && state.status && it.status !== state.status) return false;
  if(state.hideDone && (it.status === "done" || it.status === "pass")) return false;
  if(state.need && !it.needs) return false;
  if(!opt.ignoreSection && state.section){
    const p = pathOf(it);
    if(p !== state.section && !p.startsWith(state.section + SEP)) return false;
  }
  if(state.q && !hay(it).includes(state.q)) return false;
  if(state.secQ && !hay(it).includes(state.secQ)) return false;
  return true;
}
const hay = it => it._hay || (it._hay = [it.id,it.title,it.status,pathOf(it),it.file,it.needs,it.related,
  it.body.map(b => b.p || b.ul.join(" ")).join(" ")].join(" ").toLowerCase());
const subtreeItems = n => n.items.concat(...n.kids.map(subtreeItems));

// folding sidebar: which sections show their subsections, and whether the list under "All sections" shows (both remembered)
const openSecs = new Set((() => { try { return JSON.parse(store.get("ns.openSecs") || "[]"); } catch(e) { return []; } })());
state.treeOpen = store.get("ns.treeOpen") !== "0";
const saveFold = () => { store.set("ns.openSecs", JSON.stringify([...openSecs])); store.set("ns.treeOpen", state.treeOpen ? "1" : "0"); };
// unfold the parents of a section so it can be seen in the sidebar
const openTo = p => { if(!p) return; state.treeOpen = true; const parts = p.split(SEP); for(let i = 1; i < parts.length; i++) openSecs.add(parts.slice(0, i).join(SEP)); };
openTo(state.section);

// "list" (the entries) or "log" (the changelog / devblog)
function setView(v){ state.view = v; store.set("ns.view", v); }
function setSection(p){ setView("list"); state.section = p; store.set("ns.section", p); openTo(p); saveFold(); render(); window.scrollTo({top:0}); }

function tree(){
  const box = $("tree"); box.innerHTML = "";
  const mk = (node, ul) => {
    const li = document.createElement("li");
    const row = document.createElement("div"); row.className = "trow";
    const b = document.createElement("button");
    const n = node === root ? DATA.items.filter(it => matches(it, {ignoreSection:true})).length
                            : subtreeItems(node).filter(it => matches(it, {ignoreSection:true})).length;
    // the sidebar filter hides sections with nothing that matches (the open section and "All sections" stay)
    if(state.secQ && !n && node !== root && state.section !== node.path) return;
    b.className = (node.depth === 1 ? "top" : "") + (state.view === "list" && state.section === node.path ? " on" : "") + (n ? "" : " dim");
    b.innerHTML = '<span class="nm">' + esc(node === root ? "All sections" : node.name) + '</span><span class="n">' + n + "</span>";
    b.onclick = () => setSection(node.path);
    // a filter in the sidebar unfolds everything so the matches show
    const isOpen = !!state.secQ || (node === root ? state.treeOpen : openSecs.has(node.path));
    if(node.kids.length){
      const t = document.createElement("button");
      t.className = "tog" + (isOpen ? " open" : "");
      t.innerHTML = "<span>&#9654;</span>";
      t.title = (isOpen ? "Hide " : "Show ") + (node === root ? "sections" : "subsections");
      t.setAttribute("aria-expanded", isOpen);
      t.onclick = () => {
        if(node === root) state.treeOpen = !isOpen;
        else if(isOpen) openSecs.delete(node.path); else openSecs.add(node.path);
        saveFold(); tree();
      };
      row.append(b, t);
    } else { row.appendChild(b); row.insertAdjacentHTML("beforeend", '<span class="tog"></span>'); }
    li.appendChild(row);
    if(node.kids.length && node !== root && isOpen){
      const sub = document.createElement("ul");
      for(const k of node.kids) mk(k, sub);
      li.appendChild(sub);
    }
    ul.appendChild(li);
  };
  mk(root, box);
  // the changelog sits right under "All sections"
  if(LOG.length){
    const li = document.createElement("li"); li.className = "logrow";
    li.innerHTML = '<div class="trow"><button class="top' + (state.view === "log" ? " on" : "") + '" title="What has been added and changed, newest first">' +
      '<span class="nm"><span class="ic">&#9998;</span> Changelog</span><span class="n">' + LOG.length + '</span></button><span class="tog"></span></div>';
    li.querySelector("button").onclick = () => { setView("log"); render(); window.scrollTo({top:0}); };
    box.appendChild(li);
  }
  if(state.treeOpen || state.secQ) for(const k of root.kids) mk(k, box);
}

function chips(){
  const box = $("statusChips"); box.innerHTML = "";
  const all = document.createElement("button");
  all.className = "chip" + (state.status ? "" : " on");
  all.innerHTML = "Any status";
  all.onclick = () => { state.status = ""; render(); };
  box.appendChild(all);
  for(const s of DATA.statuses){
    const n = DATA.items.filter(it => it.status === s && matches(it, {ignoreStatus:true})).length;
    if(!n && state.status !== s) continue;
    const b = document.createElement("button");
    b.className = "chip" + (state.status === s ? " on" : "");
    b.innerHTML = '<span class="dot" style="background:' + cssStatus(s) + '"></span>' + label(s) + '<span class="n">' + n + '</span>';
    b.onclick = () => { state.status = state.status === s ? "" : s; render(); };
    box.appendChild(b);
  }
}

function itemEl(it){
  const d = document.createElement("details");
  d.className = "item"; d.id = it.id;
  let badges = "";
  if(it.progress) badges += '<span class="pct" title="Completion">' + esc(it.progress) + '%<i><b style="width:' + Math.min(100, +it.progress || 0) + '%"></b></i></span>';
  if(it.kind === "fix" && it.status !== "done" && it.status !== "pass") badges += '<span class="badge fix">fix</span>';
  badges += '<span class="badge" style="color:' + cssStatus(it.status) + '">' + esc(it.status) + '</span>';
  if(it.priority) badges += '<span class="badge pri ' + esc(it.priority) + '">' + esc(it.priority) + '</span>';
  if(it.needs) badges += '<span class="badge needs">waiting on you</span>';
  if(state.sort !== "section") badges += '<span class="when" title="Last changed">' + esc(it.edited ? (it.edited.split(" ")[1] ? it.edited.split(" ")[1] + " GMT" : it.edited) : "no date") + "</span>";
  let body = "";
  for(const b of it.body){
    if(b.p) body += "<p>" + inline(b.p) + "</p>";
    else body += "<ul>" + b.ul.map(x => "<li>" + inline(x) + "</li>").join("") + "</ul>";
  }
  let meta = "";
  if(it.needs) meta += '<dt>Waiting on</dt><dd class="need">' + inline(it.needs) + "</dd>";
  if(it.file) meta += '<dt>File</dt><dd><a href="' + fileHref(it.file) + '" target="_blank">' + esc(it.file) + "</a></dd>";
  if(it.related) meta += "<dt>Related</dt><dd>" + inline(it.related) + "</dd>";
  meta += "<dt>Section</dt><dd>" + esc(it.section.join(" › ")) + "</dd>";
  if(it.added) meta += "<dt>Added</dt><dd>" + esc(it.added) + "</dd>";
  if(it.edited) meta += "<dt>Last changed</dt><dd>" + esc(it.edited) + (it.edited.includes(" ") ? " GMT" : "") + "</dd>";
  d.innerHTML = '<summary><span class="caret">&#9654;</span><span class="id">' + esc(it.id) +
    '</span><span class="title">' + esc(it.title) + '</span><span class="badges">' + badges +
    '</span></summary><div class="detail">' + body + '<dl class="meta">' + meta + "</dl></div>";
  return d;
}

function render(){
  chips(); tree();
  document.querySelectorAll("[data-kind]").forEach(b => b.classList.toggle("on", b.dataset.kind === state.kind));
  $("needBtn").classList.toggle("on", state.need);
  $("hideDone").classList.toggle("on", state.hideDone);
  $("needN").textContent = " " + DATA.items.filter(it => it.needs && matches(it, {ignoreSection:true})).length;
  const list = $("list");
  if(state.view === "log"){ renderLog(list); foot(); return; }
  const open = new Set([...list.querySelectorAll("details[open]")].map(d => d.id));
  list.innerHTML = "";
  if(state.section){
    const c = document.createElement("div"); c.className = "crumb";
    const parts = state.section.split(SEP);
    c.innerHTML = '<a data-p="">All sections</a>' + parts.map((p, i) =>
      ' › <a data-p="' + esc(parts.slice(0, i+1).join(SEP)) + '">' + esc(p) + "</a>").join("");
    c.querySelectorAll("a").forEach(a => a.onclick = () => setSection(a.dataset.p));
    list.appendChild(c);
  }
  let shown = 0;
  const heading = (node, tag, text, n) => {
    const h = document.createElement(tag);
    h.innerHTML = esc(text) + '<span class="c">' + n + "</span>";
    h.title = "Show only this section";
    h.onclick = () => setSection(node.path);
    list.appendChild(h);
  };
  const walk = (node, top) => {
    const items = node.items.filter(it => matches(it));
    const sub = subtreeItems(node).filter(it => matches(it));
    if(!sub.length) return;
    if(node.depth === 1) heading(node, "h2", node.name, sub.length);
    else if(items.length) heading(node, "h3", node.path.split(SEP).slice(top.depth).join(" › "), items.length);
    // features first, then fixes, keeping file order
    for(const it of items.filter(i => i.kind === "feature").concat(items.filter(i => i.kind === "fix"))){
      const el = itemEl(it);
      if(open.has(it.id)) el.open = true;
      list.appendChild(el); shown++;
    }
    for(const k of node.kids) walk(k, node.depth === 1 ? node : top);
  };
  if(state.sort === "section") for(const k of root.kids) walk(k, k);
  else {
    // one flat list grouped by day; entries with an exact time sort above date-only ones of the same day
    const order = DATA.items.map((it, i) => [it, i]).filter(([it]) => matches(it));
    const dir = state.sort === "recent" ? -1 : 1;
    order.sort((a, b) => {
      if(!a[0].edited !== !b[0].edited) return a[0].edited ? -1 : 1;   // no date always last
      const c = a[0].edited < b[0].edited ? -1 : a[0].edited > b[0].edited ? 1 : 0;
      return c ? c * dir : (a[1] - b[1]) * dir;
    });
    let day = null;
    for(const [it] of order){
      const d = it.edited ? it.edited.slice(0, 10) : "No date";
      if(d !== day){
        day = d;
        const h = document.createElement("h2");
        h.style.cursor = "default";
        h.innerHTML = esc(d) + '<span class="c">' + order.filter(([x]) => (x.edited ? x.edited.slice(0, 10) : "No date") === d).length + "</span>";
        list.appendChild(h);
      }
      const el = itemEl(it);
      el.querySelector(".title").insertAdjacentHTML("beforeend", ' <span class="when">· ' + esc(it.section.join(" › ")) + "</span>");
      if(open.has(it.id)) el.open = true;
      list.appendChild(el); shown++;
    }
  }
  if(!shown) list.insertAdjacentHTML("beforeend", '<div class="empty">Nothing matches those filters.</div>');
  foot();
}

// devblog: one card per update, grouped by day; feature ids link to their entry. The top search box filters it.
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const longDate = d => { const [y, m, dd] = d.split("-"); return +dd + " " + MONTHS[+m - 1] + " " + y; };
const ids = new Set(DATA.items.map(i => i.id));
const linkIds = html => html.replace(/\b([A-Z]-\d{3})\b/g, (m, id) => ids.has(id) ? '<a href="#' + id + '" data-id="' + id + '">' + id + "</a>" : m);
// changelog: "By date" (one folded card per update, grouped by day) or "By section" (each update's
// points filed under the sections their feature ids are in; points with no id go with the update's ids).
// Click a title to open it. The top search box filters both.
const secOf = Object.fromEntries(DATA.items.map(i => [i.id, i.section[0] || "Other"]));
const idsIn = s => [...new Set((s.match(/\b[A-Z]-\d{3}\b/g) || []).filter(id => ids.has(id)))];
const blockText = b => b.p || b.ul.join(" ");
state.logBy = store.get("ns.logBy") === "section" ? "section" : "date";
function logCard(e, blocks, open, secs){
  const d = document.createElement("details"); d.className = "item log"; d.open = open;
  let body = "";
  for(const b of blocks){
    if(b.p) body += "<p>" + linkIds(inline(b.p)) + "</p>";
    else body += "<ul>" + b.ul.map(x => "<li>" + linkIds(inline(x)) + "</li>").join("") + "</ul>";
  }
  const when = state.logBy === "section" ? longDate(e.date) + (e.time ? " " + e.time : "") : (e.time ? e.time + " GMT" : "");
  d.innerHTML = '<summary><span class="caret">&#9654;</span><span class="t">' + esc(e.title) + "</span>" +
    (secs ? '<span class="secs">' + esc(secs) + "</span>" : "") + '<span class="when">' + esc(when) +
    '</span></summary><div class="detail">' + body + "</div>";
  return d;
}
function renderLog(list){
  list.innerHTML = '<div class="loghint"><span>What has been added and changed. Click an update to open it. Times are GMT.</span>' +
    '<span class="seg"><button data-by="date">By date</button><button data-by="section">By section</button></span></div>';
  list.querySelectorAll("[data-by]").forEach(b => {
    b.classList.toggle("on", b.dataset.by === state.logBy);
    b.onclick = () => { state.logBy = b.dataset.by; store.set("ns.logBy", state.logBy); render(); };
  });
  const shown = LOG.filter(e => !state.q || [e.title, ...e.body.map(blockText)].join(" ").toLowerCase().includes(state.q));
  if(state.logBy === "date"){
    // one folding group per day: click the date to fold or open that day's updates
    let day = null, g = null;
    shown.forEach((e, i) => {
      if(e.date !== day){
        day = e.date;
        const n = shown.filter(x => x.date === day).length;
        g = document.createElement("details"); g.className = "logsec"; g.open = i === 0 || !!state.q;
        g.innerHTML = '<summary><span class="caret">&#9654;</span>' + esc(longDate(day)) + '<span class="c">' + n +
          (n === 1 ? " update" : " updates") + "</span></summary>";
        list.appendChild(g);
      }
      const secs = [...new Set(idsIn(e.body.map(blockText).join(" ")).map(id => secOf[id]))].join(" · ");
      g.appendChild(logCard(e, e.body, i === 0 || !!state.q, secs));
    });
  } else {
    // section name -> [[entry, its blocks for that section]], sections in the feature list's order
    const order = [...new Set(DATA.items.map(i => i.section[0] || "Other")), "General"];
    const by = new Map(order.map(s => [s, []]));
    for(const e of shown){
      const all = idsIn(e.body.map(blockText).join(" "));
      const per = new Map();
      const add = (s, b) => { if(!per.has(s)) per.set(s, []); per.get(s).push(b); };
      for(const b of e.body){
        if(b.p){ const own = idsIn(b.p); if(own.length) new Set(own.map(id => secOf[id])).forEach(s => add(s, b)); continue; }
        for(const x of b.ul){
          const own = idsIn(x);
          const secs = new Set((own.length ? own : all).map(id => secOf[id]));
          if(!secs.size) secs.add("General");
          secs.forEach(s => add(s, {ul: [x]}));
        }
      }
      if(!per.size) add("General", ...e.body.slice(0, 1));
      // id-less paragraphs (the "From your notes" line) go along with whatever the update filed
      const intro = e.body.filter(b => b.p && !idsIn(b.p).length);
      for(const [s, blocks] of per){
        const merged = [];
        for(const b of [...intro.filter(b => !blocks.includes(b)), ...blocks]){
          const last = merged[merged.length - 1];
          if(b.ul && last && last.ul) last.ul = last.ul.concat(b.ul); else merged.push(b.ul ? {ul: [...b.ul]} : b);
        }
        by.get(s).push([e, merged]);
      }
    }
    for(const [s, rows] of by){
      if(!rows.length) continue;
      const g = document.createElement("details"); g.className = "logsec"; g.open = !!state.q;
      g.innerHTML = "<summary>" + '<span class="caret">&#9654;</span>' + esc(s) + '<span class="c">' + rows.length +
        (rows.length === 1 ? " update" : " updates") + " · latest " + esc(longDate(rows[0][0].date)) + "</span></summary>";
      rows.forEach(([e, blocks]) => g.appendChild(logCard(e, blocks, !!state.q, "")));
      list.appendChild(g);
    }
  }
  if(!shown.length) list.insertAdjacentHTML("beforeend", '<div class="empty">No updates match that search.</div>');
  // an id link opens that entry in the list view (even if the address already ends in it)
  list.querySelectorAll("a[data-id]").forEach(l => l.onclick = ev => {
    ev.preventDefault();
    try { history.replaceState(null, "", "#" + l.dataset.id); } catch(e) {}
    openHash(l.dataset.id);
  });
}

function foot(){
  const total = DATA.items.length, fin = DATA.items.filter(i => i.status === "done" || i.status === "pass").length;
  $("foot").textContent = total + " entries · " + fin + " passed or done · source: FEATURES.md" +
    (DATA.updated ? " · updated " + DATA.updated : "") + " · regenerate with build_feature_list.py";
}

document.querySelectorAll("[data-kind]").forEach(b => b.onclick = () => { state.kind = b.dataset.kind; render(); });
$("needBtn").onclick = () => { state.need = !state.need; render(); };
$("hideDone").onclick = () => { state.hideDone = !state.hideDone; store.set("ns.hideDone", state.hideDone ? "1" : "0"); render(); };
$("q").oninput = e => { state.q = e.target.value.trim().toLowerCase(); render(); };
$("secQ").oninput = e => { state.secQ = e.target.value.trim().toLowerCase(); render(); };
$("sort").value = state.sort;
$("sort").onchange = e => { state.sort = e.target.value; store.set("ns.sort", state.sort); render(); window.scrollTo({top:0}); };
let allOpen = false;
$("expand").onclick = () => {
  allOpen = !allOpen;
  document.querySelectorAll("details.item, details.logsec").forEach(d => d.open = allOpen);
  $("expand").textContent = allOpen ? "Collapse all" : "Expand all";
};
const setHH = () => document.documentElement.style.setProperty("--hh", document.querySelector("header").offsetHeight + 8 + "px");
window.addEventListener("resize", setHH);
// narrow screens: the section tree folds away; wide screens: always open (its summary is hidden there)
const narrow = window.matchMedia("(max-width:800px)");
const fitNav = () => { $("navBox").open = !narrow.matches; setHH(); };
narrow.addEventListener("change", fitNav);
fitNav();
function openHash(want){
  const id = typeof want === "string" ? want : decodeURIComponent(location.hash.slice(1));
  if(!id) return;
  const it = DATA.items.find(i => i.id === id);
  if(it && state.view !== "list"){ setView("list"); render(); }
  if(it && !matches(it)){ state.section = ""; state.status = ""; state.kind = "all"; state.need = false; state.hideDone = false; state.q = ""; $("q").value = ""; state.secQ = ""; $("secQ").value = ""; render(); }
  const el = document.getElementById(id);
  if(!el) return;
  el.open = true; el.classList.add("flash");
  el.scrollIntoView({block:"center"});
  setTimeout(() => el.classList.remove("flash"), 1500);
}
window.addEventListener("hashchange", openHash);
render(); setHH(); openHash();
</script>
</body>
