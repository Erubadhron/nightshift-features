s, ghouls and the bumming guy are now jointed stick men in their colour. They walk and run with real steps, crouch with bent knees, tuck their legs in the air, slide, roll, climb ladders, put a hand on the wall when wall-running and reach up when climbing ledges. They hold their gun up and aim it up and down with you. Ghouls hunch and reach out; the bumming guy swings his arms.", "Bodies falling apart (F-057): the stick man now falls apart limb by limb, right where it stood. There's no switch to blocks. The pieces also fall at proper speed now; before they were using half the game's gravity.", "Jump pads (F-058): ghouls and the bumming guy now get thrown by pads too.", "Ghouls leap up at you if you stand on something just above them. One stuck behind a wall now pops back in somewhere it can see you."]}]}, {"date": "2026-10-23", "time": "11:14", "title": "Bodies fly apart, and a Survival mode", "body": [{"p": "Two more of the boys' ideas, ready to try."}, {"ul": ["Bodies blown apart (F-057): when someone dies, the body falls apart into head, chest, arms and legs. A big hit (a rocket, a sniper shot) throws the pieces and some gore around. The pieces fade after a few seconds.", "Survival (F-021): a new co-op mode. Everyone is on the same side against waves of ghouls, and each wave is bigger and faster. If you die you are out until the wave is cleared, then everyone comes back. If everyone goes down, you are overrun. Pick how many waves in Mission setup (10 to start). Bots help fight."]}]}, {"date": "2026-10-23", "time": "10:58", "title": "Quake Arena mode and pick a class", "body": [{"p": "Two more of the boys' ideas, both ready to try."}, {"ul": ["Quake Arena (F-023): a new mode in Mission setup. Everyone spawns with the rifle, sniper and rocket launcher, full ammo. No pickups. You run faster, your own rockets barely hurt you and throw you higher, and every kill gives 50 health back.", "Create a class (F-025): in the agent lobby, press up / down to pick what you spawn with in Deathmatch and Team Deathmatch: Standard, Assault (rifle), Marksman (sniper), Demolition (rockets), Brawler (sledge) or Grenadier (extra grenades)."]}]}, {"date": "2026-10-23", "time": "10:49", "title": "Only people call the bumming guy", "body": [{"p": "Bots' missed shots no longer count, so easy bots don't fill the map with bumming guys (F-005). He still only comes for real players who miss too much."}]}, {"date": "2026-10-23", "time": "09:10", "title": "The bumming guy", "body": [{"p": "Miss too many shots and someone comes for you (F-005). In Deathmatch and Team Deathmatch:"}, {"ul": ["Miss 10-15 shots in a row (bullets or rockets that hit nobody) and an alarm goes off. A big dark red guy turns up some way off and runs at you.", "If he catches you, he bounces you in front of him for 5 s. You can't move, but you can't be hurt either. Mash jump to break free sooner.", "He takes a lot of damage to put down. Down him while he holds someone and they go free. He gives up after 45 s.", "Turn him off in Mission setup (\"Bumming guy\"). Bots run from him too."]}]}, {"date": "2026-10-23", "time": "08:53", "title": "The bummer bounces you before you're caught", "body": [{"p": "In Be the Bummer, a swipe now grabs a hider from behind instead of catching them straight away (F-077)."}, {"ul": ["The bummer holds them right in front of him and bounces them up and down for 3 seconds, with a boing on every bounce. Then they're caught.", "Neither of them can move while it happens. Knock the bummer out in time and your friend goes free."]}]}, {"date": "2026-10-23", "time": "08:46", "title": "New game mode: Be the Bummer", "body": [{"p": "One player is the bummer and hunts the rest (F-077). Pick it in Mission setup."}, {"ul": ["The bummer is dark red with claws and catches in one swipe. He waits 5 s with a black screen while everyone hides.", "Caught players are out until the next round. Players still free when time runs out score 2 points. Knocking the bummer out scores 1.", "Everyone gets one turn as the bummer, then the match ends. The most points wins.", "Bots run from the bummer, or hunt when they are the bummer."]}]}, {"date": "2026-10-23", "time": "00:58", "title": "Werewolf change, jaw view, VALUES folder", "body": [{"ul": ["Turning into the werewolf now takes a moment: the camera circles you while you grow and go furry. You can't be hurt while it happens (F-008).", "As the werewolf you see out through its jaws, with teeth at the top and bottom of the screen that sway as you run. Two clawed paws in view.", "Everyone hears the howl now. Put a recording at `sounds\\howl.mp3` to replace it. A whoosh rises 4 s before you change back.", "Melee hits connect better when you're right next to someone. A new `show_hitboxes` switch shows what melee aims at (F-075).", "New VALUES folder: every tuning number in a few tables, each with a link to where you change it (F-074).", "New ideas on the list: humanoid players with parkour (F-076), and the \"Be the bummer\" game mode (F-077)."]}]}, {"date": "2026-10-23", "time": "00:32", "title": "Ability icon and a charged werewolf pounce", "body": [{"ul": ["Melee weapons now have a small ability icon above the weapon name, with a different picture for each one. It goes dark grey when used and the colour fills back in as it recharges (F-071).", "Werewolf pounce: hold aim to charge it for up to 5 seconds. A full charge jumps about 7.5 m high."]}]}, {"date": "2026-10-23", "time": "00:17", "title": "Melee weapons get abilities", "body": [{"p": "Every melee weapon has a special move now on the aim button (LT / right mouse) (F-071)."}, {"ul": ["Knife: throw it. It kills up close, then lies on the floor until you pick it back up.", "Spear: lunge 4 m with a thrust. Sledge: slam the ground to knock everyone near you flying and dazed.", "Shield: hold aim to raise it and bounce rockets back. Chainsaw: hold aim to rev and run faster.", "Nightstick: a stun hit that freezes their aim and trigger for a moment. Werewolf claws: pounce."]}]}, {"date": "2026-10-23", "time": "00:06", "title": "Ledge climbing", "body": [{"p": "You can climb up onto ledges now (F-067). Jump at a wall or crate with the stick held forward and you pull yourself up onto the top."}, {"ul": ["Anything up to about 3.5 m high from a running jump, as long as there's room to stand on top.", "You rise, roll over the edge and keep running. It's first person only for now: proper climbing moves for other players to see come with proper player models."]}, {"p": "The new slides and wall runs are signed off as done (F-068, F-069, F-070, F-027)."}]}, {"date": "2026-10-22", "time": "23:54", "title": "Smarter slides and longer wall runs", "body": [{"p": "Slides now reward speed and stop rewarding spam."}, {"ul": ["Slide straight after another slide and it goes 25% less far each time. Wait 1.5 s and it's a full slide again (F-068).", "The slide starts at the speed you're going. Hit slide just as you land a jump and you shoot off faster and further (F-069).", "Crouching in mid-air no longer slows you down."]}, {"p": "Wall runs last as long as you keep your speed (F-070). You slow down bit by bit, then start to slip down the wall and drop off. Come in fast and you can run a long way."}]}, {"date": "2026-10-22", "time": "23:38", "title": "New melee swings, splintering towers, new ideas filed", "body": [{"p": "Melee weapons swing properly now (F-020, F-072)."}, {"ul": ["Each one moves its own way: the Nightstick chops down, the knife slashes, the spear and shield jab forward, the sledge winds up high and smashes down.", "The hit lands right when the swing does, with a soft whoosh instead of the scratchy sound."]}, {"p": "The sniper towers break apart like in Red Faction (F-019)."}, {"ul": ["Every shot punches a hole in the wooden legs and sends wood chips flying.", "A leg snaps where you hit it most and leaves a splintered stump. The tower then tips over toward the missing leg under real physics.", "Melee swings chip the wood too. A fallen tower is solid cover."]}, {"p": "New ideas from the boys are on the list: ledge climbing (F-067), no slide spamming (F-068), momentum slides (F-069), longer wall runs while you're fast (F-070), melee abilities (F-071), screen tricks in split screen (F-066) and a city level full of things to break (F-073)."}]}, {"date": "2026-10-22", "time": "20:59", "title": "Sniper towers come down", "body": [{"p": "You can now knock down the sniper towers on Test Map 1 (F-019)."}, {"ul": ["Shoot the legs or hit them with rockets and grenades. They get thinner and scorched, and the tower starts to lean.", "When a leg breaks the tower falls over and crushes anyone under it or on it.", "It stands back up after 45 seconds."]}]}, {"date": "2026-10-22", "time": "20:55", "title": "Killstreaks and the werewolf", "body": [{"p": "Get kills without dying to earn rewards (F-037)."}, {"ul": ["3 kills in a row: radar for 30 seconds. Your mini-map zooms out and shows everyone.", "5 kills in a row: you become the werewolf for 30 seconds (F-008). Bigger, furry, red eyes, claws only, faster and tougher. Everyone gets warned.", "You can switch killstreaks off on the match setup page."]}]}, {"date": "2026-10-22", "time": "20:50", "title": "Toilets, doors and a vent", "body": [{"p": "A toilet block on Test Map 1 (F-013): three cubicles with doors that swing open when you walk into them and shut behind you, so you can hide. Shut doors stop bullets."}, {"ul": ["A vent to crawl through (F-014): crouch or slide in from behind the block and come out in a toilet.", "Small windows in the end cubicle to shoot out of (F-018)."]}]}, {"date": "2026-10-22", "time": "20:32", "title": "Cleaner screen", "body": [{"p": "Less text on screen during a match (F-065)."}, {"ul": ["No more \"press A to join\" line at the bottom. Everyone joins in the lobby.", "The P1 name only shows in split screen. Ammo is just the gun and the numbers; grenades only show when you have some.", "Shorter pickup messages, and the lobby's empty slots no longer blink."]}]}, {"date": "2026-10-22", "time": "20:27", "title": "New health ring with a mini-map", "body": [{"p": "The health and armour circle has a new look (F-048), inspired by Nightfire."}, {"ul": ["Bigger, thinner rings made of small glowing segments. Health is red-orange and pulses when low; armour is blue.", "Inside the rings is now a mini-map (F-064) instead of the health number. It turns as you turn.", "Other players and bots show as dots: faint when far away, brighter as they get close."]}]}, {"date": "2026-10-22", "time": "20:17", "title": "Quieter footsteps", "body": [{"p": "Footsteps, wall-run steps, slides, rolls and backsteps are quieter now (F-054)."}]}, {"date": "2026-10-22", "time": "20:13", "title": "Movement sounds", "body": [{"p": "Every move now makes a sound (F-054)."}, {"ul": ["Footsteps when you run, quieter when crouched. You can hear other players walking near you.", "Jumps, landings (a hard fall lands louder), slides, rolls and backsteps, crouching and standing up.", "Wall runs, wall jumps and climbing ladders."]}]}, {"date": "2026-10-22", "time": "20:05", "title": "Boot intro, lobby, teams and weapon sets", "body": [{"p": "The game now boots like a proper console game, in a Nightfire-style look with our own names (F-062)."}, {"ul": ["A short intro types out on a \"secure terminal\" and the NIGHTSHIFT logo decodes. Any button skips it, and Options can turn it off.", "Then PRESS START and the Command Centre menu: Multiplayer, Options, Controls, Quit.", "Mission setup: pick the mode, the map and what weapons spawn (F-061: snipers only, melee only, random and more).", "New mode, Team Deathmatch (F-060): Blue against Red, with a friendly fire setting.", "Agent lobby (F-063): everyone joins with their own pad, picks a team and readies up. Add or remove bots there. The match starts after a 3 s countdown."]}]}, {"date": "2026-10-22", "time": "19:21", "title": "Jump pads go your way", "body": [{"p": "Jump pads (F-058) now bounce you up and onward the way you're running, from any side. Stand still on one and it sends you the way you face."}, {"ul": ["Test Map 2: the side pads moved into the catwalk gaps against the wall. Bounce left or right along the wall onto a catwalk, or out into the middle.", "The pad by the spire top pushes you only a little, so you land on the small top."]}]}, {"date": "2026-10-22", "time": "19:13", "title": "Main menu, Test Map 2, One in the Chamber", "body": [{"p": "The game now starts on a main menu where you pick the mode and the map (F-010)."}, {"ul": ["New map, Test Map 2 (F-059): a tall arena with corner decks, catwalks, bridges and a spire in the middle. The old map is now Test Map 1.", "Jump pads (F-058) throw you up onto ledges. Wall run across the gaps in the catwalks.", "New mode, One in the Chamber (F-028): one bullet, every hit kills, a kill gives you a bullet back. 3 lives each, last one standing wins.", "\"Main menu\" in the pause menu goes back to the menu."]}]}, {"date": "2026-10-22", "time": "18:35", "title": "Wall running", "body": [{"p": "You can now run along walls (F-027)."}, {"ul": ["While running, jump at a wall from the side and keep holding forward. You run along it for about 1.4 s.", "Press jump to leap off it. You can jump across to another wall and keep going.", "Let go of forward or press crouch to drop off. You can still shoot while on the wall."]}]}, {"date": "2026-10-22", "time": "18:28", "title": "Melee weapons", "body": [{"p": "Five new melee weapons to pick up (F-020): knife, spear, sledge, chainsaw and shield. Switch to them with Y / RB like the Nightstick."}, {"ul": ["Knife is quick but short. Spear reaches far but is narrow. Sledge is slow and kills in one hit.", "Chainsaw: hold RT to keep cutting.", "Shield: hold it and hits from in front only do a fifth of the damage. RT bashes with it."]}]}, {"date": "2026-10-22", "time": "18:22", "title": "Sticky grenades", "body": [{"p": "Sticky grenades have their own button: D-pad up on a controller, F on the keyboard (F-056)."}, {"ul": ["Press once to throw. It sticks to whatever it hits, walls, floors or people. Press again to set it off.", "Only one can be out at a time. You start with 1 and can carry 3. STICKY boxes on the east and west crates give 2 more.", "Stuck on someone, it goes wherever they go and they see \"STICKY ON YOU!\". If you die before setting it off, it fizzles.", "The boys' new ideas are filed: stickies (F-056) and Joel's bodies blown apart (F-057, waits for real player models)."]}]}, {"date": "2026-10-22", "time": "17:52", "title": "Proper bots", "body": [{"p": "Bots now play properly instead of wandering (F-053)."}, {"ul": ["They go for pickups they need, chase you when they see you, and shoot with the right gun for the distance.", "Shoot one from behind and it turns round.", "Pick Easy, Medium or Hard in Match setup. Hard bots react faster, aim better and dodge.", "They don't throw grenades or climb ladders yet."]}]}, {"date": "2026-10-22", "time": "17:39", "title": "Aim assist dropped", "body": [{"p": "Aim assist (F-051) is off the list. Nobody asked for it, so it won't be built."}]}, {"date": "2026-10-22", "time": "17:35", "title": "Pause menu, settings and sound", "body": [{"p": "The game has a pause menu, saved settings and sound effects (F-054)."}, {"ul": ["Start / Esc pauses and opens the menu: look sensitivity, invert look, crouch toggle or hold, volume.", "Match setup: kill limit, time limit and bots for the next match.", "Sounds for every gun, the Nightstick, grenades, explosions, pickups, hits and the end of a match. The game makes them itself."]}]}, {"date": "2026-10-22", "time": "17:18", "title": "Changelog on the feature list", "body": [{"p": "This page now has a devblog. Pick \"Changelog\" under \"All sections\" on the left to read what changed and when."}]}, {"date": "2026-10-22", "time": "17:06", "title": "Frag grenades", "body": [{"p": "Grenades have their own button: LB on a controller, G on the keyboard (F-017)."}, {"ul": ["You start with 2 and can carry 4. FRAGS boxes behind the north and south cover walls give 2 more.", "They bounce, blink red, and go off 2.5 s after the throw. The blast does up to 100 damage within 5 m.", "Your own grenade hurts you half as much. Rockets now share the same explosion code."]}]}, {"date": "2026-10-22", "time": "17:02", "title": "Nightstick", "body": [{"p": "Everyone always carries a Nightstick for melee (F-055). Switch to it with Y / RB. Swing with RT."}, {"ul": ["50 damage, so two hits kill. Each hit knocks the target back.", "Short reach. You have to be facing your target."]}]}, {"date": "2026-10-22", "time": "16:58", "title": "Deathmatch rules", "body": [{"p": "Matches are now proper deathmatches (F-052)."}, {"ul": ["Kills score points. The match ends at the kill limit or the time limit.", "Spawn protection after respawning, plus a scoreboard (Back / Tab) and an end screen with the winner."]}]}, {"date": "2026-10-22", "time": "16:38", "title": "Longer slide, health kits, starry sky", "body": [{"ul": ["The slide lasts longer and travels further (X-001). The boys tested it and passed it.", "Health kits on the map heal you (F-050).", "The night sky now has stars (F-007)."]}]}, {"date": "2026-10-22", "time": "13:43", "title": "One-click build and feature list", "body": [{"ul": ["One-click Windows build, and one-click publishing of this page.", "The feature list got a folding sidebar and clearer section names."]}]}, {"date": "2026-10-22", "time": "12:59", "title": "Plans folder", "body": [{"p": "Progress notes, the plan, the ideas board and the boys' notes now live together in the PLANS folder."}]}, {"date": "2026-10-21", "time": "23:31", "title": "Damage, death and respawn", "body": [{"ul": ["Players can now be hurt and die, then respawn (F-047).", "Health ring and armour vests (F-048).", "New Kestrel assault rifle (F-049) and a bigger 80 m test map."]}]}, {"date": "2026-10-21", "time": "22:43", "title": "First weapons", "body": [{"ul": ["Pocket 9 starting pistol.", "Hammerhead and Longsight weapon pickups, plus ammo boxes (F-002)."]}]}, {"date": "2026-10-21", "time": "22:20", "title": "Movement extras and night props", "body": [{"ul": ["Tap jump for a small jump, hold jump for a big one (F-003).", "Slide (F-001), roll (F-004) and ladders.", "A hut to camp in and a sniper tower (F-006)."]}]}, {"date": "2026-10-21", "time": "21:16", "title": "First playable build", "body": [{"p": "Nightshift starts: the project skeleton, controller and keyboard input, basic movement and a test room."}]}]};
const $ = id => document.getElementById(id);
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const state = {kind:"all", status:"", need:false, hideDone:store.get("ns.hideDone")==="1", q:"", secQ:"",
  section:store.get("ns.section")||"", sort:store.get("ns.sort")||"section", view:store.get("ns.view")==="log" ? "log" : "list"};
const LOG = DATA.changelog || [];
if(!["section","recent","oldest"].includes(state.sort)) state.sort = "section";
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const inline = s => esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
const cssStatus = s => "var(--s-" + s.replace(/ /g,"-") + ")";
const label = s => s.charAt(0).toUpperCase() + s.slice(1);
const SEP = " > ";
const pathOf = it => it.section.join(SEP);
const fileHref = f => "../" + f.replace(/\\/g,"/").split("/").map(encodeURIComponent).join("/");

// section tree, in the order sections first appear in FEATURES.md
const root = {name:"", path:"", kids:[], items:[]};
for(const it of DATA.items){
  let node = root;
  it.section.forEach((name, i) => {
    const path = it.section.slice(0, i+1).join(SEP);
    let k = node.kids.find(c => c.path === path);
    if(!k){ k = {name, path, kids:[], items:[], depth:i+1}; node.kids.push(k); }
    node = k;
  });
  node.items.push(it);
}
const allNodes = []; (function walk(n){ for(const k of n.kids){ allNodes.push(k); walk(k); } })(root);
if(state.section && !allNodes.some(n => n.path === state.section)) state.section = "";

function matches(it, opt){
  opt = opt || {};
  if(state.kind !== "all" && it.kind !== state.kind) return false;
  if(state.kind === "fix" && (it.status === "done" || it.status === "pass")) return false;   // finished fixes no longer need fixing
  if(!opt.ignoreStatus && state.status && it.status !== state.status) return false;
  if(state.hideDone && (it.status === "done" || it.status === "pass")) return false;
  if(state.need && !it.needs) return false;
  if(!opt.ignoreSection && state.section){
    const p = pathOf(it);
    if(p !== state.section && !p.startsWith(state.section + SEP)) return false;
  }
  if(state.q && !hay(it).includes(state.q)) return false;
  if(state.secQ && !hay(it).includes(state.secQ)) return false;
  return true;
}
const hay = it => it._hay || (it._hay = [it.id,it.title,it.status,pathOf(it),it.file,it.needs,it.related,
  it.body.map(b => b.p || b.ul.join(" ")).join(" ")].join(" ").toLowerCase());
const subtreeItems = n => n.items.concat(...n.kids.map(subtreeItems));

// folding sidebar: which sections show their subsections, and whether the list under "All sections" shows (both remembered)
const openSecs = new Set((() => { try { return JSON.parse(store.get("ns.openSecs") || "[]"); } catch(e) { return []; } })());
state.treeOpen = store.get("ns.treeOpen") !== "0";
const saveFold = () => { store.set("ns.openSecs", JSON.stringify([...openSecs])); store.set("ns.treeOpen", state.treeOpen ? "1" : "0"); };
// unfold the parents of a section so it can be seen in the sidebar
const openTo = p => { if(!p) return; state.treeOpen = true; const parts = p.split(SEP); for(let i = 1; i < parts.length; i++) openSecs.add(parts.slice(0, i).join(SEP)); };
openTo(state.section);

// "list" (the entries) or "log" (the changelog / devblog)
function setView(v){ state.view = v; store.set("ns.view", v); }
function setSection(p){ setView("list"); state.section = p; store.set("ns.section", p); openTo(p); saveFold(); render(); window.scrollTo({top:0}); }

function tree(){
  const box = $("tree"); box.innerHTML = "";
  const mk = (node, ul) => {
    const li = document.createElement("li");
    const row = document.createElement("div"); row.className = "trow";
    const b = document.createElement("button");
    const n = node === root ? DATA.items.filter(it => matches(it, {ignoreSection:true})).length
                            : subtreeItems(node).filter(it => matches(it, {ignoreSection:true})).length;
    // the sidebar filter hides sections with nothing that matches (the open section and "All sections" stay)
    if(state.secQ && !n && node !== root && state.section !== node.path) return;
    b.className = (node.depth === 1 ? "top" : "") + (state.view === "list" && state.section === node.path ? " on" : "") + (n ? "" : " dim");
    b.innerHTML = '<span class="nm">' + esc(node === root ? "All sections" : node.name) + '</span><span class="n">' + n + "</span>";
    b.onclick = () => setSection(node.path);
    // a filter in the sidebar unfolds everything so the matches show
    const isOpen = !!state.secQ || (node === root ? state.treeOpen : openSecs.has(node.path));
    if(node.kids.length){
      const t = document.createElement("button");
      t.className = "tog" + (isOpen ? " open" : "");
      t.innerHTML = "<span>&#9654;</span>";
      t.title = (isOpen ? "Hide " : "Show ") + (node === root ? "sections" : "subsections");
      t.setAttribute("aria-expanded", isOpen);
      t.onclick = () => {
        if(node === root) state.treeOpen = !isOpen;
        else if(isOpen) openSecs.delete(node.path); else openSecs.add(node.path);
        saveFold(); tree();
      };
      row.append(b, t);
    } else { row.appendChild(b); row.insertAdjacentHTML("beforeend", '<span class="tog"></span>'); }
    li.appendChild(row);
    if(node.kids.length && node !== root && isOpen){
      const sub = document.createElement("ul");
      for(const k of node.kids) mk(k, sub);
      li.appendChild(sub);
    }
    ul.appendChild(li);
  };
  mk(root, box);
  // the changelog sits right under "All sections"
  if(LOG.length){
    const li = document.createElement("li"); li.className = "logrow";
    li.innerHTML = '<div class="trow"><button class="top' + (state.view === "log" ? " on" : "") + '" title="What has been added and changed, newest first">' +
      '<span class="nm"><span class="ic">&#9998;</span> Changelog</span><span class="n">' + LOG.length + '</span></button><span class="tog"></span></div>';
    li.querySelector("button").onclick = () => { setView("log"); render(); window.scrollTo({top:0}); };
    box.appendChild(li);
  }
  if(state.treeOpen || state.secQ) for(const k of root.kids) mk(k, box);
}

function chips(){
  const box = $("statusChips"); box.innerHTML = "";
  const all = document.createElement("button");
  all.className = "chip" + (state.status ? "" : " on");
  all.innerHTML = "Any status";
  all.onclick = () => { state.status = ""; render(); };
  box.appendChild(all);
  for(const s of DATA.statuses){
    const n = DATA.items.filter(it => it.status === s && matches(it, {ignoreStatus:true})).length;
    if(!n && state.status !== s) continue;
    const b = document.createElement("button");
    b.className = "chip" + (state.status === s ? " on" : "");
    b.innerHTML = '<span class="dot" style="background:' + cssStatus(s) + '"></span>' + label(s) + '<span class="n">' + n + '</span>';
    b.onclick = () => { state.status = state.status === s ? "" : s; render(); };
    box.appendChild(b);
  }
}

function itemEl(it){
  const d = document.createElement("details");
  d.className = "item"; d.id = it.id;
  let badges = "";
  if(it.progress) badges += '<span class="pct" title="Completion">' + esc(it.progress) + '%<i><b style="width:' + Math.min(100, +it.progress || 0) + '%"></b></i></span>';
  if(it.kind === "fix" && it.status !== "done" && it.status !== "pass") badges += '<span class="badge fix">fix</span>';
  badges += '<span class="badge" style="color:' + cssStatus(it.status) + '">' + esc(it.status) + '</span>';
  if(it.priority) badges += '<span class="badge pri ' + esc(it.priority) + '">' + esc(it.priority) + '</span>';
  if(it.needs) badges += '<span class="badge needs">waiting on you</span>';
  if(state.sort !== "section") badges += '<span class="when" title="Last changed">' + esc(it.edited ? (it.edited.split(" ")[1] ? it.edited.split(" ")[1] + " GMT" : it.edited) : "no date") + "</span>";
  let body = "";
  for(const b of it.body){
    if(b.p) body += "<p>" + inline(b.p) + "</p>";
    else body += "<ul>" + b.ul.map(x => "<li>" + inline(x) + "</li>").join("") + "</ul>";
  }
  let meta = "";
  if(it.needs) meta += '<dt>Waiting on</dt><dd class="need">' + inline(it.needs) + "</dd>";
  if(it.file) meta += '<dt>File</dt><dd><a href="' + fileHref(it.file) + '" target="_blank">' + esc(it.file) + "</a></dd>";
  if(it.related) meta += "<dt>Related</dt><dd>" + inline(it.related) + "</dd>";
  meta += "<dt>Section</dt><dd>" + esc(it.section.join(" › ")) + "</dd>";
  if(it.added) meta += "<dt>Added</dt><dd>" + esc(it.added) + "</dd>";
  if(it.edited) meta += "<dt>Last changed</dt><dd>" + esc(it.edited) + (it.edited.includes(" ") ? " GMT" : "") + "</dd>";
  d.innerHTML = '<summary><span class="caret">&#9654;</span><span class="id">' + esc(it.id) +
    '</span><span class="title">' + esc(it.title) + '</span><span class="badges">' + badges +
    '</span></summary><div class="detail">' + body + '<dl class="meta">' + meta + "</dl></div>";
  return d;
}

function render(){
  chips(); tree();
  document.querySelectorAll("[data-kind]").forEach(b => b.classList.toggle("on", b.dataset.kind === state.kind));
  $("needBtn").classList.toggle("on", state.need);
  $("hideDone").classList.toggle("on", state.hideDone);
  $("needN").textContent = " " + DATA.items.filter(it => it.needs && matches(it, {ignoreSection:true})).length;
  const list = $("list");
  if(state.view === "log"){ renderLog(list); foot(); return; }
  const open = new Set([...list.querySelectorAll("details[open]")].map(d => d.id));
  list.innerHTML = "";
  if(state.section){
    const c = document.createElement("div"); c.className = "crumb";
    const parts = state.section.split(SEP);
    c.innerHTML = '<a data-p="">All sections</a>' + parts.map((p, i) =>
      ' › <a data-p="' + esc(parts.slice(0, i+1).join(SEP)) + '">' + esc(p) + "</a>").join("");
    c.querySelectorAll("a").forEach(a => a.onclick = () => setSection(a.dataset.p));
    list.appendChild(c);
  }
  let shown = 0;
  const heading = (node, tag, text, n) => {
    const h = document.createElement(tag);
    h.innerHTML = esc(text) + '<span class="c">' + n + "</span>";
    h.title = "Show only this section";
    h.onclick = () => setSection(node.path);
    list.appendChild(h);
  };
  const walk = (node, top) => {
    const items = node.items.filter(it => matches(it));
    const sub = subtreeItems(node).filter(it => matches(it));
    if(!sub.length) return;
    if(node.depth === 1) heading(node, "h2", node.name, sub.length);
    else if(items.length) heading(node, "h3", node.path.split(SEP).slice(top.depth).join(" › "), items.length);
    // features first, then fixes, keeping file order
    for(const it of items.filter(i => i.kind === "feature").concat(items.filter(i => i.kind === "fix"))){
      const el = itemEl(it);
      if(open.has(it.id)) el.open = true;
      list.appendChild(el); shown++;
    }
    for(const k of node.kids) walk(k, node.depth === 1 ? node : top);
  };
  if(state.sort === "section") for(const k of root.kids) walk(k, k);
  else {
    // one flat list grouped by day; entries with an exact time sort above date-only ones of the same day
    const order = DATA.items.map((it, i) => [it, i]).filter(([it]) => matches(it));
    const dir = state.sort === "recent" ? -1 : 1;
    order.sort((a, b) => {
      if(!a[0].edited !== !b[0].edited) return a[0].edited ? -1 : 1;   // no date always last
      const c = a[0].edited < b[0].edited ? -1 : a[0].edited > b[0].edited ? 1 : 0;
      return c ? c * dir : (a[1] - b[1]) * dir;
    });
    let day = null;
    for(const [it] of order){
      const d = it.edited ? it.edited.slice(0, 10) : "No date";
      if(d !== day){
        day = d;
        const h = document.createElement("h2");
        h.style.cursor = "default";
        h.innerHTML = esc(d) + '<span class="c">' + order.filter(([x]) => (x.edited ? x.edited.slice(0, 10) : "No date") === d).length + "</span>";
        list.appendChild(h);
      }
      const el = itemEl(it);
      el.querySelector(".title").insertAdjacentHTML("beforeend", ' <span class="when">· ' + esc(it.section.join(" › ")) + "</span>");
      if(open.has(it.id)) el.open = true;
      list.appendChild(el); shown++;
    }
  }
  if(!shown) list.insertAdjacentHTML("beforeend", '<div class="empty">Nothing matches those filters.</div>');
  foot();
}

// devblog: one card per update, grouped by day; feature ids link to their entry. The top search box filters it.
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const longDate = d => { const [y, m, dd] = d.split("-"); return +dd + " " + MONTHS[+m - 1] + " " + y; };
const ids = new Set(DATA.items.map(i => i.id));
const linkIds = html => html.replace(/\b([A-Z]-\d{3})\b/g, (m, id) => ids.has(id) ? '<a href="#' + id + '" data-id="' + id + '">' + id + "</a>" : m);
// changelog: "By date" (one folded card per update, grouped by day) or "By section" (each update's
// points filed under the sections their feature ids are in; points with no id go with the update's ids).
// Click a title to open it. The top search box filters both.
const secOf = Object.fromEntries(DATA.items.map(i => [i.id, i.section[0] || "Other"]));
const idsIn = s => [...new Set((s.match(/\b[A-Z]-\d{3}\b/g) || []).filter(id => ids.has(id)))];
const blockText = b => b.p || b.ul.join(" ");
state.logBy = store.get("ns.logBy") === "section" ? "section" : "date";
function logCard(e, blocks, open, secs){
  const d = document.createElement("details"); d.className = "item log"; d.open = open;
  let body = "";
  for(const b of blocks){
    if(b.p) body += "<p>" + linkIds(inline(b.p)) + "</p>";
    else body += "<ul>" + b.ul.map(x => "<li>" + linkIds(inline(x)) + "</li>").join("") + "</ul>";
  }
  const when = state.logBy === "section" ? longDate(e.date) + (e.time ? " " + e.time : "") : (e.time ? e.time + " GMT" : "");
  d.innerHTML = '<summary><span class="caret">&#9654;</span><span class="t">' + esc(e.title) + "</span>" +
    (secs ? '<span class="secs">' + esc(secs) + "</span>" : "") + '<span class="when">' + esc(when) +
    '</span></summary><div class="detail">' + body + "</div>";
  return d;
}
function renderLog(list){
  list.innerHTML = '<div class="loghint"><span>What has been added and changed. Click an update to open it. Times are GMT.</span>' +
    '<span class="seg"><button data-by="date">By date</button><button data-by="section">By section</button></span></div>';
  list.querySelectorAll("[data-by]").forEach(b => {
    b.classList.toggle("on", b.dataset.by === state.logBy);
    b.onclick = () => { state.logBy = b.dataset.by; store.set("ns.logBy", state.logBy); render(); };
  });
  const shown = LOG.filter(e => !state.q || [e.title, ...e.body.map(blockText)].join(" ").toLowerCase().includes(state.q));
  if(state.logBy === "date"){
    // one folding group per day: click the date to fold or open that day's updates
    let day = null, g = null;
    shown.forEach((e, i) => {
      if(e.date !== day){
        day = e.date;
        const n = shown.filter(x => x.date === day).length;
        g = document.createElement("details"); g.className = "logsec"; g.open = i === 0 || !!state.q;
        g.innerHTML = '<summary><span class="caret">&#9654;</span>' + esc(longDate(day)) + '<span class="c">' + n +
          (n === 1 ? " update" : " updates") + "</span></summary>";
        list.appendChild(g);
      }
      const secs = [...new Set(idsIn(e.body.map(blockText).join(" ")).map(id => secOf[id]))].join(" · ");
      g.appendChild(logCard(e, e.body, i === 0 || !!state.q, secs));
    });
  } else {
    // section name -> [[entry, its blocks for that section]], sections in the feature list's order
    const order = [...new Set(DATA.items.map(i => i.section[0] || "Other")), "General"];
    const by = new Map(order.map(s => [s, []]));
    for(const e of shown){
      const all = idsIn(e.body.map(blockText).join(" "));
      const per = new Map();
      const add = (s, b) => { if(!per.has(s)) per.set(s, []); per.get(s).push(b); };
      for(const b of e.body){
        if(b.p){ const own = idsIn(b.p); if(own.length) new Set(own.map(id => secOf[id])).forEach(s => add(s, b)); continue; }
        for(const x of b.ul){
          const own = idsIn(x);
          const secs = new Set((own.length ? own : all).map(id => secOf[id]));
          if(!secs.size) secs.add("General");
          secs.forEach(s => add(s, {ul: [x]}));
        }
      }
      if(!per.size) add("General", ...e.body.slice(0, 1));
      // id-less paragraphs (the "From your notes" line) go along with whatever the update filed
      const intro = e.body.filter(b => b.p && !idsIn(b.p).length);
      for(const [s, blocks] of per){
        const merged = [];
        for(const b of [...intro.filter(b => !blocks.includes(b)), ...blocks]){
          const last = merged[merged.length - 1];
          if(b.ul && last && last.ul) last.ul = last.ul.concat(b.ul); else merged.push(b.ul ? {ul: [...b.ul]} : b);
        }
        by.get(s).push([e, merged]);
      }
    }
    for(const [s, rows] of by){
      if(!rows.length) continue;
      const g = document.createElement("details"); g.className = "logsec"; g.open = !!state.q;
      g.innerHTML = "<summary>" + '<span class="caret">&#9654;</span>' + esc(s) + '<span class="c">' + rows.length +
        (rows.length === 1 ? " update" : " updates") + " · latest " + esc(longDate(rows[0][0].date)) + "</span></summary>";
      rows.forEach(([e, blocks]) => g.appendChild(logCard(e, blocks, !!state.q, "")));
      list.appendChild(g);
    }
  }
  if(!shown.length) list.insertAdjacentHTML("beforeend", '<div class="empty">No updates match that search.</div>');
  // an id link opens that entry in the list view (even if the address already ends in it)
  list.querySelectorAll("a[data-id]").forEach(l => l.onclick = ev => {
    ev.preventDefault();
    try { history.replaceState(null, "", "#" + l.dataset.id); } catch(e) {}
    openHash(l.dataset.id);
  });
}

function foot(){
  const total = DATA.items.length, fin = DATA.items.filter(i => i.status === "done" || i.status === "pass").length;
  $("foot").textContent = total + " entries · " + fin + " passed or done · source: FEATURES.md" +
    (DATA.updated ? " · updated " + DATA.updated : "") + " · regenerate with build_feature_list.py";
}

document.querySelectorAll("[data-kind]").forEach(b => b.onclick = () => { state.kind = b.dataset.kind; render(); });
$("needBtn").onclick = () => { state.need = !state.need; render(); };
$("hideDone").onclick = () => { state.hideDone = !state.hideDone; store.set("ns.hideDone", state.hideDone ? "1" : "0"); render(); };
$("q").oninput = e => { state.q = e.target.value.trim().toLowerCase(); render(); };
$("secQ").oninput = e => { state.secQ = e.target.value.trim().toLowerCase(); render(); };
$("sort").value = state.sort;
$("sort").onchange = e => { state.sort = e.target.value; store.set("ns.sort", state.sort); render(); window.scrollTo({top:0}); };
let allOpen = false;
$("expand").onclick = () => {
  allOpen = !allOpen;
  document.querySelectorAll("details.item, details.logsec").forEach(d => d.open = allOpen);
  $("expand").textContent = allOpen ? "Collapse all" : "Expand all";
};
const setHH = () => document.documentElement.style.setProperty("--hh", document.querySelector("header").offsetHeight + 8 + "px");
window.addEventListener("resize", setHH);
// narrow screens: the section tree folds away; wide screens: always open (its summary is hidden there)
const narrow = window.matchMedia("(max-width:800px)");
const fitNav = () => { $("navBox").open = !narrow.matches; setHH(); };
narrow.addEventListener("change", fitNav);
fitNav();
function openHash(want){
  const id = typeof want === "string" ? want : decodeURIComponent(location.hash.slice(1));
  if(!id) return;
  const it = DATA.items.find(i => i.id === id);
  if(it && state.view !== "list"){ setView("list"); render(); }
  if(it && !matches(it)){ state.section = ""; state.status = ""; state.kind = "all"; state.need = false; state.hideDone = false; state.q = ""; $("q").value = ""; state.secQ = ""; $("secQ").value = ""; render(); }
  const el = document.getElementById(id);
  if(!el) return;
  el.open = true; el.classList.add("flash");
  el.scrollIntoView({block:"center"});
  setTimeout(() => el.classList.remove("flash"), 1500);
}
window.addEventListener("hashchange", openHash);
render(); setHH(); openHash();
</script>
</body>
